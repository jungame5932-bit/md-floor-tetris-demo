const nf = new Intl.NumberFormat('ko-KR');
const man = (v) => nf.format(Math.round(v));
const eok = (v, d = 1) => (v / 10000).toFixed(d);
const signed = (v, d) => `${v > 0 ? '+' : v < 0 ? '-' : ''}${Math.abs(v).toFixed(d)}`;

/** 매출 요약 — 1억 이상은 억, 미만은 만 원 */
function moneyShort(v) {
  if (v >= 1e8) {
    const e = v / 1e8;
    let t = e >= 10 ? e.toFixed(1) : e.toFixed(2);
    if (t.indexOf('.') > -1) {
      t = t.replace(/0+$/, '');
      if (t.charAt(t.length - 1) === '.') t = t.slice(0, -1);
    }
    return `${t}억`;
  }
  return `${man(Math.round(v / 1e4))}만`;
}

/** 평효율 표시 — 원/평을 천원/평으로 (1,502만 → 15,020천원) */
const effShort = (v) => `${man(Math.round(v / 1e3))}천원`;

/** 신장율(%). 전년 매출이 0 이하이면 null 을 돌려 '신규'로 다룬다. */
function growthOf(curr, prev) {
  if (!(prev > 0)) return null;
  return Math.round((curr / prev) * 1000 - 1000) / 10;
}

/** 평효율(원/평). 평수가 0 이하이면 0. */
function efficiencyOf(curr, pyeong) {
  return pyeong > 0 ? Math.round(curr / pyeong) : 0;
}

/** 이익액(원) */
function profitOf(curr, rate) {
  return Math.round(curr * (rate / 100));
}

/** 신장율 문자열. null 이면 '신규' */
function growthText(g) {
  if (g == null) return '신규';
  return `${g > 0 ? '+' : ''}${g.toFixed(1)}%`;
}

/** 신장율 색상 — 상승 초록, 하락 빨강, 신규 회색 */
function growthColor(g) {
  if (g == null) return '#94A3B8';
  if (g > 0) return '#10B981';
  if (g < 0) return '#EF4444';
  return '#64748B';
}

/**
 * 구역과 브랜드를 합쳐 파생 지표까지 채운 행을 만든다.
 * 화면·정렬·랭킹이 모두 이 행 하나만 본다.
 */
function enrichRow(zone) {
  const b = zone.currentBrand;
  const pyeong = zone.area;
  const salesCurr = typeof b.salesCurr === 'number' ? b.salesCurr : Math.round(pyeong * b.pyeongEfficiency * 1e4);
  const salesPrev = typeof b.salesPrev === 'number' ? b.salesPrev : 0;
  const profitRate = typeof b.profitRate === 'number' ? b.profitRate : b.commissionRate;
  return {
    zoneId: zone.id,
    name: b.name,
    category: b.category,
    pyeong,
    salesCurr,
    salesPrev,
    profitRate,
    growthRate: growthOf(salesCurr, salesPrev),
    efficiency: efficiencyOf(salesCurr, pyeong),
    profitAmt: profitOf(salesCurr, profitRate),
    status: zone.status,
    isReplaced: zone.isReplaced,
    zone,
  };
}

function storeRows(zones) {
  return zones.map(enrichRow);
}

/** 층 합계 — rev·profit 단위는 억 원, eff 는 천원/평 */
function metricsOf(zones) {
  let rev = 0;
  let profit = 0;
  let pyeong = 0;
  zones.forEach((z) => {
    const r = enrichRow(z);
    rev += r.salesCurr / 1e8;
    profit += r.profitAmt / 1e8;
    pyeong += r.pyeong;
  });
  return {
    rev,
    profit,
    pyeong,
    eff: pyeong ? (rev * 1e8) / pyeong / 1e3 : 0,
    profitRate: rev ? (profit / rev) * 100 : 0,
  };
}

const cloneBase = () => ZONES_BASE.map((z) => ({
  ...z,
  currentBrand: { ...z.currentBrand },
  originBrand: { ...z.currentBrand },
}));

/** 업로드 도면에서 만든 구역을 되돌릴 수 있도록 깊은 복사한다 */
const cloneZoneList = (list) => (list || []).map((z) => ({
  ...z,
  currentBrand: { ...z.currentBrand },
  originBrand: { ...(z.originBrand || z.currentBrand) },
}));

/* ---------------- 로컬 저장 ----------------
 * 새로고침해도 고친 값이 남게 localStorage 에 스냅숏을 둔다.
 * 저장 대상은 '값'뿐이다: 도면 배경 이미지(blob URL)는 복원할 수 없으므로 넣지 않는다.
 * 복원할 때는 합계를 반드시 다시 계산한다 — 저장된 합계를 그대로 믿으면
 * 지도에 보이는 브랜드와 상단 KPI 가 어긋난다(11/17 실제 발생).
 */
const STORE_KEY = 'mdft.sheet.v1';

function loadSavedZones() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || data.v !== 1 || !Array.isArray(data.zones) || !data.zones.length) return null;
    // 형상이 없는 행은 버린다 — 그리다 만 상태로 시작하면 화면이 빈다
    const usable = data.zones.filter((z) => z && z.id && z.currentBrand
      && (typeof z.path === 'string' || Array.isArray(z.pts)));
    if (!usable.length) return null;
    return { zones: cloneZoneList(usable), editedZones: data.editedZones || {} };
  } catch (err) {
    return null;
  }
}

function saveZones(zones, editedZones) {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify({
      v: 1,
      savedAt: Date.now(),
      zones: zones.map((z) => ({
        id: z.id,
        area: z.area,
        status: z.status,
        locationType: z.locationType,
        path: z.path,
        pts: z.pts,
        center: z.center,
        labelWidth: z.labelWidth,
        isReplaced: z.isReplaced,
        currentBrand: z.currentBrand,
      })),
      editedZones,
    }));
  } catch (err) {
    // 저장 공간이 없거나 차단된 브라우저 — 앱은 그대로 돌아야 한다
  }
}

function clearSavedZones() {
  try { window.localStorage.removeItem(STORE_KEY); } catch (err) { /* 무시 */ }
}

/** 후보 브랜드를 특정 평수 구역에 놓을 때의 브랜드 객체 */
function brandForZone(cand, area) {
  const curr = Math.round(area * cand.pyeongEfficiency * 1e4);
  const g = typeof cand.growthRate === 'number' ? cand.growthRate : null;
  const prev = g != null && g > -99.9 ? Math.round(curr / (1 + g / 100)) : 0;
  return {
    name: cand.name,
    category: cand.category,
    pyeongEfficiency: cand.pyeongEfficiency,
    commissionRate: cand.commissionRate,
    salesCurr: curr,
    salesPrev: prev,
    profitRate: cand.profitRate,
  };
}

/* ================================================================
 * 도면에서 읽은 구획 → 구역 객체
 * ================================================================ */

const PLAN_TOTAL_PYEONG = 200;

/** 구획 자동 인식이 가능한 형식인지 */
function isRasterPlan(file) {
  const ext = ((file && file.name) || '').match(/\.([a-z0-9]+)$/i);
  const kind = ext ? ext[1].toLowerCase() : '';
  if (kind === 'jpg' || kind === 'jpeg' || kind === 'png') return true;
  return /^image\/(jpeg|png)$/i.test((file && file.type) || '');
}

/** 다각형 무게중심 (면적 가중) — 라벨을 도형 가운데에 놓기 위함 */
function centroidOf(pts) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    const cross = p[0] * q[1] - q[0] * p[1];
    a += cross;
    cx += (p[0] + q[0]) * cross;
    cy += (p[1] + q[1]) * cross;
  }
  if (Math.abs(a) < 1e-9) {
    const xs = pts.map((p) => p[0]);
    const ys = pts.map((p) => p[1]);
    return { x: (Math.min(...xs) + Math.max(...xs)) / 2, y: (Math.min(...ys) + Math.max(...ys)) / 2 };
  }
  return { x: cx / (3 * a), y: cy / (3 * a) };
}

/** 좌표 배열 → SVG path d */
function pathFromPts(pts) {
  const r = (v) => Math.round(v * 100) / 100;
  return 'M ' + pts.map((p) => `${r(p[0])},${r(p[1])}`).join(' L ') + ' Z';
}

/** 다각형 면적 — 에지 튜닝 후 크기를 다시 재야 한다 */
function polygonArea(pts) {
  let a = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const p = pts[i];
    const q = pts[(i + 1) % n];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return Math.abs(a) / 2;
}

/** 꼭짓점 배열로부터 bbox·라벨 크기를 다시 계산한다 */
function geometryOfPts(pts) {
  const xs = pts.map((p) => p[0]);
  const ys = pts.map((p) => p[1]);
  const x0 = Math.min(...xs);
  const y0 = Math.min(...ys);
  const w = Math.max(...xs) - x0;
  const h = Math.max(...ys) - y0;
  return {
    bbox: { x: x0, y: y0, w, h },
    center: { x: x0 + w / 2, y: y0 + h / 2 },
    // 하한을 28px 로 두면 폭 19px 짜리 작은 칸에서도 라벨 박스가 칸보다 넓어져
    // 글자가 도형 밖으로 삐진다. 실제 폭을 그대로 넘겨 라벨이 스스로 줄어들게 한다.
    labelWidth: Math.max(0, Math.min(w * 0.94, 240)),
    labelHeight: Math.max(0, h * 0.92),
  };
}

/**
 * 자동 인식 결과(픽셀 좌표 폴리곤)를 도면 좌표계(VIEWBOX)로 옮긴다.
 * 비율 보정은 백엔드가 준 원본 해상도로 계산해서 도면이 찌그러지지 않게 한다.
 */
function visionZonesToRegions(data) {
  if (!data || !Array.isArray(data.zones) || !data.zones.length) return null;
  const srcW = Number(data.imageWidth) || 1;
  const srcH = Number(data.imageHeight) || 1;
  // 원본 비율을 유지하면서 VIEWBOX 안에 맞춘다 (letterbox)
  const scale = Math.min(VIEWBOX.w / srcW, VIEWBOX.h / srcH);
  const offsetX = (VIEWBOX.w - srcW * scale) / 2;
  const offsetY = (VIEWBOX.h - srcH * scale) / 2;
  const rect = { x: offsetX, y: offsetY, w: srcW * scale, h: srcH * scale };

  const regions = data.zones
    .map((zone) => {
      const pts = (zone.polygonPoints || [])
        .filter((p) => Array.isArray(p) && p.length >= 2)
        .map((p) => [Number(p[0]) * scale + offsetX, Number(p[1]) * scale + offsetY])
        .filter((p) => Number.isFinite(p[0]) && Number.isFinite(p[1]));
      const box = Array.isArray(zone.bbox) ? zone.bbox : [0, 0, 0, 0];
      return {
        pts,
        area: Number(zone.estimatedArea) || 0,
        bbox: {
          x: Number(box[0]) * scale + offsetX,
          y: Number(box[1]) * scale + offsetY,
          w: Number(box[2]) * scale,
          h: Number(box[3]) * scale,
        },
        zoneId: zone.zoneId,
      };
    })
    .filter((r) => r.pts.length >= 3 && r.area > 0);

  if (!regions.length) return null;
  return { regions, rect };
}

/** 브랜드를 주어진 평수에 맞춰 배치 — 평효율은 유지하고 매출만 다시 계산 */
function brandAtPyeong(brand, area) {
  const src = brand || {};
  const curr0 = typeof src.salesCurr === 'number' && src.salesCurr > 0
    ? src.salesCurr
    : Math.round(area * (src.pyeongEfficiency || 1000) * 1e4);
  const eff = typeof src.pyeongEfficiency === 'number' && src.pyeongEfficiency > 0
    ? src.pyeongEfficiency
    : curr0 / Math.max(1, area) / 1e4;
  const curr = Math.round(area * eff * 1e4);
  // 전년 매출이 없으면 알려진 신장율로 역산한다 (후보 브랜드는 growthRate 만 갖고 있다)
  let prev0 = typeof src.salesPrev === 'number' ? src.salesPrev : 0;
  if (!(prev0 > 0) && typeof src.growthRate === 'number' && src.growthRate > -99.9) {
    prev0 = Math.round(curr0 / (1 + src.growthRate / 100));
  }
  const g = growthOf(curr0, prev0);
  const prev = g != null && g > -99.9 ? Math.round(curr / (1 + g / 100)) : prev0;
  return {
    name: src.name || '미정',
    category: src.category || '기타',
    pyeongEfficiency: eff,
    commissionRate: typeof src.commissionRate === 'number' ? src.commissionRate : 16,
    salesCurr: curr,
    salesPrev: prev,
    profitRate: typeof src.profitRate === 'number' ? src.profitRate : (src.commissionRate || 16),
  };
}

/**
 * 업로드한 도면에서 추출한 구획을 그대로 구역으로 세운다.
 * 도면의 물리적 위치·모양을 쓰고, 평수는 구획面積 비율로 총 평수를 배분한다.
 * 브랜드는 기존 풀을 순서대로 물려받되 새 평수로 매출을 재계산한다.
 */
function zonesFromRegions(regions, brandPool, totalPyeong) {
  if (!regions || !regions.length) return null;
  // 벽·기둥 같은 잔휘 조각을 걸러내고 큰 구획만 쓴다
  const list0 = regions
    .filter((r) => r && r.pts && r.pts.length >= 3 && r.area > 0)
    .slice(0, 120);
  if (!list0.length) return null;

  // 도면 전체를 덮는 배경/외벽 사각형은 구획이 아니다
  const all = list0.reduce((acc, r) => {
    const x0 = r.bbox.x, y0 = r.bbox.y, x1 = r.bbox.x + r.bbox.w, y1 = r.bbox.y + r.bbox.h;
    return {
      x0: Math.min(acc.x0, x0), y0: Math.min(acc.y0, y0),
      x1: Math.max(acc.x1, x1), y1: Math.max(acc.y1, y1),
    };
  }, { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity });
  const canvasArea = Math.max(1, (all.x1 - all.x0) * (all.y1 - all.y0));
  const areaSumAll = list0.reduce((s, r) => s + r.area, 0) || 1;

  const list = list0.filter((r) => {
    const cover = (r.bbox.w * r.bbox.h) / canvasArea;
    const share = r.area / areaSumAll;
    // 도면의 65% 이상을 덮거나, 전체의 60% 이상 면적이면 배경/외벽으로 본다
    return cover < 0.65 && share < 0.6;
  }).slice(0, 120);
  if (!list.length) return null;

  const total = totalPyeong || PLAN_TOTAL_PYEONG;
  const areaSum = list.reduce((s, r) => s + r.area, 0) || 1;

  const out = list.map((r, i) => {
    const pyeong = Math.max(1, Math.round((r.area / areaSum) * total));
    return {
      id: `Z-${String(i + 1).padStart(2, '0')}`,
      area: pyeong,
      status: '보통',
      locationType: `도면 구획 ${i + 1}`,
      path: pathFromPts(r.pts),
      // 에지 튜닝용 원본 꼭짓점 — 드래그하면 여기서 좌표를 갱신한다
      pts: r.pts.map((p) => [p[0], p[1]]),
      auto: true,
      // 라벨은 다각형 무게중심이 아니라 bbox 중심에 놉는다. 오목한 폴리곤은
      // 무게중심이 도형 밖으로 나가거나 한쪽으로 치우쳐 글자가 삐진다.
      center: { x: r.bbox.x + r.bbox.w / 2, y: r.bbox.y + r.bbox.h / 2 },
      labelWidth: Math.max(0, Math.min(r.bbox.w * 0.94, 240)),
      labelHeight: Math.max(0, r.bbox.h * 0.92),
      currentBrand: null,
      isReplaced: false,
    };
  });

  // 반올림 오차를 가장 큰 구획에 몰아넣어 합계를 총평수에 맞춘다
  const diff = total - out.reduce((s, z) => s + z.area, 0);
  out[0].area = Math.max(1, out[0].area + diff);

  // 구획이 브랜드 풀보다 많으면 이름이 순환 중복된다.
  // 입점 풀 → 교체 후보 순으로 채워서 최대한 서로 다른 이름을 쓰게 한다.
  const base = brandPool && brandPool.length ? brandPool : ZONES_BASE.map((z) => z.currentBrand);
  const pool = base.slice();
  for (const c of CANDIDATES) {
    if (pool.length >= out.length) break;
    if (pool.some((b) => b.name === c.name)) continue;
    pool.push(c);
  }

  out.forEach((z, i) => {
    // 글자 판독을 하지 않으므로 브랜드명은 기존 풀에서 순서대로 채운다
    const src = pool[i];
    if (src) {
      const brand = brandAtPyeong(src, z.area);
      z.currentBrand = brand;
      z.originBrand = { ...brand };
      return;
    }
    // 그래도 모자라면 이름을 구분해 중복을 없앤다
    const brand = brandAtPyeong(base[i % base.length], z.area);
    brand.name = `${brand.name} ${Math.floor(i / base.length) + 1}`;
    z.currentBrand = brand;
    z.originBrand = { ...brand };
  });
  return out;
}

const SORTS = [
  { key: 'salesCurr', label: '매출순' },
  { key: 'growthRate', label: '신장율순' },
  { key: 'efficiency', label: '평효율순' },
  { key: 'pyeong', label: '평수순' },
  { key: 'profitRate', label: '이익율순' },
  { key: 'profitAmt', label: '이익액순' },
];

/**
 * 대시보드·정렬·편집이 공유하는 지표 정의.
 * unit  : 'won' | 'wonPerPyeong' | 'percent' | 'pyeong'
 * edit  : 인라인 편집을 허용할지 (파생 전용 지표는 읽기 전용)
 */
const METRICS = [
  { key: 'salesCurr', label: '매출', icon: 'TrendingUp', unit: 'won', editable: true, fmt: (v) => moneyShort(v) },
  { key: 'efficiency', label: '평효율', icon: 'Gauge', unit: 'wonPerPyeong', editable: true, fmt: (v) => effShort(v) },
  { key: 'profitRate', label: '이익율', icon: 'Percent', unit: 'percent', editable: true, fmt: (v) => `${Number(v.toFixed(1))}%` },
  { key: 'profitAmt', label: '이익액', icon: 'Wallet', unit: 'won', editable: true, fmt: (v) => moneyShort(v) },
  { key: 'growthRate', label: '신장율', icon: 'LineChart', unit: 'percent', editable: false, fmt: (v) => growthText(v) },
  { key: 'salesPrev', label: '전년매출', icon: 'History', unit: 'won', editable: true, fmt: (v) => moneyShort(v) },
  { key: 'pyeong', label: '평수', icon: 'Ruler', unit: 'pyeong', editable: false, fmt: (v) => `${v}평` },
];

const METRIC_BY_KEY = {};
METRICS.forEach((m) => { METRIC_BY_KEY[m.key] = m; });

const DEFAULT_COLUMNS = ['salesCurr', 'efficiency', 'profitRate', 'profitAmt'];

function metricFmt(key, v) {
  const m = METRIC_BY_KEY[key];
  return m ? m.fmt(v) : String(v);
}

/**
 * 인라인 입력값을 지표 단위로 해석한다.
 * 반환: { ok, value } — 실패하면 원래 값으로 롤백해야 한다.
 */
function parseMetricInput(key, raw, row) {
  const text = String(raw == null ? '' : raw).trim().replace(/,/g, '').replace(/[%\s원평억만]/g, '');
  if (text === '' || text === '-' || text === '.') return { ok: false, reason: '값을 입력하세요' };
  const num = Number(text);
  if (!Number.isFinite(num)) return { ok: false, reason: '숫자가 아닙니다' };
  if (num <= 0) return { ok: false, reason: '0보다 큰 값을 입력하세요' };
  const unit = (METRIC_BY_KEY[key] || {}).unit;
  let value = num;
  if (unit === 'won') {
    // 매출·이익액·전년매출은 억 단위로 입력받는다 (9.1 → 9.1억)
    if (num > 100) return { ok: false, reason: '100억을 넘을 수 없습니다' };
    value = Math.round(num * 1e8);
  } else if (unit === 'wonPerPyeong') {
    // 평효율은 천원 단위로 입력받는다 (24,000 → 24,000천원/평 = 2,400만원/평)
    if (num > 100000) return { ok: false, reason: '평효율이 범위를 벗어났습니다' };
    value = Math.round(num * 1e3);
  } else if (unit === 'percent') {
    if (num > 100) return { ok: false, reason: '100%를 넘을 수 없습니다' };
    value = Math.round(num * 10) / 10;
  } else if (unit === 'pyeong') {
    value = Math.round(num);
  }
  if (!Number.isFinite(value) || value <= 0) return { ok: false, reason: '0보다 큰 값을 입력하세요' };
  return { ok: true, value };
}

/** 입력값을 화면 표시용 원시 숫자로 (편집기 초기값) — won 계열은 억 단위로 보여준다 */
function metricEditValue(key, row) {
  const unit = (METRIC_BY_KEY[key] || {}).unit;
  if (unit === 'won') return String(Math.round((row[key] / 1e8) * 100) / 100);
  if (unit === 'wonPerPyeong') return String(Math.round(row[key] / 1e3));
  if (unit === 'percent') return String(Number(Number(row[key]).toFixed(1)));
  if (unit === 'pyeong') return String(row[key]);
  return String(row[key]);
}

/**
 * 지표 하나를 수정했을 때 브랜드 원천값(salesCurr/salesPrev/profitRate)을 역산한다.
 * 지시서 Step 2 의 네 가지 규칙을 그대로 구현한다.
 * 반환: 새 브랜드 객체, 또는 null(변경 불가)
 */
function applyMetricEdit(brand, pyeong, key, value) {
  const b = { ...brand };
  const curr = typeof b.salesCurr === 'number' ? b.salesCurr : 0;
  const prev = typeof b.salesPrev === 'number' ? b.salesPrev : 0;
  const rate = typeof b.profitRate === 'number' ? b.profitRate : 0;

  if (key === 'salesCurr') {
    // 매출 직접 수정 → 신장율·평효율·이익액은 파생이라 자동 갱신된다
    b.salesCurr = Math.round(value);
  } else if (key === 'efficiency') {
    // 목표 평효율 시뮬레이션 → 매출을 역산
    if (!(pyeong > 0)) return null;
    b.salesCurr = Math.round(value * pyeong);
  } else if (key === 'profitRate') {
    b.profitRate = Math.min(100, Math.max(0, Math.round(value * 10) / 10));
  } else if (key === 'profitAmt') {
    // 이익액 직접 수정 → 이익율을 역산
    if (!(curr > 0)) return null;
    b.profitRate = Math.min(100, Math.max(0, Math.round((value / curr) * 1000) / 10));
  } else if (key === 'salesPrev') {
    b.salesPrev = Math.round(value);
  } else {
    return null;
  }
  return b;
}

/** 신장율 null(신규)은 정렬 방향과 무관하게 항상 맨 아래로 보낸다. */
function sortRows(rows, key, dir) {
  const out = rows.slice();
  out.sort((a, b) => {
    const av = a[key];
    const bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return dir === 'asc' ? av - bv : bv - av;
  });
  return out;
}

/** 목록 행에 표시할 정렬 기준 수치 */
function metricText(row, key) {
  if (key === 'salesCurr') return moneyShort(row.salesCurr);
  if (key === 'growthRate') return growthText(row.growthRate);
  if (key === 'efficiency') return effShort(row.efficiency);
  if (key === 'pyeong') return `${row.pyeong}평`;
  if (key === 'profitRate') return `${row.profitRate}%`;
  if (key === 'profitAmt') return moneyShort(row.profitAmt);
  return '';
}

/* ================================================================
 * 3. ICONS (lucide UMD 노드 = ['svg', attrs, children])
 * ================================================================ */

const ICONS = new Map();
const ATTR_MAP = {
  'stroke-width': 'strokeWidth', 'stroke-linecap': 'strokeLinecap',
  'stroke-linejoin': 'strokeLinejoin', 'stroke-dasharray': 'strokeDasharray',
  'fill-rule': 'fillRule', 'clip-rule': 'clipRule',
};

function Icon({ name, size = 14, stroke = 2, className = '' }) {
  if (!ICONS.has(name)) {
    const lib = typeof window !== 'undefined' ? window.lucide : null;
    ICONS.set(name, lib && lib[name] ? lib[name] : null);
  }
  const node = ICONS.get(name);
  if (!node || !Array.isArray(node[2])) return null;
  const kids = node[2].map((child, i) => {
    const [tag, raw] = child;
    const props = { key: `${tag}-${i}` };
    Object.entries(raw || {}).forEach(([k, v]) => { props[ATTR_MAP[k] || k] = v; });
    return React.createElement(tag, props);
  });
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round"
      strokeLinejoin="round" className={className} aria-hidden="true" focusable="false">
      {kids}
    </svg>
  );
}

/* ================================================================
 * 4. ATOMS
 * ================================================================ */

function DeltaPill({ value, unit, digits = 1 }) {
  const zero = Math.abs(value) < (digits > 1 ? 0.005 : 0.5);
  const cls = zero
    ? 'bg-slate-100 text-slate-500'
    : value > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';
  return (
    <span className={`inline-flex shrink-0 items-center gap-0.5 rounded-full px-2 py-0.5 text-[11px] font-black tabular ${cls}`}>
      {zero ? '기준' : (
        <>
          <Icon name={value > 0 ? 'ArrowUp' : 'ArrowDown'} size={10} stroke={3} />
          {`${Math.abs(value).toFixed(digits)}${unit}`}
        </>
      )}
    </span>
  );
}

function KpiCapsule({ label, value, unit, delta, deltaUnit, digits, footnote }) {
  return (
    <div className="flex items-start gap-3 px-1 py-1">
      <div className="min-w-0">
        <p className="whitespace-nowrap text-[10.5px] font-bold tracking-wide text-slate-400">{label}</p>
        <p className="mt-1 flex items-baseline gap-1 whitespace-nowrap tabular text-slate-900">
          <span className="text-[30px] font-black leading-none tracking-tighter">{value}</span>
          <span className="text-[13px] font-bold text-slate-400">{unit}</span>
        </p>
      </div>
      <div className="flex flex-col items-end gap-1 pt-0.5">
        <DeltaPill value={delta} unit={deltaUnit} digits={digits} />
        {footnote ? <span className="whitespace-nowrap text-[9.5px] font-semibold tabular text-slate-400">{footnote}</span> : null}
      </div>
    </div>
  );
}

/* ================================================================
 * 5. ZONE POLYGON — 비정형 SVG 매장 블록
 * ================================================================ */

function ZoneShape({
  zone, row, hovered, selected, dropActive, dragKind, dragging, pulsing,
  pointerDragEnabled, tabIndex,
  onHover, onLeave, onActivate,
  onApplyBrand, onSwap, onDragStartZone, onDragEndZone,
  onPointerDragStart, onVertexDrag, ghost, bgHidden, zonesOnly,
}) {
  // 드래그 중일 때만 드롭 표시(빨간 테두리 + 안내 문구)를 켠다
  const dropMode = dropActive && Boolean(dragKind);
  const replaced = zone.isReplaced;
  const warning = !replaced && zone.status === '부진';
  const compact = zone.labelWidth < 130;
  const small = !compact && zone.labelWidth < 180;

  const fill = replaced
    ? '#ECFDF5'
    : dropMode
      ? '#FFF1F2'
      : hovered
        ? '#FFF8F8'
        : zone.auto
          ? '#2563EB'
          : '#FFFFFF';
  // 자동 인식 구획은 원본 이미지 위에 파란 구획선으로 얹는다 (지시서 검증 3번).
  // 채움은 거의 투명하게 두고 테두리만 파랑으로 살린다.
  // 빨강은 '역신장'과 '삭제'에만 쓴다 (지시서 Task 7-1). 선택·드롭 표시는 네이비 계열.
  const stroke = dropMode
    ? '#4C1D95'
    : replaced
      ? '#059669'
      : hovered
        ? '#1E3A8A'
        : warning
          ? '#F59E0B'
          : zone.auto
            ? '#2563EB'
            : '#CBD5E1';
  // '구역만 표시'는 외곽선을 읽는 모드다 — 채우면 덩어리로 보여 경계가 사라진다.
  // 그래서 이 모드에서만 채움을 거의 없애고 테두리를 올린다.
  const onlyOutline = Boolean(zonesOnly);
  const strokeWidth = onlyOutline
    ? (dropMode ? 3.6 : hovered ? 3 : 2)
    : (dropMode ? 3.4 : replaced ? 3 : hovered ? 2.6 : zone.auto ? 1.6 : 1.5);
  // 배경 도면을 끈 상태에서는 폴리콘을 진하게 채워 텍스트 대비를 확보한다 (지시서 4번)
  const fillOpacity = onlyOutline
    ? 0.05
    : zone.auto
      ? (bgHidden ? 0.8 : 0.12)
      : (ghost ? (bgHidden ? 0.9 : 0.62) : 1);

  const { x: cx, y: cy } = zone.center;
  // 지시서 Task 2 — 4행(브랜드명 · 매출/신장율 · 평효율 · 평수)을 모든 구역에서 상시 노출한다.
  // 예전에는 미선택 소구역이 2행으로 접혀 Z-04 의 평효율 줄이 아예 사라졌다.
  // 행 삭제·말줄임은 금지 — 좁은 칸은 글자 폭을 압축하고, 20평 미만은 그룹을 0.75 로 줄인다.
  // 화면 기준 가독 구간 10~14px 을 지킨다 (지시서 Item 4).
  // 좁은 칸은 12px 로 낮추고, 그래도 넘치면 그룹을 축소한다.
  const fsName = Math.max(10, Math.min(14, compact ? 12 : small ? 12.5 : 13.5));
  const fsSub = Math.max(10, Math.min(12, fsName * 0.92));
  const lh = fsName * 1.42;
  // 20평 미만 소구역은 4행을 유지하려고 그룹을 축소하되,
  // 축소 후에도 10px 아래로 내려가지 않게 하한을 건다 (9px 는 판독 불가).
  const areaSmall = typeof zone.area === 'number' && zone.area > 0 && zone.area < 20;
  const labelScale = areaSmall ? Math.max(10 / fsName, 0.75) : 1;
  const blockH = lh * 3 + fsName * 1.25;
  const lineTop = cy - blockH / 2 + fsName * 0.98;
  const y1 = lineTop;
  const y2 = lineTop + lh;
  const y3 = lineTop + lh * 2;
  const y4 = lineTop + lh * 3;
  // 배지(NEW·개편요망)는 폭 34~54px 라 좁은 칸에서는 밖으로 나간다.
  const showBadge = !(typeof zone.labelWidth === 'number') || zone.labelWidth >= 58;
  // 텍스트 그룹을 중심 기준으로 축소한다 (transform-origin: center 등가)
  const labelTransform = labelScale === 1
    ? undefined
    : `translate(${cx} ${cy}) scale(${labelScale}) translate(${-cx} ${-cy})`;

  // 한글은 전각(1.0em), 영문·숫자는 0.56em 로 잡아 실제 폭을 계산한다.
  const charEm = (ch) => (/[\uac00-\ud7a3\u3131-\u318e]/.test(ch) ? 1.0 : ch === ' ' ? 0.32 : 0.56);
  const textEm = (s) => Array.from(s).reduce((acc, ch) => acc + charEm(ch), 0);
  const boxW = Math.max(0, typeof zone.labelWidth === 'number' ? zone.labelWidth : 200);
  // 말줄임 대신 textLength 로 압축한다. scale 이 걸린 칸은 그만큼 폭 여유가 생긴다.
  const fitW = Math.max(6, (boxW - 4) / labelScale);
  const fitTextLength = (str, fs) => (textEm(str) * fs > fitW ? fitW : undefined);

  const finalName = row.name;
  const subText = `월 ${moneyShort(row.salesCurr)} / ${growthText(row.growthRate)}`;
  const effText = `평효율 ${man(Math.round(row.efficiency / 1e3))}천원/평`;
  const pyeongText = `${row.pyeong}평 · ${zone.id}`;
  const badgeY = y1 - fsName - 3;
  const growth = row.growthRate;
  const gColor = growthColor(growth);

  return (
    <g
      role="button"
      tabIndex={typeof tabIndex === 'number' ? tabIndex : 0}
      data-zone={zone.id}
      className={`zone-group cursor-pointer outline-none ${dragging ? 'zone-dragging' : ''} ${pulsing ? 'swap-pulse' : ''}`}
      onMouseDown={(ev) => {
        if (!pointerDragEnabled) return;
        if (ev.button !== 0) return;
        onPointerDragStart(ev, zone.id, row);
      }}
      aria-label={`${zone.id} ${zone.locationType} ${row.pyeong}평 ${row.name} ${row.category} 매출 ${moneyShort(row.salesCurr)} 신장율 ${growthText(growth)} 평효율 ${man(Math.round(row.efficiency / 1e3))}천원 이익율 ${row.profitRate}퍼센트`}
      onMouseEnter={() => onHover(zone.id)}
      onMouseLeave={onLeave}
      onClick={() => onActivate(zone.id, 'zone')}
      onKeyDown={(ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          // 키보드 Enter 는 선택/입점만 — 두 번째 Enter 가 의도치 않게 자리 교환을 일으키지 않게 한다
          onActivate(zone.id, 'key');
          return;
        }
        // 구역 간 이동은 화살표 키 — Tab 을 6번 누르지 않아도 된다
        if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft' || ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
          ev.preventDefault();
          const groups = Array.from(document.querySelectorAll('g[data-zone]'));
          const i = groups.indexOf(ev.currentTarget);
          if (i < 0 || groups.length < 2) return;
          const step = (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') ? 1 : -1;
          const next = groups[(i + step + groups.length) % groups.length];
          if (next) next.focus();
        }
      }}
      draggable
      onDragStart={(ev) => {
        ev.dataTransfer.setData('application/x-zone', zone.id);
        ev.dataTransfer.effectAllowed = 'move';
        onDragStartZone(zone.id);
      }}
      onDragEnd={onDragEndZone}
      onDragOver={(ev) => {
        const types = ev.dataTransfer.types;
        if (types.includes('application/x-zone') || types.includes('application/json')) {
          ev.preventDefault();
          ev.dataTransfer.dropEffect = types.includes('application/x-zone') ? 'move' : 'copy';
        }
      }}
      onDrop={(ev) => {
        const srcZone = ev.dataTransfer.getData('application/x-zone');
        if (srcZone) {
          ev.preventDefault();
          ev.stopPropagation();
          if (srcZone !== zone.id) onSwap(srcZone, zone.id);
          return;
        }
        const raw = ev.dataTransfer.getData('application/json');
        if (raw) {
          ev.preventDefault();
          ev.stopPropagation();
          try { onApplyBrand(zone.id, JSON.parse(raw)); } catch (err) { onApplyBrand(zone.id, null); }
        }
      }}
    >
      <title>{`${finalName} · ${row.category}\n월 ${moneyShort(row.salesCurr)} / ${growthText(row.growthRate)}\n${effText}\n${pyeongText}`}</title>

      <path
        className="zone-shape zone-poly"
        d={zone.path}
        fill={fill}
        fillOpacity={fillOpacity}
        stroke={stroke}
        strokeWidth={strokeWidth}
        strokeLinejoin="round"
        filter="url(#soft-shadow)"
      />

      {selected ? (
        <path d={zone.path} fill="none" stroke="#1E3A8A" strokeWidth="2.4" strokeOpacity="0.9" strokeLinejoin="round" />
      ) : null}

      {selected && zone.auto && Array.isArray(zone.pts) && zone.pts.length >= 3 ? (
        <g className="vertex-handles">
          {zone.pts.map((p, i) => (
            <circle
              key={`v-${i}`}
              className="vertex-handle"
              cx={p[0]}
              cy={p[1]}
              r={5.5}
              fill="#FFFFFF"
              stroke="#2563EB"
              strokeWidth={2}
              style={{ cursor: 'grab' }}
              onClick={(ev) => ev.stopPropagation()}
              onMouseDown={(ev) => {
                // 꼭짓점 드래그 — 구역 전체 드래그로 번지지 않게 막는다
                ev.preventDefault();
                ev.stopPropagation();
                if (!onVertexDrag) return;
                const svg = ev.currentTarget.ownerSVGElement;
                if (!svg) return;
                const ctm = svg.getScreenCTM();
                if (!ctm) return;
                const inv = ctm.inverse();
                const toSvg = (clientX, clientY) => {
                  const pt = svg.createSVGPoint();
                  pt.x = clientX;
                  pt.y = clientY;
                  const q = pt.matrixTransform(inv);
                  return [q.x, q.y];
                };
                const move = (me) => {
                  const [x, y] = toSvg(me.clientX, me.clientY);
                  onVertexDrag(zone.id, i, x, y, false);
                };
                const up = (ue) => {
                  const [x, y] = toSvg(ue.clientX, ue.clientY);
                  onVertexDrag(zone.id, i, x, y, true);
                  document.removeEventListener('mousemove', move);
                  document.removeEventListener('mouseup', up);
                };
                document.addEventListener('mousemove', move);
                document.addEventListener('mouseup', up);
              }}
            />
          ))}
        </g>
      ) : null}

      {!showBadge ? null : dropMode ? (
        <text x={cx} y={badgeY - 6} textAnchor="middle" fill="#4C1D95" fontSize={12} fontWeight="900" fontFamily="Pretendard, sans-serif">
          {dragKind === 'zone' ? '⇄ 자리 교환' : '＋ 여기에 입점'}
        </text>
      ) : replaced ? (
        <g transform={`translate(${cx - 17}, ${badgeY - 15})`}>
          <rect width="34" height="16" rx="8" fill="#059669" />
          <text x="17" y="11.5" textAnchor="middle" fill="#FFFFFF" fontSize={12} fontWeight="900" fontFamily="Pretendard, sans-serif">NEW</text>
        </g>
      ) : warning ? (
        <g transform={`translate(${cx - 27}, ${badgeY - 15})`}>
          <rect width="54" height="16" rx="8" fill="#FEF3C7" stroke="#F59E0B" strokeWidth="1" />
          <text x="27" y="11.5" textAnchor="middle" fill="#B45309" fontSize={12} fontWeight="800" fontFamily="Pretendard, sans-serif">
            {compact ? '개선' : '개편요망'}
          </text>
        </g>
      ) : null}

      {/* 4행 라벨 — 말줄임·행 삭제 없이 항상 그린다.
          20평 미만 칸은 그룹 전체를 0.75 로 축소한다 (지시서 Task 2 / B18).
          흰 테두리(paint-order: stroke)를 깔아 이웃 구역 경계선 위에서도 읽힌다. */}
      <g transform={labelTransform}>
        <text
          x={cx}
          y={y1}
          textAnchor="middle"
          fill="#0F172A"
          fontSize={fsName}
          fontWeight="900"
          fontFamily="Pretendard, sans-serif"
          stroke="#FFFFFF"
          strokeWidth={3}
          paintOrder="stroke"
          textLength={fitTextLength(finalName, fsName)}
          lengthAdjust="spacingAndGlyphs"
        >
          {finalName}
        </text>

        <text
          x={cx}
          y={y2}
          textAnchor="middle"
          fontSize={fsSub}
          fontWeight="800"
          fontFamily="Pretendard, sans-serif"
          stroke="#FFFFFF"
          strokeWidth={2.5}
          paintOrder="stroke"
          textLength={fitTextLength(subText, fsSub)}
          lengthAdjust="spacingAndGlyphs"
        >
          <tspan fill="#334155">{`월 ${moneyShort(row.salesCurr)}`}</tspan>
          <tspan fill="#94A3B8" fontWeight="600">{' / '}</tspan>
          <tspan fill={gColor}>{growthText(growth)}</tspan>
        </text>

        <text
          x={cx}
          y={y3}
          textAnchor="middle"
          fill="#475569"
          fontSize={fsSub}
          fontWeight="700"
          fontFamily="Pretendard, sans-serif"
          stroke="#FFFFFF"
          strokeWidth={2.5}
          paintOrder="stroke"
          textLength={fitTextLength(effText, fsSub)}
          lengthAdjust="spacingAndGlyphs"
        >
          {effText}
        </text>

        <text
          x={cx}
          y={y4}
          textAnchor="middle"
          fontSize={fsSub}
          fontWeight="700"
          fontFamily="Pretendard, sans-serif"
          stroke="#FFFFFF"
          strokeWidth={2.5}
          paintOrder="stroke"
          textLength={fitTextLength(pyeongText, fsSub)}
          lengthAdjust="spacingAndGlyphs"
        >
          <tspan fill="#0F172A">{`${row.pyeong}평`}</tspan>
          <tspan fill="#94A3B8" fontWeight="600">{` · ${zone.id}`}</tspan>
        </text>
      </g>
    </g>
  );
}

/* ================================================================
 * 6. FLOOR PLAN
 * ================================================================ */

const OUTER_PATH = 'M 50,140 Q 500,40 920,110 L 960,380 L 890,620 L 320,620 L 50,560 Z';
const CORRIDOR = 'M 500,70 Q 400,180 370,280 Q 340,410 520,500 L 610,625';

function FloorPlan({
  rows, hovered, selectedZoneId, dropZoneId, dragZoneId, candidateDrag,
  pulseZone, pointerDragEnabled,
  onHover, onLeave, onActivate, onApplyBrand, onSwap, onDragStartZone, onDragEndZone,
  onPointerDragStart, onVertexDrag,
  plan, showZones, analysis, showTrace, showRegions, showBg, zonesOnly,
}) {
  // DXF처럼 배경 이미지 없이 벡터 라인만 있는 도면도 '업로드됨'으로 취급한다
  const uploaded = Boolean(plan);
  // 구역만 표시면 원본·추적선을 모두 끈다 (구역 외곽선·라벨만 남긴다)
  const onlyZones = Boolean(zonesOnly) && uploaded;
  const traceOn = showTrace && !onlyZones;
  // 배경을 끈 상태에서는 원본이 사라지므로 폴리곤 채움을 진하게 올린다 (지시서 4번)
  const bgHidden = !showBg || onlyZones;

  /* ---------------- 확대 · 축소 (휠 / 드래그 팬 / 버튼) ----------------
   * 도면 요소의 좌표는 건드리지 않고 viewBox 창만 좁힌다.
   * 그래서 구역 폴리곤·판정·계산 로직에는 영향이 없다. */
  const baseVB = uploaded
    ? { x: 0, y: 0, w: VIEWBOX.w, h: VIEWBOX.h }
    : { x: PLAN_TIGHT_VIEW.x, y: PLAN_TIGHT_VIEW.y, w: PLAN_TIGHT_VIEW.w, h: PLAN_TIGHT_VIEW.h };
  const MAX_ZOOM = 8;
  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [panning, setPanning] = useState(false);
  const svgRef = useRef(null);
  const zoomRef = useRef(1);
  const panRef = useRef({ x: 0, y: 0 });
  const baseW = baseVB.w;
  const baseH = baseVB.h;
  const baseCx = baseVB.x + baseW / 2;
  const baseCy = baseVB.y + baseH / 2;

  // 확대해도 창이 도면 밖으로 새지 않게 중심을 가둔다
  const setView = useCallback((z2, px, py) => {
    const zz = Math.max(1, Math.min(MAX_ZOOM, z2));
    const limX = Math.max(0, (baseW - baseW / zz) / 2);
    const limY = Math.max(0, (baseH - baseH / zz) / 2);
    const nx = Math.max(-limX, Math.min(limX, px));
    const ny = Math.max(-limY, Math.min(limY, py));
    zoomRef.current = zz;
    panRef.current = { x: nx, y: ny };
    setZoom(zz);
    setPan({ x: nx, y: ny });
  }, [baseW, baseH]);

  // 화면의 한 점을 고정한 채 배율만 바꾼다 (휠 커서 위치가 그대로 남는다)
  const zoomAt = useCallback((z2, clientX, clientY) => {
    const z1 = zoomRef.current;
    const nz = Math.max(1, Math.min(MAX_ZOOM, z2));
    if (Math.abs(nz - z1) < 1e-6) return;
    const svg = svgRef.current;
    const ctm = svg ? svg.getScreenCTM() : null;
    if (!svg || !ctm) { setView(nz, panRef.current.x, panRef.current.y); return; }
    const pt = svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    const q = pt.matrixTransform(ctm.inverse());
    const vw1 = baseW / z1;
    const vh1 = baseH / z1;
    const zx = baseCx + panRef.current.x - vw1 / 2;
    const zy = baseCy + panRef.current.y - vh1 / 2;
    const fx = (q.x - zx) / vw1;
    const fy = (q.y - zy) / vh1;
    const vw2 = baseW / nz;
    const vh2 = baseH / nz;
    setView(nz, q.x - fx * vw2 + vw2 / 2 - baseCx, q.y - fy * vh2 + vh2 / 2 - baseCy);
  }, [baseW, baseH, baseCx, baseCy, setView]);

  // 버튼은 뷰어 한가운데를 기준으로 확대·축소한다
  const zoomCenter = useCallback((factor) => {
    const svg = svgRef.current;
    const r = svg ? svg.getBoundingClientRect() : null;
    if (r && r.width > 0) zoomAt(zoomRef.current * factor, r.left + r.width / 2, r.top + r.height / 2);
    else zoomAt(zoomRef.current * factor, 0, 0);
  }, [zoomAt]);

  const resetView = useCallback(() => { setView(1, 0, 0); }, [setView]);

  // 새 도면을 올리면 배율·위치를 되돌린다
  useEffect(() => { resetView(); }, [plan, resetView]);

  // 휠 — React 의 onWheel 은 passive 로 붙어 preventDefault 가 먹지 않는다
  useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return undefined;
    const onWheel = (ev) => {
      ev.preventDefault();
      zoomAt(zoomRef.current * Math.exp(-ev.deltaY * 0.0018), ev.clientX, ev.clientY);
    };
    svg.addEventListener('wheel', onWheel, { passive: false });
    return () => svg.removeEventListener('wheel', onWheel);
  }, [zoomAt]);

  // 배경 드래그 이동 — 구역 위에서 시작하면 구역 드래그가 이긴다
  useEffect(() => {
    const svg = svgRef.current;
    if (!svg) return undefined;
    const onDown = (ev) => {
      if (ev.button !== 0 || zoomRef.current <= 1) return;
      const t = ev.target;
      if (t && t.closest && t.closest('g[data-zone]')) return;
      const ctm = svg.getScreenCTM();
      if (!ctm || !ctm.a || !ctm.d) return;
      ev.preventDefault();
      const startPan = { x: panRef.current.x, y: panRef.current.y };
      const x0 = ev.clientX;
      const y0 = ev.clientY;
      const perPxX = 1 / ctm.a;
      const perPxY = 1 / ctm.d;
      setPanning(true);
      const onMove = (me) => {
        setView(zoomRef.current, startPan.x - (me.clientX - x0) * perPxX, startPan.y - (me.clientY - y0) * perPxY);
      };
      const onUp = () => {
        setPanning(false);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
    svg.addEventListener('mousedown', onDown);
    return () => svg.removeEventListener('mousedown', onDown);
  }, [setView]);

  const viewW = baseW / zoom;
  const viewH = baseH / zoom;
  const round2 = (v) => (Math.abs(v) < 0.005 ? 0 : Math.round(v * 100) / 100);
  const viewBoxStr = `${round2(baseCx + pan.x - viewW / 2)} ${round2(baseCy + pan.y - viewH / 2)} ${round2(viewW)} ${round2(viewH)}`;
  const zoomPct = Math.round(zoom * 100);

  return (
    <>
    <svg ref={svgRef} viewBox={viewBoxStr} className={`h-full w-full${bgHidden ? ' focus-mode' : ''}${onlyZones ? ' zones-only' : ''}`} preserveAspectRatio="xMidYMid meet"
      style={{ cursor: panning ? 'grabbing' : (zoom > 1 ? 'grab' : 'default') }}
      role="img" aria-label="잠실점 지하 1층 식품관 평면도">
      <defs>
        <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#0F172A" floodOpacity="0.06" />
        </filter>
        <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#F8FAFC" />
          <stop offset="55%" stopColor="#F1F5F9" />
          <stop offset="100%" stopColor="#E9EEF5" />
        </linearGradient>
      </defs>

      {uploaded ? (
        <g>
          {/* 화이트박스 제거 — SVG 바탕을 비워야 뒤의 모눈이 그대로 비친다 (지시서 Step 1) */}
          <rect x="0" y="0" width={VIEWBOX.w} height={VIEWBOX.h} fill="transparent" />
          {plan.url ? (
            analysis && analysis.rect ? (
              // 래스터: 추적선과 같은 letterbox 사각형에 그려야 어긋나지 않는다
              <image
                id="floorplanBgImage"
                className={bgHidden ? 'dimmed-bg' : ''}
                href={plan.url}
                x={analysis.rect.x} y={analysis.rect.y}
                width={analysis.rect.w} height={analysis.rect.h}
                preserveAspectRatio="none"
                style={{ pointerEvents: 'none', mixBlendMode: 'multiply', opacity: showTrace && !bgHidden ? 0.26 : 1 }}
              />
            ) : (
              <image
                id="floorplanBgImage"
                className={bgHidden ? 'dimmed-bg' : ''}
                href={plan.url}
                x="0" y="0" width={VIEWBOX.w} height={VIEWBOX.h}
                preserveAspectRatio="xMidYMid meet"
                style={{ pointerEvents: 'none', mixBlendMode: 'multiply', opacity: showTrace && !bgHidden ? 0.26 : 1 }}
              />
            )
          ) : null}

          {/* 해석된 라인 — 벽체/동선
              vectorEffect 로 선 굵기를 화면 픽셀 기준으로 고정한다.
              확대해도 선이 두꺼워지지 않고, 축소해도 사라지지 않는다. */}
          {traceOn && analysis && analysis.pathD ? (
            <path
              d={analysis.pathD}
              fill="none"
              stroke="#0F172A"
              strokeWidth="1.15"
              strokeLinejoin="round"
              strokeLinecap="round"
              vectorEffect="non-scaling-stroke"
              opacity="0.88"
              style={{ pointerEvents: 'none' }}
            />
          ) : null}

          {/* 닫힌 영역(실/팝업 후보) */}
          {showRegions && analysis && analysis.regionD ? (
            <path
              d={analysis.regionD}
              fill="rgba(30,58,138,0.05)"
              stroke="#1E3A8A"
              strokeWidth="1.4"
              vectorEffect="non-scaling-stroke"
              strokeDasharray="6 4"
              strokeLinejoin="round"
              opacity="0.85"
              style={{ pointerEvents: 'none' }}
            />
          ) : null}
        </g>
      ) : (
        <g>
          {/* 비정형 외벽 */}
          <path d={OUTER_PATH} fill="url(#marble)" stroke="#CBD5E1" strokeWidth="2" />
          <path d={OUTER_PATH} fill="none" stroke="#E2E8F0" strokeWidth="6" opacity="0.6" />

          {/* 주 동선 (곡선 복도) */}
          <path d={CORRIDOR} fill="none" stroke="#FFFFFF" strokeWidth="52" strokeLinecap="round" />
          <path d={CORRIDOR} fill="none" stroke="#E2E8F0" strokeWidth="52" strokeLinecap="round" opacity="0.55" />
          <path d={CORRIDOR} fill="none" stroke="#FFFFFF" strokeWidth="46" strokeLinecap="round" />
          <path d={CORRIDOR} fill="none" stroke="#CBD5E1" strokeWidth="1.6" strokeDasharray="7 7" opacity="0.9" />

          {/* 중앙 에스컬레이터 코어 */}
          <g>
            <rect x="370" y="270" width="180" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1.5" filter="url(#soft-shadow)" />
            <rect x="392" y="288" width="136" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" strokeWidth="1" />
            <text x="460" y="309" textAnchor="middle" fill="#475569" fontSize="10.5" fontWeight="800" fontFamily="Pretendard, sans-serif">▲ 1F 명품관</text>
            <rect x="392" y="330" width="136" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" strokeWidth="1" />
            <text x="460" y="351" textAnchor="middle" fill="#475569" fontSize="10.5" fontWeight="800" fontFamily="Pretendard, sans-serif">▼ B2 주차·마트</text>
            <text x="460" y="386" textAnchor="middle" fill="#94A3B8" fontSize="8" fontWeight="700" letterSpacing="1.4" fontFamily="Pretendard, sans-serif">중앙 코어 보이드</text>
          </g>
        </g>
      )}

      {/* 6개 비정형 매장 */}
      {showZones ? (
        <g>
          {rows.map((row, zi) => (
            <ZoneShape
              key={row.zoneId}
              zone={row.zone}
              row={row}
              tabIndex={selectedZoneId === row.zoneId || (selectedZoneId == null && zi === 0) ? 0 : -1}
              hovered={hovered === row.zoneId}
              selected={selectedZoneId === row.zoneId}
              dropActive={dropZoneId === row.zoneId}
              dragKind={dragZoneId ? 'zone' : candidateDrag ? 'candidate' : null}
              dragging={dragZoneId === row.zoneId}
              pulsing={pulseZone === row.zoneId}
              pointerDragEnabled={pointerDragEnabled}
              onHover={onHover}
              onLeave={onLeave}
              onActivate={onActivate}
              onApplyBrand={onApplyBrand}
              onSwap={onSwap}
              onDragStartZone={onDragStartZone}
              onDragEndZone={onDragEndZone}
              onPointerDragStart={onPointerDragStart}
              onVertexDrag={onVertexDrag}
              ghost={uploaded}
              bgHidden={bgHidden}
              zonesOnly={onlyZones}
            />
          ))}
        </g>
      ) : null}

      {/* 기본 도면일 때만 게이트 표시 */}
      {uploaded ? null : (
        <g>
          <line x1="330" y1="72" x2="330" y2="104" stroke="#CBD5E1" strokeWidth="1.4" strokeDasharray="3 3" />
          <line x1="670" y1="76" x2="670" y2="98" stroke="#CBD5E1" strokeWidth="1.4" strokeDasharray="3 3" />
          <rect x="250" y="24" width="500" height="40" rx="20" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1.5" filter="url(#soft-shadow)" />
          <circle cx="280" cy="44" r="10" fill="#1E3A8A" />
          <text x="280" y="48" textAnchor="middle" fill="#FFFFFF" fontSize="10" fontWeight="900" fontFamily="Pretendard, sans-serif">2</text>
          <text x="510" y="48.5" textAnchor="middle" fill="#1E293B" fontSize="12" fontWeight="800" fontFamily="Pretendard, sans-serif">
            2호선 잠실역 지하광장 · 트레비 분수 진입
          </text>

          <rect x="60" y="588" width="232" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1.5" filter="url(#soft-shadow)" />
          <text x="176" y="607.5" textAnchor="middle" fill="#334155" fontSize="10.5" fontWeight="800" fontFamily="Pretendard, sans-serif">
            롯데월드 어드벤처 진입 통로
          </text>
          <rect x="686" y="588" width="246" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1" strokeWidth="1.5" filter="url(#soft-shadow)" />
          <text x="809" y="607.5" textAnchor="middle" fill="#334155" fontSize="10.5" fontWeight="800" fontFamily="Pretendard, sans-serif">
            에비뉴엘 · 월드몰 연결 통로 →
          </text>
        </g>
      )}
    </svg>

    {/* 확대·축소 컨트롤 — 뷰어 우하단, 도면 위에 얹는다 */}
    <div className="absolute bottom-3 right-3 z-20 flex items-center gap-0.5 rounded-xl border border-slate-200 bg-white px-1 py-1 shadow-card">
      <button
        type="button"
        onClick={() => zoomCenter(1 / 1.4)}
        disabled={zoom <= 1.001}
        title="축소"
        aria-label="도면 축소"
        className="flex h-7 w-7 items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 active:scale-95 disabled:cursor-not-allowed disabled:text-slate-300 disabled:hover:bg-transparent"
      >
        <Icon name="ZoomOut" size={14} stroke={2.2} />
      </button>
      <span className="min-w-[38px] select-none text-center text-[10.5px] font-black tabular text-slate-500" aria-live="polite">{`${zoomPct}%`}</span>
      <button
        type="button"
        onClick={() => zoomCenter(1.4)}
        disabled={zoom >= MAX_ZOOM - 0.001}
        title="확대"
        aria-label="도면 확대"
        className="flex h-7 w-7 items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 active:scale-95 disabled:cursor-not-allowed disabled:text-slate-300 disabled:hover:bg-transparent"
      >
        <Icon name="ZoomIn" size={14} stroke={2.2} />
      </button>
      <span className="mx-0.5 h-4 w-px bg-slate-200" />
      <button
        type="button"
        onClick={resetView}
        disabled={zoom <= 1.001 && Math.abs(pan.x) < 0.01 && Math.abs(pan.y) < 0.01}
        title="화면에 맞추기"
        aria-label="도면을 화면에 맞추기"
        className="flex h-7 w-7 items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 active:scale-95 disabled:cursor-not-allowed disabled:text-slate-300 disabled:hover:bg-transparent"
      >
        <Icon name="Maximize" size={13} stroke={2.2} />
      </button>
    </div>
    </>
  );
}

function CandidateCard({ brand, selected, usedCount, occupiedZone, onSelect, onDragStart, onDragEnd, tabIndex, onMove }) {
  const locked = Boolean(occupiedZone);
  return (
    <div
      role="button"
      tabIndex={typeof tabIndex === 'number' ? tabIndex : 0}
      aria-pressed={selected}
      aria-disabled={locked}
      aria-label={locked
        ? `${brand.id} ${brand.name} 이미 ${occupiedZone}에 입점 중`
        : `${brand.id} ${brand.name} ${brand.category} 평효율 ${man(brand.pyeongEfficiency * 10)}천원 수수료율 ${brand.commissionRate}퍼센트`}
      draggable={!locked}
      onDragStart={(ev) => {
        if (locked) { ev.preventDefault(); return; }
        ev.dataTransfer.setData('application/json', JSON.stringify(brand));
        ev.dataTransfer.effectAllowed = 'copy';
        if (onDragStart) onDragStart(brand);
      }}
      onDragEnd={() => { if (onDragEnd) onDragEnd(); }}
      onClick={() => onSelect(brand.id)}
      onKeyDown={(ev) => {
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') {
          ev.preventDefault();
          if (onMove) onMove(1);
          return;
        }
        if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') {
          ev.preventDefault();
          if (onMove) onMove(-1);
          return;
        }
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          onSelect(brand.id);
          // 후보를 고르면 첫 구역으로 포커스를 넘긴다 — Tab 을 세지 않고 바로 Enter 로 배치한다
          const firstZone = document.querySelector('g[data-zone]');
          if (firstZone) window.setTimeout(() => firstZone.focus(), 0);
        }
      }}
      title={locked ? `이미 ${occupiedZone}에 입점 중인 브랜드입니다` : `${brand.name} · 수수료율 ${brand.commissionRate}%`}
      className={`cand-card flex items-center justify-between gap-2 rounded-xl border p-2.5 ${
        locked
          ? 'cursor-not-allowed border-slate-200 bg-slate-50/80 opacity-60'
          : selected
            ? 'cursor-grab border-blue-700 bg-blue-50/60 ring-2 ring-blue-700/15 active:cursor-grabbing'
            : 'cursor-grab border-slate-200/90 bg-white hover:border-slate-300 hover:shadow-card active:cursor-grabbing'
      }`}
    >
      <div className="flex min-w-0 items-center gap-2.5">
        <div className="min-w-0">
          <div className="flex items-center gap-1.5">
            <span className={`truncate text-xs font-black tracking-tight ${locked ? 'text-slate-500' : 'text-slate-900'}`}>{brand.name}</span>
            {locked ? (
              <span className="shrink-0 rounded-full bg-slate-200 px-1.5 py-[1px] text-[9px] font-bold text-slate-600">{occupiedZone}</span>
            ) : usedCount > 0 ? (
              <span className="shrink-0 rounded-full bg-slate-900 px-1.5 py-[1px] text-[9px] font-bold text-white">{usedCount}</span>
            ) : null}
          </div>
          <div className="mt-0.5 flex items-center gap-1.5">
            {locked ? (
              <span className="truncate text-[10px] font-bold text-slate-500">입점 중 · 다른 구역에 배치 불가</span>
            ) : (
              <>
                <span className="shrink-0 rounded px-1.5 py-[1px] text-[9px] font-bold" style={catStyle(brand.category)}>{brand.category}</span>
                <span className="truncate text-[10px] font-medium text-slate-400">{brand.tag}</span>
              </>
            )}
          </div>
        </div>
      </div>
      <div className="flex shrink-0 items-center gap-2 text-right">
        <div>
          <p className={`text-[11.5px] font-black tabular tracking-tight ${locked ? 'text-slate-500' : 'text-slate-900'}`}>
            {man(brand.pyeongEfficiency * 10)}<span className="ml-0.5 text-[9px] font-semibold text-slate-400">천원</span>
          </p>
          <p className={`text-[10px] font-bold tabular ${locked ? 'text-slate-400' : 'text-slate-600'}`}>
            <span className="mr-0.5 font-semibold text-slate-400">수수료율</span>{brand.commissionRate}%
          </p>
        </div>
        <Icon name={locked ? 'Lock' : 'GripVertical'} size={13} className="text-slate-300" />
      </div>
    </div>
  );
}

          {growthText(g)}
        </span>
        <span className={sortKey === 'efficiency' ? 'text-slate-900' : 'text-slate-500'}>
          {`${man(Math.round(row.efficiency / 1e3))}천원/평`}

        <span className={sortKey === 'pyeong' ? 'text-slate-900' : 'text-slate-500'}>{`${row.pyeong}평`}</span>

      </div>

}

/* ================================================================
 * 10. RANKING DASHBOARD — 편집 가능한 지표 순위 보드
 * ================================================================ */

function InlineValue({ row, metricKey, value, onCommit, onSelectZone }) {
  const [editing, setEditing] = React.useState(false);
  const [draft, setDraft] = React.useState('');
  const [invalid, setInvalid] = React.useState(false);
  const [errorText, setErrorText] = React.useState('');
  const originRef = React.useRef(0);
  const inputRef = React.useRef(null);
  const metric = METRIC_BY_KEY[metricKey];
  const canEdit = Boolean(metric && metric.editable);
  // 편집기 입력 단위 → 원 단위 배율 (무변경 판정에 쓴다)
  const editScale = metric && metric.unit === 'won' ? 1e8
    : metric && metric.unit === 'wonPerPyeong' ? 1e3
      : 1;

  // 지시서 Task 7-2 — 편집 진입이 구역 선택으로 번지면 안 된다.
  // start 는 onSelectZone 을 부르지 않고, 셀 클릭 이벤트도 상위로 전파하지 않는다.
  const start = () => {
    const shown = metricEditValue(metricKey, row);
    originRef.current = Number(String(shown).replace(/,/g, '')) * editScale;
    setDraft(shown);
    setEditing(true);
    setInvalid(false);
    setErrorText('');
  };

  React.useEffect(() => {
    if (editing && inputRef.current) {
      inputRef.current.focus();
      inputRef.current.select();
    }
  }, [editing]);

  /** 편집 종료 — 값이 실제로 바뀐 경우에만 onCommit 을 호출한다 */
  const commit = () => {
    const raw = String(draft == null ? '' : draft).trim().replace(/,/g, '').replace(/[%\s원평억만]/g, '');
    const parsed = parseMetricInput(metricKey, draft, row);
    if (!parsed.ok) {
      setInvalid(true);
      setErrorText(parsed.reason || '값을 확인하세요');
      if (inputRef.current) inputRef.current.select();
      window.setTimeout(() => { setInvalid(false); }, 600);
      return;
    }
    // 무변경이면 토스트·뱃지·카운트를 건드리지 않고 조용히 닫는다
    const same = raw !== '' && Math.abs(parsed.value - originRef.current) < 1e-6;
    setEditing(false);
    setInvalid(false);
    setErrorText('');
    if (same) return;
    onCommit(metricKey, parsed.value);
  };

  if (editing) {
    return (
      <span className="inline-flex flex-col items-end">
        <input
          ref={inputRef}
          type="text"
          inputMode="decimal"
          className={`inline-editor ${invalid ? 'invalid' : ''}`}
          value={draft}
          step="any"
          onChange={(ev) => { setDraft(ev.target.value); setErrorText(''); }}
          onBlur={commit}
          onClick={(ev) => ev.stopPropagation()}
          onDoubleClick={(ev) => ev.stopPropagation()}
          onKeyDown={(ev) => {
            ev.stopPropagation();
            if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
            if (ev.key === 'Escape') {
              ev.preventDefault();
              setEditing(false);
              setInvalid(false);
              setErrorText('');
            }
          }}
          aria-label={`${row.name} ${metric ? metric.label : ''} 수정 (단위 ${metric && metric.unit === 'won' ? '억' : metric && metric.unit === 'wonPerPyeong' ? '천원' : metric && metric.unit === 'percent' ? '%' : '평'})`}
          aria-invalid={invalid}
        />
        {errorText ? (
          <span className="mt-0.5 whitespace-nowrap text-[9px] font-bold text-rose-600">{errorText}</span>
        ) : null}
      </span>
    );
  }

  return (
    <span
      role={canEdit ? 'button' : undefined}
      tabIndex={canEdit ? 0 : undefined}
      title={canEdit ? '클릭하여 수정' : '파생 지표 (읽기 전용)'}
      onClick={(ev) => { ev.stopPropagation(); if (canEdit) start(); }}
      onDoubleClick={(ev) => { ev.stopPropagation(); if (canEdit) start(); }}
      onKeyDown={(ev) => { if (canEdit && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); } }}
      className={`group inline-flex shrink-0 items-center gap-0.5 text-[10.5px] font-black tabular text-slate-900 ${
        canEdit ? 'cursor-text rounded px-0.5 hover:bg-blue-50' : 'cursor-default opacity-80'
      }`}
    >
      {value}
      {/* 연필은 '여기를 누르면 고칠 수 있다'는 유일한 시각 신호다.
          평소엔 연한 회색(slate-300), 셀에 호버하면 진해진다(slate-600).
          부모에 group 이 없으면 group-hover 가 죽어서 아무 반응이 없다. */}
      {canEdit ? (
        <span className="text-slate-300 transition group-hover:text-slate-600" aria-hidden="true">
          <Icon name="Pencil" size={9} stroke={2.4} />
        </span>
      ) : null}
    </span>
  );
}

function RankingColumn({

}) {
  const sorted = sortRows(rows, col.key, dir);
  const shown = limit > 0 ? sorted.slice(0, limit) : sorted;
  const metric = METRIC_BY_KEY[col.key] || { label: col.key, icon: 'Activity' };

  return (
    <div className="flex min-h-0 min-w-0 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white">
      <div className="flex shrink-0 items-center gap-1 border-b border-slate-100 bg-slate-50/80 px-1.5 py-1">
        <span className="shrink-0 text-slate-400"><Icon name={metric.icon} size={11} /></span>
        <select
          value={col.key}
          onChange={(ev) => onHeaderChange(col.key, ev.target.value)}
          aria-label="지표 컬럼 변경"

        >
          {METRICS.map((m) => (

        </select>
        {canRemove ? (
          <button
            type="button"
            onClick={() => onHeaderRemove(col.key)}
            aria-label={`${metric.label} 컬럼 삭제`}
            className="flex h-6 w-6 shrink-0 items-center justify-center rounded text-slate-400 transition hover:bg-rose-50 hover:text-rose-600"
            title={`${metric.label} 컬럼 삭제`}
          >
            <Icon name="X" size={10} stroke={2.8} />
          </button>
        ) : null}
      </div>

      <div className="custom-scrollbar min-h-0 flex-1 overflow-y-auto p-1">
        {shown.map((row, i) => {
          const active = selectedZoneId === row.zoneId;
          const pulsing = pulseZone === row.zoneId;
          const medal = i === 0 ? '#B45309' : i === 1 ? '#64748B' : i === 2 ? '#92400E' : '#CBD5E1';
          return (
            <div
              key={row.zoneId}
              role="button"
              tabIndex={0}
              onClick={() => onSelect(row.zoneId)}
              onKeyDown={(ev) => { if (ev.key === 'Enter') { ev.preventDefault(); onSelect(row.zoneId); } }}
              aria-label={`${i + 1}위 ${row.name} ${metric.label} ${metricFmt(col.key, row[col.key])}`}
              className={`mb-0.5 flex w-full cursor-pointer items-center gap-1 rounded-md px-1 py-0.5 text-left transition ${
                active ? 'bg-blue-50/70 ring-1 ring-blue-200' : 'hover:bg-slate-50'
              } ${pulsing ? 'swap-pulse' : ''}`}
            >
              <span
                className="flex h-3.5 w-3.5 shrink-0 items-center justify-center rounded-full text-[8.5px] font-black"
                style={{ background: `color-mix(in srgb, ${medal} 14%, white)`, color: medal }}
              >
                {i + 1}
              </span>
              <span className="min-w-0 flex-1 truncate text-[10px] font-bold text-slate-700">
                {row.name}
                {row.edited ? <span className="ml-1 inline-block h-1 w-1 rounded-full bg-blue-700 align-middle" title="수정됨" /> : null}
              </span>
              <InlineValue
                row={row}
                metricKey={col.key}
                value={metricFmt(col.key, row[col.key])}
                onCommit={(key, v) => onCommitValue(row.zoneId, key, v)}
                onSelectZone={() => onSelect(row.zoneId)}
              />
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  // 저장된 값이 있으면 그 상태로 시작한다. 없으면 내장 도면.
  const saved = useRef(null);

  const [selectedCandidate, setSelectedCandidate] = useState(null);
  const [hoveredZoneId, setHoveredZoneId] = useState(null);
  // 토스트는 두 슬롯으로 나눈다. 되돌리기(action)는 일반 안내(notice)에 덮이지 않아야 한다.
