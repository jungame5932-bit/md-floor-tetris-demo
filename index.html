  const [actionToast, setActionToast] = useState(null);
  // 리셋 확인 다이얼로그 — null 이면 닫힘
  const [resetAsk, setResetAsk] = useState(null);
  const undoRef = useRef(null);
  const toastTimer = useRef(null);
  const actionTimer = useRef(null);
  const [plan, setPlan] = useState(null);       // { url, name, kind, analysis }
  const [analysis, setAnalysis] = useState(null); // { polys, regions, stats, pathD, regionD }
  const [parsing, setParsing] = useState(null);   // 진행 메시지
  const [parseError, setParseError] = useState(null);
  // 업로드 6단계 플로우 (지시서 Task 4) — 파싱 결과를 모달로 확인한 뒤 적용한다
  const [uploadAsk, setUploadAsk] = useState(null); // { name, zoneCount, areaSum, labels, out, file }
  // 백데이터 편집 팝업 — 열면 현재 값을 표로 만들고, 칸을 고쳐서 적용한다
  const [sheet, setSheet] = useState(null); // { rows, fileName, sheetName }
  const [dataBusy, setDataBusy] = useState(false);
  const [showZones, setShowZones] = useState(true);
  const [showTrace, setShowTrace] = useState(true);
  const [showBg, setShowBg] = useState(true);     // 원본 도면 배경 표시 여부
  // 구역만 표시 — 도면 원본·추적선을 모두 걷어내고 구역 외곽선과 라벨만 남긴다.
  // 업로드 도면의 글자가 뭉쳐 판독이 안 될 때 쓰는 최후 수단.
  const [zonesOnly, setZonesOnly] = useState(false);
  const [showRegions, setShowRegions] = useState(false);
  const [drawHover, setDrawHover] = useState(false);
  const [selectedZoneId, setSelectedZoneId] = useState(null);
  // 클릭-클릭 교환 무장 상태 — 도면에서 고른 구역만 여기에 기록된다
  const selectedFromZoneRef = useRef(null);

  /** 목록·랭킹에서 고른 선택은 무장하지 않는다 (도면 클릭 시 실수 교환 방지) */
  const selectFromList = useCallback((zoneId) => {
    selectedFromZoneRef.current = null;
    setSelectedZoneId(zoneId);
  }, []);

  /** 후보 선택 — 구역 선택과 교환 무장을 함께 해제한다 (Z-01 무장 상태에서 후보를 고르면 무장이 남아
   *  다음 구역 클릭이 교환으로 오동작하는 것을 막는다) */
  const selectCandidate = useCallback((id) => {
    selectedFromZoneRef.current = null;
    setSelectedZoneId(null);
    setSelectedCandidate((cur) => (cur === id ? null : id));
  }, []);
  const [dragZoneId, setDragZoneId] = useState(null);
  const [candidateDrag, setCandidateDrag] = useState(false);
  const [tab, setTab] = useState('brands');
  const [query, setQuery] = useState('');
  const [sortKey, setSortKey] = useState('salesCurr');
  const [sortDir, setSortDir] = useState('desc');
  const [columns, setColumns] = useState(DEFAULT_COLUMNS);
  const [rankLimit, setRankLimit] = useState(3);
  const [rankDir, setRankDir] = useState('desc');
  const [pulseZone, setPulseZone] = useState(null);
  const [areaMode, setAreaMode] = useState('efficiency'); // 'efficiency' | 'absolute'
  const [editingAny, setEditingAny] = useState(false);
  const [editedZones, setEditedZones] = useState(() => ({ ...((boot && boot.editedZones) || {}) })); // { Z-01: true }
  const pulseTimer = useRef(null);
  const fileRef = useRef(null);
  const dataFileRef = useRef(null);
  const planUrlRef = useRef(null);

  const [baseline, setBaseline] = useState(() => (boot ? metricsOf(boot.zones) : metricsOf(ZONES_BASE)));
  // 업로드 도면에서 만든 구역 원본 — 리셋은 여기로 되돌아가야 한다
  const [planZones, setPlanZones] = useState(null);
  /* 도면에 그리는 행, 상단 KPI, 후보 잠금 상태는 모두 같은 zones 스냅숏에서 나와야 한다.
     예전에는 셋이 각자 zones 를 순회했다. 값은 같지만 계산 시점이 갈라지면
     '지도에는 A, 합계에는 B' 같은 화면이 나올 수 있어 한 번만 파생시킨다. */
  const derived = useMemo(() => {
    const rowList = storeRows(zones).map((r) => ({ ...r, edited: Boolean(editedZones[r.zoneId]) }));
    const occupiedBy = {};
    zones.forEach((z) => {
      if (z.currentBrand && z.currentBrand.name) occupiedBy[z.currentBrand.name] = z.id;
    });
    return { rows: rowList, metrics: metricsOf(zones), occupiedBy };
  }, [zones, editedZones]);

  const currentMetrics = derived.metrics;
  const rows = derived.rows;

  const usedCounts = useMemo(() => {
    const counts = {};
    zones.forEach((z) => {
      if (!z.isReplaced) return;
      counts[z.currentBrand.name] = (counts[z.currentBrand.name] || 0) + 1;
    });
    return counts;
  }, [zones]);

  /** 브랜드 이름 → 입점 중인 구역 id. 한 브랜드는 한 구역에만 있을 수 있다. */
  const usedBy = derived.occupiedBy;

  const brandOccupant = useCallback((name) => usedBy[name] || null, [usedBy]);

  useEffect(() => () => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    if (actionTimer.current) clearTimeout(actionTimer.current);
  }, []);

  // 언마운트 시 마지막 blob URL 해제
  useEffect(() => () => {
    if (planUrlRef.current) URL.revokeObjectURL(planUrlRef.current);
  }, []);

  /* 자동 저장 — 값이 바뀔 때마다 이 기기에 남긴다.
     업로드한 도면으로 만든 구역은 저장하지 않는다: 배경 이미지(blob)는 복원할 수 없어서
     새로고침 후 형체만 남고 도면이 사라진 화면이 된다. 그 경우엔 저장본을 지운다. */
  useEffect(() => {
    const timer = setTimeout(() => {
      if (planZones) { clearSavedZones(); return; }
      saveZones(zones, editedZones);
    }, 400);
    return () => clearTimeout(timer);
  }, [zones, editedZones, planZones]);

  const notify = useCallback((message, action) => {
    if (action) {
      // 되돌리기 같은 액션 토스트는 전용 슬롯에 5초 둔다 (사용자 결정, 11/17).
      // 일반 안내가 이 슬롯을 건드리지 않으므로 '입점' 같은 알림이 와도 사라지지 않는다.
      setActionToast({ message, action });
      if (actionTimer.current) clearTimeout(actionTimer.current);
      actionTimer.current = setTimeout(() => setActionToast(null), 5000);
      return;
    }
    // 일반 안내는 2.6초. action 토스트가 떠 있어도 그대로 유지된다.
    setToast(message);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }, []);

  /** 구역을 잠깐 펄스로 강조 (스왑 피드백) */
  const pulse = useCallback((zoneId) => {
    setPulseZone(zoneId);
    if (pulseTimer.current) clearTimeout(pulseTimer.current);
    pulseTimer.current = setTimeout(() => setPulseZone(null), 420);
  }, []);

  /* ---------------- SVG 포인터 드래그 (5px 임계값) ---------------- */
  const dragRef = useRef(null);
  const [dragTargetId, setDragTargetId] = useState(null);

  const endPointerDrag = useCallback((commit) => {
    const st = dragRef.current;
    dragRef.current = null;
    if (!st) return;
    document.removeEventListener('mousemove', st.onMove);
    document.removeEventListener('mouseup', st.onUp);
    const ghost = document.getElementById('dragGhost');
    if (ghost) ghost.remove();
    setDragTargetId(null);
    setDragZoneId(null);
    setCandidateDrag(false);
    if (commit && st.active && st.targetId && st.targetId !== st.sourceId) {
      handleSwapRef.current(st.sourceId, st.targetId);
    }
  }, []);

  const handlePointerDragStart = useCallback((ev, zoneId, row) => {
    if (editingAny) {
      // 인라인 편집 중이면 드래그를 시작하지 않는다 (지시서 Step 4 엣지케이스)
      return;
    }
    ev.preventDefault();
    const startX = ev.clientX;
    const startY = ev.clientY;
    let active = false;
    let targetId = null;
    let ghostEl = null;

    const hitTest = (x, y) => {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const g = el.closest ? el.closest('g[data-zone]') : null;
      return g ? g.getAttribute('data-zone') : null;
    };

    const onMove = (me) => {
      const dist = Math.hypot(me.clientX - startX, me.clientY - startY);
      if (!active && dist >= 5) {
        active = true;
        setDragZoneId(zoneId);
        ghostEl = document.createElement('div');
        ghostEl.id = 'dragGhost';
        ghostEl.textContent = `${row.name} · ${moneyShort(row.salesCurr)}`;
        document.body.appendChild(ghostEl);
      }
      if (!active) return;
      if (ghostEl) {
        ghostEl.style.left = `${me.clientX}px`;
        ghostEl.style.top = `${me.clientY}px`;
      }
      const hit = hitTest(me.clientX, me.clientY);
      const nextTarget = hit && hit !== zoneId ? hit : null;
      if (nextTarget !== targetId) {
        targetId = nextTarget;
        setDragTargetId(nextTarget);
        setHoveredZoneId(nextTarget);
      }
    };

    const onUp = () => {
      // active/targetId 는 지역 변수라 여기서 ref 로 확정해줘야 endPointerDrag 가 판단할 수 있다
      const st = dragRef.current;
      if (st) { st.targetId = targetId; st.active = active; }
      endPointerDrag(true);
    };

    dragRef.current = { sourceId: zoneId, targetId: null, active: false, onMove, onUp };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }, [editingAny, endPointerDrag]);

  /**
   * 에지 튜닝 — 자동 인식 폴리곤의 꼭짓점을 끌어 모양을 고친다.
   * final=false 는 드래그 중(즉시 반영), true 는 놓는 순간(평수 재배분 + 알림).
   */
  const handleVertexDrag = useCallback((zoneId, index, x, y, final) => {
    setZones((prev) => {
      const target = prev.find((z) => z.id === zoneId);
      if (!target || !Array.isArray(target.pts) || index < 0 || index >= target.pts.length) return prev;
      const pts = target.pts.map((p, i) => (i === index ? [x, y] : [p[0], p[1]]));
      const geom = geometryOfPts(pts);
      const next = prev.map((z) => (z.id === zoneId
        ? { ...z, pts, path: pathFromPts(pts), ...geom }
        : z));
      if (!final) return next;
      // 놓을 때 면적 비율로 평수를 다시 배분해 합계 200평을 유지한다
      const areas = next.map((z) => (Array.isArray(z.pts) && z.pts.length >= 3 ? polygonArea(z.pts) : 0));
      const totalArea = areas.reduce((s, a) => s + a, 0);
      if (totalArea <= 0) return next;
      const rescaled = next.map((z, i) => ({
        ...z,
        area: Math.max(1, Math.round((areas[i] / totalArea) * PLAN_TOTAL_PYEONG)),
      }));
      const diff = PLAN_TOTAL_PYEONG - rescaled.reduce((s, z) => s + z.area, 0);
      if (rescaled.length) rescaled[0].area = Math.max(1, rescaled[0].area + diff);
      return rescaled;
    });
    if (final) {
      setEditedZones((prev) => ({ ...prev, [zoneId]: true }));
      notify(`${zoneId} · 구획 모양 수정`);
    }
  }, [notify]);

  // handleSwap 은 뒤에서 정의되므로 ref 로 최신 참조를 잡아둔다
  const handleSwapRef = useRef(null);

  /** 한 구역의 브랜드 원천값을 바꾸고 '수정됨' 표시를 남긴다 */
  const patchBrand = useCallback((zoneId, updater) => {
    setZones((prev) => prev.map((z) => {
      if (z.id !== zoneId) return z;
      const next = updater(z.currentBrand, z.area);
      if (!next) return z;
      // 수치만 바뀐 경우 교체(NEW)로 승격하지 않는다 — isReplaced 는 브랜드 교체 전용
      return { ...z, currentBrand: next };
    }));
    setEditedZones((prev) => ({ ...prev, [zoneId]: true }));
    pulse(zoneId);
  }, [pulse]);

  /** 대시보드 인라인 편집 확정 → 해당 구역만 갱신, 나머지는 파생이라 자동 동기화 */
  const handleCommitMetric = useCallback((zoneId, key, value) => {
    const zone = zones.find((z) => z.id === zoneId);
    if (!zone) return;
    const next = applyMetricEdit(zone.currentBrand, zone.area, key, value);
    if (!next) { notify('이 값은 계산할 수 없습니다'); return; }
    patchBrand(zoneId, () => next);
    notify(`${zoneId} · ${(METRIC_BY_KEY[key] || {}).label || key} 수정`);
  }, [zones, patchBrand, notify]);

  /* ---------------- 대시보드 컬럼 편집 ---------------- */

  const handleColumnChange = useCallback((fromKey, toKey) => {
    if (fromKey === toKey) return;
    const fromLabel = (METRIC_BY_KEY[fromKey] || {}).label || fromKey;
    const toLabel = (METRIC_BY_KEY[toKey] || {}).label || toKey;
    setColumns((prev) => {
      if (prev.includes(toKey)) {
        // 이미 다른 컬럼에 있는 지표를 고르면 두 컬럼을 맞바꾼다 — 조용히 바뀌면 혼란스럽다
        notify(`${toLabel} 컬럼과 ${fromLabel} 컬럼의 위치를 맞바꿨습니다`);
        return prev.map((k) => (k === fromKey ? toKey : k === toKey ? fromKey : k));
      }
      return prev.map((k) => (k === fromKey ? toKey : k));
    });
  }, [notify]);

  const handleColumnRemove = useCallback((key) => {
    setColumns((prev) => (prev.length <= 1 ? prev : prev.filter((k) => k !== key)));
  }, []);

  const handleColumnAdd = useCallback(() => {
    setColumns((prev) => {
      const next = METRICS.find((m) => !prev.includes(m.key));
      return next ? [...prev, next.key] : prev;
    });
  }, []);

  // 뒤로가기·탭 복귀 시 브라우저가 bfcache 에서 DOM 을 되살리면,
  // 배포 전 코드로 그린 지도와 새 합계가 섞여 보일 수 있다.
  // 복원된 문서는 상태를 신뢰하지 않고 한 번 새로 받는다.
  useEffect(() => {
    const onShow = (ev) => {
      if (ev.persisted) window.location.reload();
    };
    window.addEventListener('pageshow', onShow);
    return () => window.removeEventListener('pageshow', onShow);
  }, []);

  /** 어떤 브랜드든 주어진 평수에 맞춰 매출을 다시 계산한다 */
  const rebaseBrand = useCallback((brand, area) => {
    // 매출이 없는 브랜드는 평효율로부터 만들어 둔다
    const curr0 = typeof brand.salesCurr === 'number' && brand.salesCurr > 0
      ? brand.salesCurr
      : Math.round(area * brand.pyeongEfficiency * 1e4);
    const prev0 = typeof brand.salesPrev === 'number' ? brand.salesPrev : 0;

    if (areaMode === 'absolute') {
      // 모드 B: 절대 매출 고정 — 매출·전년매출·이익율을 그대로 옮기고 평효율만 재산출
      return {
        ...brand,
        salesCurr: curr0,
        salesPrev: prev0,
        pyeongEfficiency: efficiencyOf(curr0, area) / 1e4,
      };
    }

    // 모드 A: 평효율 유지 — 매출을 새 평수로 다시 계산하고 전년 매출은 신장율을 보존해 역산
    const eff = typeof brand.pyeongEfficiency === 'number' && brand.pyeongEfficiency > 0
      ? brand.pyeongEfficiency
      : efficiencyOf(curr0, area) / 1e4;
    const curr = Math.round(area * eff * 1e4);
    const g = growthOf(curr0, prev0);
    const prev = g != null && g > -99.9 ? Math.round(curr / (1 + g / 100)) : prev0;
    return { ...brand, pyeongEfficiency: eff, salesCurr: curr, salesPrev: prev };
  }, [areaMode]);

  /** 구역 클릭 — 후보가 선택돼 있으면 입점, 이미 구역이 선택돼 있으면 자리 교환, 아니면 하이라이트 */
  const handleActivate = useCallback((zoneId, source = 'zone') => {
    const cand = CANDIDATES.find((c) => c.id === selectedCandidate);
    if (!cand) {
      // 클릭-클릭 구역 교환: 도면에서 구역을 고른 뒤 다른 구역을 누를 때만 발동한다
      const armed = selectedFromZoneRef.current;
      if (source === 'zone' && armed && armed !== zoneId) {
        const fromId = armed;
        const prevZones = zones;
        selectedFromZoneRef.current = null;
        handleSwapRef.current(fromId, zoneId, { silent: true });
        setSelectedZoneId(zoneId);
        notify(`${fromId} ⇄ ${zoneId} 자리 교환`, {
          label: '되돌리기',
          run: () => {
            setZones(prevZones);
            setSelectedZoneId(fromId);
            notify('자리 교환을 되돌렸습니다');
          },
        });
        return;
      }
      const next = selectedZoneId === zoneId ? null : zoneId;
      setSelectedZoneId(next);
      selectedFromZoneRef.current = source === 'zone' && next ? zoneId : null;
      return;
    }
    // 같은 브랜드를 두 구역에 동시에 입점시킬 수 없다
    const occupied = brandOccupant(cand.name);
    if (occupied) {
      notify(occupied === zoneId
        ? `${cand.name}은(는) 이미 ${zoneId}에 입점 중입니다`
        : `이미 ${occupied}에 입점 중인 브랜드입니다`);
      setSelectedCandidate(null);
      setSelectedZoneId(occupied);
      return;
    }
    setZones((prev) => prev.map((z) => {
      if (z.id !== zoneId) return z;
      return { ...z, currentBrand: brandForZone(cand, z.area), isReplaced: true };
    }));
    setSelectedCandidate(null);
    setSelectedZoneId(zoneId);
    selectedFromZoneRef.current = null;
    // 교체된 구역은 수치 수정 집계에서 빠진다 (교체와 수정은 별개)
    setEditedZones((prev) => { const n = { ...prev }; delete n[zoneId]; return n; });
    notify(`${zoneId} · ${cand.name} 입점`);
  }, [selectedCandidate, notify, brandOccupant, selectedZoneId, zones]);

  /** 후보 브랜드 드롭 */
  const handleApplyBrand = useCallback((zoneId, brand) => {
    if (!brand) { notify('후보 브랜드 정보를 읽지 못했습니다'); return; }
    // 드래그 경로도 클릭과 같은 중복 가드를 통과해야 한다
    const occupied = brandOccupant(brand.name);
    if (occupied && occupied !== zoneId) {
      notify(`이미 ${occupied}에 입점 중인 브랜드입니다`);
      setSelectedZoneId(occupied);
      return;
    }
    if (occupied === zoneId) {
      notify(`${brand.name}은(는) 이미 ${zoneId}에 입점 중입니다`);
      return;
    }
    setZones((prev) => prev.map((z) => {
      if (z.id !== zoneId) return z;
      return { ...z, currentBrand: brandForZone(brand, z.area), isReplaced: true };
    }));
    setSelectedZoneId(zoneId);
    // 드래그 입점도 교체이므로 수정 집계에서 뺀다
    setEditedZones((prev) => { const n = { ...prev }; delete n[zoneId]; return n; });
    pulse(zoneId);
    notify(`${zoneId} · ${brand.name} 입점`);
  }, [notify, pulse, brandOccupant]);

  /** 구역 ↔ 구역 브랜드 자리 교환 (평수가 다르면 매출을 새 면적으로 재계산) */
  const handleSwap = useCallback((fromId, toId, opts = {}) => {
    setZones((prev) => {
      const a = prev.find((z) => z.id === fromId);
      const b = prev.find((z) => z.id === toId);
      if (!a || !b) return prev;
      // A 구역은 B 의 브랜드를 받고, B 구역은 A 의 브랜드를 받는다.
      // 매출은 받는 구역의 평수로 다시 계산해야 평효율이 유지된다.
      const brandForA = rebaseBrand(b.currentBrand, a.area);
      const brandForB = rebaseBrand(a.currentBrand, b.area);
      const baseA = a.originBrand || (ZONES_BASE.find((z) => z.id === fromId) || {}).currentBrand;
      const baseB = b.originBrand || (ZONES_BASE.find((z) => z.id === toId) || {}).currentBrand;
      return prev.map((z) => {
        if (z.id === fromId) return { ...z, currentBrand: brandForA, isReplaced: !baseA || brandForA.name !== baseA.name };
        if (z.id === toId) return { ...z, currentBrand: brandForB, isReplaced: !baseB || brandForB.name !== baseB.name };
        return z;
      });
    });
    setDragZoneId(null);
    setSelectedZoneId(toId);
    // 수정 상태는 구역이 아니라 브랜드에 딸린 정보다 — 자리 교환 때 브랜드와 함께 옮긴다.
    // 여기서 그냥 지워버리면 매출을 고친 브랜드를 다른 구역과 바꾼 순간
    // '수정됨' 배지와 상단 수정 건수가 증발한다 (지시서 Task 1 / B21).
    setEditedZones((prev) => {
      const fromEdited = Boolean(prev[fromId]);
      const toEdited = Boolean(prev[toId]);
      const n = { ...prev };
      delete n[fromId];
      delete n[toId];
      if (toEdited) n[fromId] = true;
      if (fromEdited) n[toId] = true;
      return n;
    });
    pulse(toId);
    if (!opts.silent) notify(`${fromId} ⇄ ${toId} 자리 교환`);
  }, [rebaseBrand, notify, pulse]);

  // 포인터 드래그 컨트롤러가 최신 handleSwap 을 참조하도록
  handleSwapRef.current = handleSwap;

  const handleRevert = useCallback((zoneId) => {
    setZones((prev) => prev.map((z) => {
      if (z.id !== zoneId) return z;
      const origin = z.originBrand || (ZONES_BASE.find((b) => b.id === zoneId) || {}).currentBrand;
      if (!origin) return z;
      return { ...z, currentBrand: { ...origin }, isReplaced: false };
    }));
    setEditedZones((prev) => { const n = { ...prev }; delete n[zoneId]; return n; });
    notify(`${zoneId} 원래 브랜드로 복원`);
  }, [notify]);

  /* ---------------- 도면 해석 파이프라인 ---------------- */

  const resetAnalysis = useCallback(() => {
    setAnalysis(null);
    setParseError(null);
  }, []);

  /** PDF → 첫 페이지를 캔버스로 렌더 */
  const renderPdfFirstPage = useCallback(async (buf) => {
    const pdfjs = window.pdfjsLib;
    if (!pdfjs) throw new Error('PDF 엔진을 불러오지 못했습니다 (네트워크 확인)');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const doc = await pdfjs.getDocument({ data: buf }).promise;
    const page = await doc.getPage(1);
    const baseView = page.getViewport({ scale: 1 });
    const scale = Math.min(3, Math.max(1, 1800 / Math.max(baseView.width, baseView.height)));
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    return { canvas, pages: doc.numPages };
  }, []);

  const analyzeFile = useCallback(async (file) => {
    const P = window.PlanParser;
    const name = file.name;
    const ext = (name.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
    const VB = { w: 1000, h: 680, pad: 18 };

    // --- DWG ---
    // DWG 는 바이너리 폐쇄 포맷이라 libredwg(WASM)로 DXF 로 변환한 뒤 기존 DXF 파서에 넘긴다.
    if (ext === 'dwg') {
      setParsing('DWG 도면 변환 중…');
      const lib = await loadDwgLib();
      const buf = await file.arrayBuffer();
      setParsing('DWG 엔티티 추출 중…');
      await new Promise((r) => setTimeout(r, 30));
      const dxfBytes = lib.dwg_write_dxf(buf);
      if (!dxfBytes || !dxfBytes.length) throw new Error('DWG를 해석하지 못했습니다 (도면 버전 확인)');
      setParsing('도면 형상 해석 중…');
      const text = new TextDecoder('utf-8').decode(dxfBytes);
      const res = P.parseDxf(text);
      if (!res.polys.length) throw new Error('DWG에서 그릴 수 있는 선을 찾지 못했습니다 (블록/레이어 확인)');
      const dwgRegions = P.regionsFromPolys(res.polys);
      res.stats.regions = dwgRegions.length;
      res.stats.format = 'DWG';
      return { patches: res.polys, regions: dwgRegions, stats: res.stats, kind: 'DWG', vector: true };
    }

    // --- DXF ---
    if (ext === 'dxf') {
      setParsing('DXF 엔티티 해석 중…');
      const text = await file.text();
      const res = P.parseDxf(text);
      if (!res.polys.length) throw new Error('DXF에서 그릴 수 있는 선을 찾지 못했습니다 (블록/레이어 확인)');
      const dxfRegions = P.regionsFromPolys(res.polys);
      res.stats.regions = dxfRegions.length;
      return { patches: res.polys, regions: dxfRegions, stats: res.stats, kind: 'DXF', vector: true };
    }

    // --- SVG ---
    if (ext === 'svg' || file.type === 'image/svg+xml') {
      setParsing('SVG 도형 추출 중…');
      const text = await file.text();
      const res = P.svgToPolys(text, VB.w, VB.h, VB.pad);
      if (!res.polys.length) throw new Error('SVG에서 그릴 수 있는 도형을 찾지 못했습니다');
      return { patches: res.polys, regions: res.regions || [], rect: res.rect, stats: res.stats, kind: 'SVG', vector: true, svgText: res.svgText || text };
    }

    // --- PDF ---
    if (ext === 'pdf' || file.type === 'application/pdf') {
      setParsing('PDF 첫 페이지 렌더링 중…');
      const buf = await file.arrayBuffer();
      const { canvas, pages } = await renderPdfFirstPage(buf);
      setParsing('PDF 선 추적 중… (세선화)');
      await new Promise((r) => setTimeout(r, 30));
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const res = P.traceRaster(imgData, { tw: VB.w, th: VB.h, pad: VB.pad });
      if (!res.polys.length && !res.regions.length) throw new Error('PDF에서 선을 추적하지 못했습니다');
      res.stats.pages = pages;
      res.stats.format = 'PDF';
      return { patches: res.polys, regions: res.regions, stats: res.stats, kind: 'PDF', raster: canvas };
    }

    // --- PNG / JPG ---
    if (/^image\//.test(file.type || '') || /^(png|jpe?g|webp|gif|bmp)$/i.test(ext)) {
      setParsing('이미지 디코딩 중…');
      const bitmap = await createImageBitmap(file);
      const maxSide = 1500;
      const sc = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(bitmap.width * sc));
      canvas.height = Math.max(1, Math.round(bitmap.height * sc));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      // 색 채움 도면이면 브라우저에서 구획을 먼저 뽑는다 (백엔드 없이도 동작).
      // 백엔드와 같은 알고리즘이라 정적 호스팅에서도 같은 결과가 나온다.
      setParsing('도면 구획 검출 중…');
      await new Promise((r) => setTimeout(r, 30));
      const auto = P.detectRasterZones(imgData);
      if (auto.zones.length >= 2) {
        const converted = visionZonesToRegions(auto);
        if (converted) {
          return {
            patches: [],
            regions: converted.regions,
            rect: converted.rect,
            stats: { zones: converted.regions.length, engine: auto.engine, format: ext.toUpperCase() },
            kind: 'VISION',
            raster: canvas,
          };
        }
      }

      setParsing('선 추적 중… (세선화)');
      await new Promise((r) => setTimeout(r, 30));
      const res = P.traceRaster(imgData, { tw: VB.w, th: VB.h, pad: VB.pad });
      if (!res.polys.length && !res.regions.length) throw new Error('이미지에서 선을 추적하지 못했습니다');
      res.stats.format = ext.toUpperCase();
      return { patches: res.polys, regions: res.regions, stats: res.stats, kind: ext.toUpperCase(), raster: canvas };
    }

    throw new Error('지원하지 않는 형식입니다 — DWG, DXF 또는 SVG 도면을 사용해 주세요');
  }, [renderPdfFirstPage]);

  /** 파싱 결과를 실제 화면 상태로 반영한다 (모달에서 '적용하기' 를 누른 뒤 호출) */
  const applyParsedPlan = useCallback(async ({ file, out }) => {
    // 배경 이미지 URL
    if (planUrlRef.current) URL.revokeObjectURL(planUrlRef.current);
    let url = null;
    if (out.svgText) {
      url = URL.createObjectURL(new Blob([out.svgText], { type: 'image/svg+xml' }));
    } else if (out.raster) {
      const blob = await new Promise((res) => out.raster.toBlob(res, 'image/png'));
      url = URL.createObjectURL(blob);
    } else if (isRasterPlan(file)) {
      url = URL.createObjectURL(file);
    }
    planUrlRef.current = url;

    const pathD = window.PlanParser.toPathData(out.patches, 2);
    const regionD = window.PlanParser.toPathData(out.regions, 2);

    setAnalysis({ ...out, pathD, regionD });
    setPlan({ url, name: file.name, kind: out.kind });
    setShowZones(true);
    setShowTrace(!!pathD);

    const derived = zonesFromRegions(out.regions, ZONES_BASE.map((z) => z.currentBrand), PLAN_TOTAL_PYEONG);
    // 적용 전 스냅샷 — 실패 토스트의 '되돌리기' 로 한 번 복구한다 (지시서 Task 4-6)
    const before = {
      zones: cloneZoneList(zones),
      planZones: planZones ? cloneZoneList(planZones) : null,
      plan,
      analysis,
      baseline,
      url: planUrlRef.current,
    };
    if (derived && derived.length >= 2) {
      setPlanZones(cloneZoneList(derived));
      setZones(cloneZoneList(derived));
      setBaseline(metricsOf(derived));
      setSelectedZoneId(null);
      setEditedZones({});
      notify(`도면이 적용되었습니다 · 구획 ${derived.length}개`, {
        label: '되돌리기 ↺',
        run: () => {
          setZones(before.zones);
          setPlanZones(before.planZones);
          setPlan(before.plan);
          setAnalysis(before.analysis);
          setBaseline(before.baseline);
          setSelectedZoneId(null);
          setEditedZones({});
          notify('직전 도면으로 되돌렸습니다');
        },
      });
    } else {
      setZones([]);
      setPlanZones([]);
      setBaseline({ rev: 0, profit: 0, pyeong: 0, eff: 0, profitRate: 0 });
      setSelectedZoneId(null);
      setEditedZones({});
      setShowRegions(true);
      notify(`${file.name} · 구획을 찾지 못했습니다`, {
        label: '되돌리기 ↺',
        run: () => {
          setZones(before.zones);
          setPlanZones(before.planZones);
          setPlan(before.plan);
          setAnalysis(before.analysis);
          setBaseline(before.baseline);
          notify('직전 도면으로 되돌렸습니다');
        },
      });
    }
  }, [zones, planZones, plan, analysis, baseline, notify]);

  /**
   * 업로드 1~4단계 — 파일을 읽어 파싱하고, 결과를 모달로 확인시킨다.
   * 실제 덮어쓰기는 applyParsedPlan 이고, 이 함수는 상태를 건드리지 않는다.
   */
  const loadPlanFile = useCallback(async (file) => {
    if (!file) return;
    if (file.size > 40 * 1024 * 1024) { notify('파일이 40MB를 넘습니다 — 더 작은 도면을 쓰세요'); return; }

    const name = file.name || '';
    const ext = (name.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
    const isRasterFile = /^(png|jpe?g|webp|gif|bmp)$/i.test(ext)
      || /^image\/(png|jpeg|jpg|webp|gif|bmp)/.test(file.type || '');
    const isPdfFile = ext === 'pdf' || file.type === 'application/pdf';
    // 지시서 Task 4-5 — 이미지·PDF 도면은 11/20 범위 밖. 기존 데이터를 건드리지 않고 안내만 한다.
    // 화면 안내문이 DXF·SVG 만 지원한다고 적혀 있으므로 드롭으로 들어온 PDF 도 같이 막는다.
    if (isRasterFile) {
      window.alert('현재 벡터 형식(DWG/DXF/SVG) 도면만 지원합니다.');
      return;
    }
    if (isPdfFile) {
      window.alert('PDF는 지원하지 않습니다. DWG, DXF 또는 SVG 도면을 사용해 주세요.');
      return;
    }

    setParseError(null);
    setParsing('도면을 분석 중입니다...');
    // 스피너 최소 1.5초 노출 (사용자 결정, 11/17). 파싱이 즉시 끝나도 연출로 유지한다.
    // 파싱 시작 전에 기다리므로 성공·실패 양쪽 경로가 같은 시간을 보장받는다.
    await new Promise((r) => setTimeout(r, 1500));
    const startedAt = Date.now();
    try {
      const out = await analyzeFile(file);

      const regions = Array.isArray(out.regions) ? out.regions : [];
      // 모달에는 '실제로 만들어질 구역 수'를 보여야 한다. 원본 region 에는 도면 전체를 덮는
      // 외벽 사각형이 섞여 있어서 zonesFromRegions 가 그걸 걸러낸다 (7 → 6).
      const preview = zonesFromRegions(out.regions, ZONES_BASE.map((z) => z.currentBrand), PLAN_TOTAL_PYEONG);
      const effective = preview && preview.length ? preview.length : regions.length;
      const areaSum = regions.reduce((acc, r) => acc + (Number(r.area) || 0), 0);
      // 인식된 원본 라벨 — 실제 구역으로 채택된 것만 나열한다 (걸러진 외벽 제외).
      // 라벨 정보가 없으면 '알 수 없는 구역 N' 으로 대체한다 (지시서 Task 4-3).
      const keptRegions = Array.isArray(preview) && preview.length ? preview : regions;
      const labels = keptRegions.slice(0, 40).map((r, i) => {
        // 우리 파이프라인은 도면의 원본 텍스트를 읽지 않는다(OCR 제거).
        // SVG/DXF 에서 name·id 를 실어오는 경우만 그대로 쓰고, 없으면 지시서의 Fallback 을 쓴다.
        const raw = (r && (r.name || r.label)) || null;
        return raw ? String(raw) : `알 수 없는 구역 ${i + 1}`;
      });

      setParsing(null);
      setUploadAsk({ name, zoneCount: effective, areaSum, labels, out, file });
    } catch (err) {
      const msg = String(err && err.message ? err.message : err);
      setParseError(msg);
      notify('파일을 인식하지 못했습니다. 벡터 도면(DWG/DXF/SVG)을 사용해 주세요');
    } finally {
      setParsing(null);
    }
  }, [analyzeFile, notify]);

  const handlePickPlan = useCallback((ev) => {
    const file = ev.target.files && ev.target.files[0];
    loadPlanFile(file);
    ev.target.value = '';
  }, [loadPlanFile]);

  /** 백데이터 팝업 열기 — 파일 선택이 아니라 현재 값 표를 먼저 보여준다 */
  const openDataSheet = useCallback(() => {
    setSheet({
      rows: sheetRowsFromZones(zones).map((r) => ({ ...r, dirty: false })),
      fileName: null,
      sheetName: null,
    });
  }, [zones]);

  /** 표 한 칸 수정 — 숫자 칸은 즉시 계산해 평효율을 다시 맞춘다 */
  const handleSheetCell = useCallback((zoneId, key, value) => {
    setSheet((prev) => {
      if (!prev) return prev;
      const rows = prev.rows.map((r) => {
        if (r.id !== zoneId) return r;
        const next = { ...r, [key]: value, dirty: true };
        if (key === 'salesCurr') {
          const area = sheetNum(next.area, 0);
          const won = sheetNum(value, 0) * 1e8;
          if (area > 0 && won >= 0) next.eff = String(sheetEff(won, area));
        }
        if (key === 'area') {
          const area = sheetNum(value, 0);
          const won = sheetNum(next.salesCurr, 0) * 1e8;
          if (area > 0 && won >= 0) next.eff = String(sheetEff(won, area));
        }
        if (key === 'eff' && sheetNum(value, 0) > 0) {
          const area = sheetNum(next.area, 0);
          if (area > 0) next.salesCurr = String(+((sheetNum(value, 0) * area / 1e4).toFixed(4)));
        }
        return next;
      });
      return { ...prev, rows };
    });
  }, []);

  /** 엑셀·CSV 를 읽어 표를 채운다 (적용은 아직) */
  const handlePickData = useCallback(async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    if (file.size > 40 * 1024 * 1024) {
      notify('파일이 40MB를 넘습니다 — 더 작은 파일을 쓰세요');
      return;
    }
    setDataBusy(true);
    try {
      const parsed = await parseDataWorkbook(file);
      const preview = zonesFromDataRecords(parsed.records, zones);
      const merged = {};
      preview.zones.forEach((z) => { merged[z.id] = z; });
      const rows = zones.map((z) => {
        const src = merged[z.id] || z;
        const row = sheetRowsFromZones([src])[0];
        // 표에 있던 구역만 수정 표시 — 안 올라온 구역은 원래 값 그대로다
        return { ...row, id: z.id, dirty: merged[z.id] ? merged[z.id] !== z : false };
      });
      setSheet({ rows, fileName: file.name, sheetName: parsed.sheetName });
      if (parsed.skipped.length) notify(`읽지 못한 행 ${parsed.skipped.length}개는 건너뛰었습니다`);
    } catch (err) {
      notify(String((err && err.message) || err));
    } finally {
      setDataBusy(false);
    }
  }, [notify, zones]);

  /** 표 → 화면 반영. 도면 형상은 그대로 두고 값만 갈아끼운다. */
  const applyDataSheet = useCallback(() => {
    if (!sheet) return;
    const before = {
      zones: cloneZoneList(zones),
      editedZones: { ...editedZones },
      baseline,
    };
    const next = zonesFromSheetRows(sheet.rows, zones);
    const changed = sheet.rows.filter((r) => r.dirty).length;
    setZones(cloneZoneList(next));
    setBaseline(metricsOf(next));
    setSelectedZoneId(null);
    setEditedZones((prev) => {
      const out = { ...prev };
      sheet.rows.forEach((r) => { if (r.dirty) out[r.id] = true; });
      return out;
    });
    setSheet(null);
    notify(changed ? `백데이터 ${changed}칸 수정` : '백데이터를 적용했습니다', {
      label: '되돌리기 ↺',
      run: () => {
        setZones(before.zones);
        setEditedZones(before.editedZones);
        setBaseline(before.baseline);
        notify('직전 데이터로 되돌렸습니다');
      },
    });
  }, [sheet, zones, editedZones, baseline, notify]);

  /** 지금 표(없으면 화면 값)를 CSV 양식으로 내려받는다 */
  const downloadDataTemplate = useCallback(() => {
    const head = ['구역ID', '브랜드', '카테고리', '평수', '전년매출(억)', '금년매출(억)', '평효율(천원)', '수수료율(%)', '이익율(%)'];
    const keys = ['id', 'name', 'category', 'area', 'salesPrev', 'salesCurr', 'eff', 'commission', 'profit'];
    const rows = sheet ? sheet.rows : sheetRowsFromZones(zones);
    const lines = [head.join(',')];
    rows.forEach((r) => {
      lines.push(keys.map((k) => {
        const v = r[k] == null ? '' : String(r[k]);
        return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
      }).join(','));
    });
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'MD_백데이터_양식.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, [sheet, zones]);

  const handleClearPlan = useCallback(() => {
    if (planUrlRef.current) { URL.revokeObjectURL(planUrlRef.current); planUrlRef.current = null; }
    setPlan(null);
    setAnalysis(null);
    setParseError(null);
    setShowZones(true);
    setZones(cloneBase());
    setPlanZones(null);
    setBaseline(metricsOf(ZONES_BASE));
    setSelectedZoneId(null);
    setEditedZones({});
    notify('기본 도면으로 되돌렸습니다');
  }, [notify]);

  /** 리셋이 되돌릴 대상 — 방안 A(전체 리셋). 스냅샷을 찍어 1회 되돌리기를 지원한다. */
  const performReset = useCallback(() => {
    const snapshot = {
      zones: cloneZoneList(zones),
      editedZones: { ...editedZones },
      columns: [...columns],
      sortKey,
      sortDir,
      rankLimit,
      rankDir,
      areaMode,
      query,
      selectedZoneId,
    };
    undoRef.current = snapshot;

    // 브랜드·수치
    if (planZones && planZones.length) {
      const restored = cloneZoneList(planZones);
      setZones(restored);
      setBaseline(metricsOf(restored));
    } else if (planZones) {
      setZones([]);
      setBaseline({ rev: 0, profit: 0, pyeong: 0, eff: 0, profitRate: 0 });
    } else {
      setZones(cloneBase());
      setBaseline(metricsOf(ZONES_BASE));
    }

    // 대시보드 구성·정렬·모드
    setColumns(DEFAULT_COLUMNS);
    setSortKey('salesCurr');
    setSortDir('desc');
    setRankLimit(3);
    setRankDir('desc');
    setAreaMode('efficiency');
    setQuery('');

    // 선택·편집 흔적
    setSelectedCandidate(null);
    setSelectedZoneId(null);
    setHoveredZoneId(null);
    setEditedZones({});
    setPulseZone(null);

    // 저장본도 함께 되돌린다 — 화면만 초기화하면 새로고침 때 옛 값이 되살아난다
    if (planZones) clearSavedZones();
    else saveZones(cloneBase(), {});

    const target = planZones && planZones.length
      ? `도면 구획 ${planZones.length}개`
      : planZones ? '빈 도면' : '초기 도면';
    notify(`${target}으로 되돌렸습니다. 교체 0건, 컬럼·정렬·면적 모드도 초기값입니다`, {
      label: '되돌리기',
      run: () => {
        const s = undoRef.current;
        if (!s) return;
        undoRef.current = null;
        setZones(s.zones);
        setEditedZones(s.editedZones);
        setColumns(s.columns);
        setSortKey(s.sortKey);
        setSortDir(s.sortDir);
        setRankLimit(s.rankLimit);
        setRankDir(s.rankDir);
        setAreaMode(s.areaMode);
        setQuery(s.query);
        setSelectedZoneId(s.selectedZoneId);
        notify('리셋 직전 상태로 되돌렸습니다');
      },
    });
  }, [zones, editedZones, columns, sortKey, sortDir, rankLimit, rankDir, areaMode, query, selectedZoneId, planZones, notify]);

  /** 리셋 요청 — 변경이 있으면 확인 다이얼로그를, 없으면 바로 실행한다 */
  const handleReset = useCallback(() => {
    const replaceCount = zones.filter((z) => z.isReplaced).length;
    const editCount = Object.keys(editedZones).length;
    const colsChanged = columns.join(',') !== DEFAULT_COLUMNS.join(',');
    const settingsChanged = sortKey !== 'salesCurr' || sortDir !== 'desc'
      || rankLimit !== 3 || rankDir !== 'desc' || areaMode !== 'efficiency' || query !== '';
    const total = replaceCount + editCount + (colsChanged ? 1 : 0) + (settingsChanged ? 1 : 0);

    // 변경 0건이면 되돌릴 것이 없다 — 눌렀는데 아무 반응이 없으면 고장으로 보인다.
    if (total === 0) { notify('변경 사항이 없습니다 — 되돌릴 내용이 없습니다'); return; }
    setResetAsk({ replaceCount, editCount, colsChanged, settingsChanged, total });
  }, [zones, editedZones, columns, sortKey, sortDir, rankLimit, rankDir, areaMode, query, performReset, notify]);

  // 드래그 중일 때만 드롭 대상 구역을 표시한다 (단순 호버와 분리)
  const isDragging = Boolean(dragZoneId) || candidateDrag;
  const dropTargetId = isDragging ? hoveredZoneId : null;
  const deltaRev = currentMetrics.rev - baseline.rev;
  const deltaEff = currentMetrics.eff - baseline.eff;
  const deltaProfit = currentMetrics.profit - baseline.profit;

  const visibleRows = useMemo(() => {
    const q = query.trim().toLowerCase();
    const filtered = q
      ? rows.filter((r) => r.name.toLowerCase().includes(q) || r.category.toLowerCase().includes(q) || r.zoneId.toLowerCase().includes(q))
      : rows;
    return sortRows(filtered, sortKey, sortDir);
  }, [rows, query, sortKey, sortDir]);

  return (
    <div className="flex h-full flex-col bg-[#FAF9F7]">
      {/* 키보드 사용자용 건너뛰기 링크 — Tab 1회로 후보/구역에 바로 도달한다 */}
      <div className="sr-only focus-within:not-sr-only fixed left-3 top-2 z-50 flex gap-1.5 rounded-lg bg-white p-1.5 shadow-lift ring-1 ring-slate-300">
        <button
          type="button"
          onClick={() => {
            setTab('candidates');
            // React 렌더가 끝난 뒤 카드가 실제로 생겼는지 확인하고 포커스를 넘긴다 (고정 지연은 타이밍을 놓친다)
            let tries = 0;
            const focusCard = () => {
              const card = document.querySelector('.cand-card');
              if (card) { card.focus(); return; }
              tries += 1;
              if (tries < 40) window.setTimeout(focusCard, 50);
            };
            window.setTimeout(focusCard, 0);
          }}
          className="rounded-md bg-slate-900 px-2.5 py-1 text-[11px] font-black text-white"
        >
          교체 후보로 건너뛰기
        </button>
        <button
          type="button"
          onClick={() => {
            const zone = document.querySelector('g[data-zone]');
            if (zone) zone.focus();
          }}
          className="rounded-md border border-slate-300 px-2.5 py-1 text-[11px] font-black text-slate-700"
        >
          도면 구역으로 건너뛰기
        </button>
      </div>
      {/* ---------- HEADER ---------- */}
      <header className="z-20 flex h-[74px] shrink-0 items-center justify-between gap-4 border-b border-slate-200 bg-white/90 px-6 backdrop-blur-md">
        <div className="flex shrink-0 items-center gap-3">
          <span className="rounded-lg bg-lotte-red px-2.5 py-1 text-xs font-black tracking-wider text-white shadow-sm">LOTTE</span>
          <div>
            <h1 className="flex items-center gap-2 text-base font-black tracking-tight text-slate-900">
              MD Floor-Tetris
              <span className="rounded-md bg-slate-100 px-2 py-0.5 text-[11px] font-bold text-slate-600">잠실점 B1 평면 CAD</span>
            </h1>
            <p className="text-[11px] font-semibold text-slate-400">층별 도면 기반 입점 브랜드 실적 · 신장율 조회</p>
          </div>
        </div>

        <div className="flex items-center gap-2.5">
          <KpiCapsule
            label="층 예상 월 총매출"
            value={currentMetrics.rev.toFixed(1)}
            unit="억"
            delta={deltaRev}
            deltaUnit="억"
            digits={1}
            footnote={`기준 ${baseline.rev.toFixed(1)}억`}
          />
          <KpiCapsule
            label="평균 평효율"
            value={man(currentMetrics.eff)}
            unit="천원/평"
            delta={deltaEff}
            deltaUnit="천원"
            digits={0}
            footnote={`기준 ${man(baseline.eff)}천원`}
          />
          <KpiCapsule
            label="총 이익액"
            value={currentMetrics.profit.toFixed(2)}
            unit="억"
            delta={deltaProfit}
            deltaUnit="억"
            digits={2}
            footnote={`평균 이익율 ${currentMetrics.profitRate.toFixed(1)}%`}
          />
        </div>

        <button
          type="button"
          onClick={handleReset}
          title={planZones ? '업로드한 도면에서 읽은 구획으로 되돌립니다' : '내장 기본 도면으로 되돌립니다'}
          className="flex shrink-0 items-center gap-1.5 rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-600 shadow-sm transition hover:bg-slate-50 active:scale-95"
        >
          <Icon name="RotateCcw" size={13} />
          {planZones ? '구획 복원' : '도면 리셋'}
        </button>
      </header>

      {/* ---------- BODY : 도면(좌상) + 대시보드(좌하) + 브랜드목록(우) ---------- */}
      <div className="flex min-h-0 flex-1 gap-3 overflow-hidden p-3">
        {/* 좌: 도면 + 지표 대시보드 */}
        <div className="flex min-h-0 min-w-0 flex-[1_1_73%] flex-col gap-3">
          <div className="cad-canvas-bg flex min-h-0 flex-[8] flex-col overflow-hidden rounded-2xl border border-slate-200/90 bg-white shadow-card">
            <div className="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200/80 bg-white/90 px-4 py-2 text-xs font-semibold text-slate-500 backdrop-blur-sm">
              <div className="flex min-w-0 items-center gap-2">
                <span className="flex min-w-0 items-center gap-1.5 font-bold text-slate-700">
                  <span className={`h-2 w-2 shrink-0 rounded-full ${plan ? 'bg-blue-700' : 'bg-emerald-500'}`} />
                  <span className="truncate">{plan ? plan.name : '잠실점 B1 기본 도면.svg'}</span>
                </span>
                <span className="shrink-0 rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-bold text-slate-500">
                  {plan ? plan.kind : '내장 도면'}
                </span>
              </div>

              <div className="flex shrink-0 items-center gap-1.5">
                <input
                  ref={fileRef}
                  id="plan-file-input"
                  type="file"
                  accept=".dwg,.dxf,.svg"
                  onChange={handlePickPlan}
                  className="peer sr-only"
                  aria-label="도면 파일 선택"
                />
                {/* label 이 input 을 직접 열어준다 — JS .click() 을 쓰지 않는다.
                    키보드는 input 이 포커스를 받아 Enter/Space 로 열리고,
                    그 포커스는 peer-focus-visible 로 label 테두리에 보인다. */}
                <label
                  htmlFor="plan-file-input"
                  title="지원 형식: DWG / DXF / SVG · 최대 40MB"
                  className="flex cursor-pointer items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-[11px] font-bold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50 active:scale-95 peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-[#1E3A8A]"
                >
                  <Icon name="Upload" size={12} />
                  도면 업로드
                </label>
                <span className="hidden shrink-0 text-[10px] font-semibold text-slate-400 xl:inline">DWG·DXF·SVG / 40MB</span>

                <button
                  type="button"
                  onClick={() => setShowZones((v) => !v)}
                  aria-pressed={showZones}
                  title={showZones ? '구역 라벨 끄기' : '구역 라벨 켜기'}
                  className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition active:scale-95 ${
                    showZones
                      ? 'border-slate-900 bg-slate-900 text-white hover:bg-slate-800'
                      : 'border-slate-300 bg-white text-slate-500 hover:bg-slate-50'
                  }`}
                >
                  <Icon name="Layers" size={12} />
                  구역 표시
                </button>

                {/* 배경 도면 토글 — 숨기지 않고 흑백 반투명으로 죽인다 (지시서 Step 2 · 4번) */}
                <button
                  id="toggleBgBtn"
                  type="button"
                  onClick={() => setShowBg((v) => !v)}
                  disabled={!plan}
                  aria-pressed={!showBg}
                  title={plan ? (showBg ? '배경 도면을 흐리게 해서 데이터에 집중합니다' : '원본 도면 배경을 선명하게 봅니다') : '도면을 먼저 업로드하세요'}
                  className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition active:scale-95 ${
                    !plan
                      ? 'cursor-not-allowed border-slate-200 bg-slate-50 text-slate-300'
                      : showBg
                        ? 'border-slate-300 bg-white text-slate-700 hover:border-slate-400 hover:bg-slate-50'
                        : 'border-slate-900 bg-slate-900 text-white hover:bg-slate-800'
                  }`}
                >
                  <Icon name={showBg ? 'EyeOff' : 'Eye'} size={12} />
                  {showBg ? '배경 도면 흐리게' : '집중 모드 해제'}
                </button>

                {/* 구역만 표시 — 도면 원본·추적선을 모두 걷어내고 구역 외곽선만 남긴다.
                    업로드 도면의 글자가 뭉쳐 판독이 안 될 때 쓰는 최후 수단. */}
                <button
                  id="toggleZonesOnlyBtn"
                  type="button"
                  onClick={() => setZonesOnly((v) => !v)}
                  disabled={!plan}
                  aria-pressed={zonesOnly}
                  title={plan ? (zonesOnly ? '원본 도면을 다시 보여줍니다' : '도면 원본·추적선을 걷어내고 구역 외곽선만 봅니다') : '도면을 먼저 업로드하세요'}
                  className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition active:scale-95 ${
                    !plan
                      ? 'cursor-not-allowed border-slate-200 bg-slate-50 text-slate-300'
                      : zonesOnly
                        ? 'border-slate-900 bg-slate-900 text-white hover:bg-slate-800'
                        : 'border-slate-300 bg-white text-slate-700 hover:border-slate-400 hover:bg-slate-50'
                  }`}
                >
                  <Icon name="Frame" size={12} />
                  구역만 표시
                </button>

                {analysis ? (
                  <button
                    type="button"
                    onClick={() => setShowTrace((v) => !v)}
                    aria-pressed={showTrace}
                    className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition active:scale-95 ${
                      showTrace
                        ? 'border-slate-900 bg-slate-900 text-white hover:bg-slate-800'
                        : 'border-slate-300 bg-white text-slate-500 hover:bg-slate-50'
                    }`}
                  >
                    <Icon name="Spline" size={12} />
                    선 추적
                  </button>
                ) : null}

                {analysis && analysis.stats && analysis.stats.regions > 0 ? (
                  <button
                    type="button"
                    onClick={() => setShowRegions((v) => !v)}
                    aria-pressed={showRegions}
                    className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition active:scale-95 ${
                      showRegions
                        ? 'border-slate-900 bg-slate-900 text-white hover:bg-slate-800'
                        : 'border-slate-300 bg-white text-slate-500 hover:bg-slate-50'
                    }`}
                  >
                    <Icon name="Frame" size={12} />
                    영역 {analysis.stats.regions}
                  </button>
                ) : null}

                <div className="flex items-center overflow-hidden rounded-lg border border-slate-300 bg-white text-[10.5px] font-bold">
                  <span className="px-1.5 py-1 text-slate-400">면적 연동</span>
                  <button
                    type="button"
                    onClick={() => setAreaMode('efficiency')}
                    aria-pressed={areaMode === 'efficiency'}
                    title="이동 후에도 평효율을 유지하고 매출을 새 평수로 다시 계산합니다"
                    className={`px-1.5 py-1 transition ${
                      areaMode === 'efficiency' ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'
                    }`}
                  >
                    평효율 유지
                  </button>
                  <button
                    type="button"
                    onClick={() => setAreaMode('absolute')}
                    aria-pressed={areaMode === 'absolute'}
                    title="매출은 그대로 두고 평효율만 새 평수로 다시 계산합니다"
                    className={`px-1.5 py-1 transition ${
                      areaMode === 'absolute' ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'
                    }`}
                  >
                    매출 고정
                  </button>
                </div>

                {plan ? (
                  <button
                    type="button"
                    onClick={handleClearPlan}
                    className="flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-[11px] font-bold text-slate-500 transition hover:bg-slate-50 active:scale-95"
                  >
                    <Icon name="Undo2" size={12} />
                    기본 도면
                  </button>
                ) : null}
              </div>
            </div>

            <div className="flex shrink-0 items-center justify-end border-t border-slate-100 px-4 py-1 text-[10px] font-semibold text-slate-400">
              <span className="tabular">
                {areaMode === 'efficiency'
                  ? '평효율 유지 — 25평→15평 이동 시 매출도 6.75억→4.05억으로 다시 계산'
                  : '매출 고정 — 25평→15평 이동해도 매출은 그대로, 평효율만 다시 계산'}
              </span>
            </div>

            <div
              className={`relative flex min-h-0 flex-1 items-center justify-center p-2 transition ${
                drawHover ? 'bg-blue-50/60 ring-2 ring-inset ring-blue-300' : ''
              }`}
              onDragOver={(ev) => {
                if (ev.dataTransfer.types.includes('Files')) {
                  ev.preventDefault();
                  ev.dataTransfer.dropEffect = 'copy';
                  setDrawHover(true);
                }
              }}
              onDragLeave={(ev) => {
                if (!ev.currentTarget.contains(ev.relatedTarget)) setDrawHover(false);
              }}
              onDrop={(ev) => {
                const files = ev.dataTransfer.files;
                if (files && files.length) {
                  ev.preventDefault();
                  setDrawHover(false);
                  loadPlanFile(files[0]);
                }
              }}
            >
              <FloorPlan
                rows={rows}
                hovered={hoveredZoneId}
                selectedZoneId={selectedZoneId}
                dropZoneId={dropTargetId}
                dragZoneId={dragZoneId}
                candidateDrag={candidateDrag}
                pulseZone={pulseZone}
                pointerDragEnabled={!editingAny}
                onPointerDragStart={handlePointerDragStart}
                onVertexDrag={handleVertexDrag}
                onHover={setHoveredZoneId}
                onLeave={() => setHoveredZoneId(null)}
                onActivate={handleActivate}
                onApplyBrand={handleApplyBrand}
                onSwap={handleSwap}
                onDragStartZone={setDragZoneId}
                onDragEndZone={() => setDragZoneId(null)}
                plan={plan}
                showZones={showZones}
                analysis={analysis}
                showTrace={showTrace}
                showRegions={showRegions}
                showBg={showBg}
                zonesOnly={zonesOnly}
              />

              {drawHover ? (
                <div className="pointer-events-none absolute inset-2 flex items-center justify-center rounded-xl border-2 border-blue-300 bg-white/70 ring-4 ring-blue-200/60">
                  <span className="text-sm font-black text-blue-700">여기에 놓으면 도면으로 적용됩니다</span>
                </div>
              ) : null}

              {/* 첫 화면 안내 — 도면 뷰어 내부 빈 공간(구획 사이 여백)에 띄운다.
                  예전에는 bottom-14 로 뷰어 바닥에 붙은 알약이라 '하단 안내 문구'로 보였다
                  (지시서 Task 7-3: 하단 텍스트 삭제 + 도면 내부 배너). */}
              {!plan && !drawHover ? (
                <div className="pointer-events-none absolute inset-x-0 top-[27%] z-10 flex -translate-y-1/2 justify-center px-4">
                  <div className="flex items-center gap-2.5 rounded-xl border border-blue-200 bg-white/95 px-4 py-2.5 shadow-lift">
                    <Icon name="MousePointerClick" size={14} className="shrink-0 text-blue-700" />
                    <span className="text-[12px] font-bold leading-snug text-slate-700">
                      후보 브랜드를 도면으로 드래그하거나,
                      <span className="mx-1 text-slate-300">|</span>
                      카드 선택 후 구역을 클릭하세요
                    </span>
                  </div>
                </div>
              ) : null}

              {!showZones ? (
                <div className="pointer-events-none absolute inset-0 z-10 flex items-center justify-center">
                  <div className="rounded-xl border border-slate-300 bg-white/95 px-4 py-3 text-center shadow-lift">
                    <p className="text-[12px] font-black text-slate-700">구역 라벨이 꺼져 있습니다</p>
                    <p className="mt-1 text-[11px] font-semibold text-slate-500">
                      다시 켜려면 상단의 <span className="font-black text-slate-700">구역 표시</span>를 누르세요
                    </p>
                  </div>
                </div>
              ) : null}

              {parsing ? (
                <div className="absolute inset-0 z-10 flex flex-col items-center justify-center gap-3 bg-white/80 backdrop-blur-sm">
                  <span className="h-7 w-7 animate-spin rounded-full border-[3px] border-slate-200 border-t-blue-700" />
                  <span className="text-[12px] font-bold text-slate-600">{parsing}</span>
                </div>
              ) : null}

              {parseError ? (
                <div className="absolute inset-x-4 bottom-3 z-10 flex items-start gap-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2">
                  <Icon name="AlertCircle" size={14} className="mt-0.5 shrink-0 text-rose-500" />
                  <div className="min-w-0 flex-1">
                    <p className="text-[11.5px] font-bold text-rose-800">도면을 해석하지 못했습니다</p>
                    <p className="mt-0.5 text-[10.5px] leading-relaxed text-rose-600">{parseError}</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setParseError(null)}
                    aria-label="오류 닫기"
                    className="shrink-0 rounded p-0.5 text-rose-400 transition hover:bg-rose-100 hover:text-rose-700"
                  >
                    <Icon name="X" size={12} stroke={2.6} />
                  </button>
                </div>
              ) : null}
            </div>

            <div className="flex shrink-0 items-center justify-between border-t border-slate-100 px-4 py-1.5 text-[10px] font-semibold text-slate-400">
              <div className="flex items-center gap-3">
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm border border-slate-300 bg-white" />현행</span>
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-amber-400" />개편 필요</span>
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-emerald-500" />신규 교체</span>
              </div>
              <div className="flex items-center gap-3 tabular">
                {analysis && analysis.stats ? (
                  <span className="rounded bg-slate-100 px-1.5 py-0.5 font-bold text-slate-600">
                    {analysis.stats.format} · 선 {analysis.stats.lines || analysis.stats.entities}
                    {analysis.stats.regions ? ` · 영역 ${analysis.stats.regions}` : ''}
                  </span>
                ) : null}
                <span>{rows.length}개 구역 · {currentMetrics.pyeong}평 · 교체 {rows.filter((r) => r.isReplaced).length}건 · 수정 {rows.filter((r) => r.edited).length}건</span>
              </div>
            </div>
          </div>

          <div className="min-h-0 flex-[2]">
            <RankingDashboard
              rows={rows}
              columns={columns}
              limit={rankLimit}
              dir={rankDir}
              selectedZoneId={selectedZoneId}
              onSelect={selectFromList}
              onCommitValue={handleCommitMetric}
              onHeaderChange={handleColumnChange}
              onHeaderRemove={handleColumnRemove}
              onAddColumn={handleColumnAdd}
              onResetColumns={() => {
                setColumns(DEFAULT_COLUMNS);
                notify('지표 컬럼을 기본 구성으로 되돌렸습니다');
              }}
              onLimit={setRankLimit}
              onToggleDir={() => setRankDir((d) => (d === 'desc' ? 'asc' : 'desc'))}
              pulseZone={pulseZone}
            />
          </div>
        </div>


        {/* 우: 브랜드 목록 (검색 + 정렬) / 교체 후보 */}
        <div className="flex min-h-0 w-[27%] min-w-[300px] max-w-[400px] shrink-0 flex-col">
          <BrandListPanel
            rows={rows}
            visibleRows={visibleRows}
            query={query}
            onQuery={setQuery}
            sortKey={sortKey}
            onSortKey={setSortKey}
            sortDir={sortDir}
            onToggleDir={() => setSortDir((d) => (d === 'desc' ? 'asc' : 'desc'))}
            selectedZoneId={selectedZoneId}
            onSelect={selectFromList}
            tab={tab}
            onTab={setTab}
            candidates={CANDIDATES}
            selectedCandidate={selectedCandidate}
            usedCounts={usedCounts}
            occupiedBy={usedBy}
            onSelectCandidate={selectCandidate}
            onDragStart={setDragZoneId}
            onDragEndZone={() => setDragZoneId(null)}
            onCandidateDragStart={() => setCandidateDrag(true)}
            onCandidateDragEnd={() => setCandidateDrag(false)}
            onOpenData={openDataSheet}
            onDownloadTemplate={downloadDataTemplate}
            dataBusy={dataBusy}
          />
        </div>

      </div>

      {/* 토스트 스택 — 한 컨테이너에 모아 세로로 쌓는다.
          따로 띄우면 되돌리기와 일반 안내가 서로 겹친다.
          대시보드 카드 하단은 뷰포트 바닥에서 41px 지점이다. 지시값 40px 로 두면
          49px 높이 토스트가 카드 안쪽으로 47px 파고들어 하단 지표 행을 가린다(실측).
          그래서 아래 스트립(41px) 안에 들어가도록 bottom 8px 로 내리고 토스트를 압축했다.
          z-index 9999 는 지시값 그대로. */}
      {toast || actionToast ? (
      <div
        role="status"
        aria-live="polite"
        style={{ zIndex: 9999, bottom: '6px' }}
        className="pointer-events-none fixed left-1/2 flex -translate-x-1/2 flex-col items-center gap-2"
      >
      {toast ? (
        <div
          data-toast-kind="notice"
          className="flex items-center gap-1 rounded-md border border-slate-200 bg-white px-2.5 py-1 shadow-lift"
        >
          <span className="flex h-3 w-3 items-center justify-center rounded-full bg-emerald-500 text-white">
            <Icon name="Check" size={8} stroke={3} />
          </span>
          <span className="text-[10.5px] font-semibold tracking-tight text-slate-700">{toast}</span>
        </div>
      ) : null}

      {/* 되돌리기 — 9초. 일반 안내가 떠도 덮이지 않고, 위로 쌓여 겹치지도 않는다. */}
      {actionToast ? (
        <div
          data-toast-kind="action"
          className="pointer-events-auto flex items-center gap-1 rounded-md border border-slate-300 bg-white px-2.5 py-1 shadow-lift"
        >
          <span className="flex h-3 w-3 items-center justify-center rounded-full bg-blue-700 text-white">
            <Icon name="Check" size={8} stroke={3} />
          </span>
          <span className="text-[10.5px] font-semibold tracking-tight text-slate-700">{actionToast.message}</span>
          <button
            type="button"
            onClick={() => {
              const act = actionToast.action;
              setActionToast(null);
              if (actionTimer.current) clearTimeout(actionTimer.current);
              if (act && act.run) act.run();
            }}
            className="ml-0.5 shrink-0 rounded border border-slate-300 bg-white px-1.5 py-[1px] text-[10px] font-black text-slate-700 transition hover:bg-slate-50 active:scale-95"
          >
            {actionToast.action.label}
          </button>
        </div>
      ) : null}
      </div>
      ) : null}

      {/* 백데이터 편집 팝업 — 파일을 고르는 게 아니라 표에서 직접 고친다 */}
      {sheet ? (
        <BackDataDialog
          sheet={sheet}
          busy={dataBusy}
          fileRef={dataFileRef}
          onCell={handleSheetCell}
          onPickFile={handlePickData}
          onDownload={downloadDataTemplate}
          onApply={applyDataSheet}
          onClose={() => setSheet(null)}
        />
      ) : null}

      {uploadAsk ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/25 px-4">
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="upload-dialog-title"
            className="w-full max-w-[460px] rounded-2xl border border-slate-200 bg-white p-5 shadow-lift"
          >
            <div className="flex items-start gap-3">
              <span className="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-blue-50 text-blue-700">
                <Icon name="FileSearch" size={15} stroke={2.4} />
              </span>
              <div className="min-w-0">
                <h3 id="upload-dialog-title" className="truncate text-[14px] font-black tracking-tight text-slate-900">도면 분석 결과</h3>
                <p className="mt-0.5 truncate text-[11px] font-semibold text-slate-500">{uploadAsk.name}</p>
              </div>
            </div>

            <div className="mt-3 grid grid-cols-2 gap-2">
              <div className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                <p className="text-[10px] font-bold text-slate-400">인식 구역</p>
                <p className="text-[15px] font-black tabular text-slate-900">{uploadAsk.zoneCount}개</p>
              </div>
              <div className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                <p className="text-[10px] font-bold text-slate-400">총 면적</p>
                <p className="text-[15px] font-black tabular text-slate-900">{Math.round(uploadAsk.areaSum).toLocaleString()}</p>
              </div>
            </div>

            <p className="mt-3 text-[10.5px] font-black text-slate-500">인식된 원본 라벨</p>
            <ul className="custom-scrollbar mt-1 max-h-[120px] space-y-0.5 overflow-y-auto rounded-xl border border-slate-200 bg-white px-2.5 py-2 text-[10.5px] font-semibold text-slate-600">
              {uploadAsk.labels.length === 0 ? (
                <li className="text-slate-400">라벨 없음</li>
              ) : uploadAsk.labels.map((lb, i) => (
                <li key={`lb-${i}`} className="truncate">{lb}</li>
              ))}
            </ul>
            {uploadAsk.zoneCount > 40 ? (
              <p className="mt-1 text-[10px] font-semibold text-slate-400">외 {uploadAsk.zoneCount - 40}개 더</p>
            ) : null}

            <p className="mt-3 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-[11px] font-semibold leading-relaxed text-amber-800">
              적용 시 기존 구역 {zones.length}개와 배치된 브랜드가 초기화됩니다.
            </p>

            <div className="mt-4 flex items-center justify-end gap-2">
              <button
                type="button"
                onClick={() => setUploadAsk(null)}
                className="rounded-lg border border-slate-300 bg-white px-3 py-2 text-[11.5px] font-bold text-slate-600 transition hover:bg-slate-50 active:scale-95"
              >
                취소
              </button>
              <button
                type="button"
                onClick={() => {
                  const ask = uploadAsk;
                  setUploadAsk(null);
                  applyParsedPlan({ file: ask.file, out: ask.out });
                }}
                className="rounded-lg bg-slate-900 px-3 py-2 text-[11.5px] font-black text-white transition hover:bg-slate-800 active:scale-95"
              >
                적용하기
              </button>
            </div>
          </div>
        </div>
      ) : null}

      {resetAsk ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/25 px-4">
          <div
            role="dialog"
            aria-modal="true"
            aria-labelledby="reset-dialog-title"
            className="w-full max-w-[420px] rounded-2xl border border-slate-200 bg-white p-5 shadow-lift"
          >
            <div className="flex items-start gap-3">
              <span className="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-rose-50 text-rose-600">
                <Icon name="RotateCcw" size={15} stroke={2.4} />
              </span>
              <div className="min-w-0">
                <h3 id="reset-dialog-title" className="text-[14px] font-black tracking-tight text-slate-900">전체 리셋</h3>
                <p className="mt-1 text-[12px] leading-relaxed text-slate-600">
                  모든 변경이 사라집니다. 계속할까요?
                </p>
              </div>
            </div>

            <ul className="mt-3 space-y-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-[11.5px] font-semibold text-slate-600">
              {resetAsk.replaceCount > 0 ? <li>교체 {resetAsk.replaceCount}건</li> : null}
              {resetAsk.editCount > 0 ? <li>수치 수정 {resetAsk.editCount}건</li> : null}
              {resetAsk.colsChanged ? <li>지표 컬럼 구성</li> : null}
              {resetAsk.settingsChanged ? <li>정렬 · Top N · 면적 연동 모드 · 검색어</li> : null}
            </ul>

            <p className="mt-2.5 text-[10.5px] leading-relaxed text-slate-400">
              리셋 후 토스트의 <span className="font-black text-slate-500">되돌리기</span>로 한 번 복구할 수 있습니다.
            </p>

            <div className="mt-4 flex items-center justify-end gap-2">
              <button
                type="button"
                onClick={() => setResetAsk(null)}
                className="rounded-xl border border-slate-300 bg-white px-3.5 py-2 text-[12px] font-bold text-slate-600 transition hover:bg-slate-50 active:scale-95"
              >
                취소
              </button>
              <button
                type="button"
                onClick={() => { setResetAsk(null); performReset(); }}
                className="rounded-xl bg-slate-900 px-3.5 py-2 text-[12px] font-black text-white transition hover:bg-slate-800 active:scale-95"
              >
                리셋 실행
              </button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
