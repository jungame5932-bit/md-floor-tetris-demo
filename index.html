  const [plan, setPlan] = useState(null);       // { url, name, kind, analysis }
  const [analysis, setAnalysis] = useState(null); // { polys, regions, stats, pathD, regionD }
  const [parsing, setParsing] = useState(null);   // 진행 메시지
  const [parseError, setParseError] = useState(null);
  const [showZones, setShowZones] = useState(true);
  const [showTrace, setShowTrace] = useState(true);
  const [showRegions, setShowRegions] = useState(false);
  const [drawHover, setDrawHover] = useState(false);
  const [selectedZoneId, setSelectedZoneId] = useState(null);
  const [dragZoneId, setDragZoneId] = useState(null);
  const [candidateDrag, setCandidateDrag] = useState(false);
  const [tab, setTab] = useState('brands');
  const [query, setQuery] = useState('');
  const [sortKey, setSortKey] = useState('salesCurr');
  const [sortDir, setSortDir] = useState('desc');
  const [columns, setColumns] = useState(DEFAULT_COLUMNS);
  const [rankLimit, setRankLimit] = useState(3);
  const [rankDir, setRankDir] = useState('desc');
  const [pulseZone, setPulseZone] = useState(null);
  const [areaMode, setAreaMode] = useState('efficiency'); // 'efficiency' | 'absolute'
  const [editingAny, setEditingAny] = useState(false);
  const [editedZones, setEditedZones] = useState({});     // { Z-01: true }
  const pulseTimer = useRef(null);
  const fileRef = useRef(null);
  const planUrlRef = useRef(null);

  const [baseline, setBaseline] = useState(() => metricsOf(ZONES_BASE));
  const currentMetrics = useMemo(() => metricsOf(zones), [zones]);

  const usedCounts = useMemo(() => {
    const counts = {};
    zones.forEach((z) => {
      if (!z.isReplaced) return;
      counts[z.currentBrand.name] = (counts[z.currentBrand.name] || 0) + 1;
    });
    return counts;
  }, [zones]);

  useEffect(() => () => { if (toastTimer.current) clearTimeout(toastTimer.current); }, []);

  // 언마운트 시 마지막 blob URL 해제
  useEffect(() => () => {
    if (planUrlRef.current) URL.revokeObjectURL(planUrlRef.current);
  }, []);

  const notify = useCallback((message) => {
    setToast(message);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 1900);
  }, []);

  /** 구역을 잠깐 펄스로 강조 (스왑 피드백) */
  const pulse = useCallback((zoneId) => {
    setPulseZone(zoneId);
    if (pulseTimer.current) clearTimeout(pulseTimer.current);
    pulseTimer.current = setTimeout(() => setPulseZone(null), 420);
  }, []);

  /* ---------------- SVG 포인터 드래그 (5px 임계값) ---------------- */
  const dragRef = useRef(null);
  const [dragTargetId, setDragTargetId] = useState(null);

  const endPointerDrag = useCallback((commit) => {
    const st = dragRef.current;
    dragRef.current = null;
    if (!st) return;
    document.removeEventListener('mousemove', st.onMove);
    document.removeEventListener('mouseup', st.onUp);
    const ghost = document.getElementById('dragGhost');
    if (ghost) ghost.remove();
    setDragTargetId(null);
    setDragZoneId(null);
    setCandidateDrag(false);
    if (commit && st.active && st.targetId && st.targetId !== st.sourceId) {
      handleSwapRef.current(st.sourceId, st.targetId);
    }
  }, []);

  const handlePointerDragStart = useCallback((ev, zoneId, row) => {
    if (editingAny) {
      // 인라인 편집 중이면 드래그를 시작하지 않는다 (지시서 Step 4 엣지케이스)
      return;
    }
    ev.preventDefault();
    const startX = ev.clientX;
    const startY = ev.clientY;
    let active = false;
    let targetId = null;
    let ghostEl = null;

    const hitTest = (x, y) => {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const g = el.closest ? el.closest('g[data-zone]') : null;
      return g ? g.getAttribute('data-zone') : null;
    };

    const onMove = (me) => {
      const dist = Math.hypot(me.clientX - startX, me.clientY - startY);
      if (!active && dist >= 5) {
        active = true;
        setDragZoneId(zoneId);
        ghostEl = document.createElement('div');
        ghostEl.id = 'dragGhost';
        ghostEl.textContent = `${row.name} · ${moneyShort(row.salesCurr)}`;
        document.body.appendChild(ghostEl);
      }
      if (!active) return;
      if (ghostEl) {
        ghostEl.style.left = `${me.clientX}px`;
        ghostEl.style.top = `${me.clientY}px`;
      }
      const hit = hitTest(me.clientX, me.clientY);
      const nextTarget = hit && hit !== zoneId ? hit : null;
      if (nextTarget !== targetId) {
        targetId = nextTarget;
        setDragTargetId(nextTarget);
        setHoveredZoneId(nextTarget);
      }
    };

    const onUp = () => {
      // active/targetId 는 지역 변수라 여기서 ref 로 확정해줘야 endPointerDrag 가 판단할 수 있다
      const st = dragRef.current;
      if (st) { st.targetId = targetId; st.active = active; }
      endPointerDrag(true);
    };

    dragRef.current = { sourceId: zoneId, targetId: null, active: false, onMove, onUp };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }, [editingAny, endPointerDrag]);

  // handleSwap 은 뒤에서 정의되므로 ref 로 최신 참조를 잡아둔다
  const handleSwapRef = useRef(null);

  /** 한 구역의 브랜드 원천값을 바꾸고 '수정됨' 표시를 남긴다 */
  const patchBrand = useCallback((zoneId, updater) => {
    setZones((prev) => prev.map((z) => {
      if (z.id !== zoneId) return z;
      const next = updater(z.currentBrand, z.area);
      if (!next) return z;
      return { ...z, currentBrand: next, isReplaced: true };
    }));
    setEditedZones((prev) => ({ ...prev, [zoneId]: true }));
    pulse(zoneId);
  }, [pulse]);

  /** 대시보드 인라인 편집 확정 → 해당 구역만 갱신, 나머지는 파생이라 자동 동기화 */
  const handleCommitMetric = useCallback((zoneId, key, value) => {
    const zone = zones.find((z) => z.id === zoneId);
    if (!zone) return;
    const next = applyMetricEdit(zone.currentBrand, zone.area, key, value);
    if (!next) { notify('이 값은 계산할 수 없습니다'); return; }
    patchBrand(zoneId, () => next);
    notify(`${zoneId} · ${(METRIC_BY_KEY[key] || {}).label || key} 수정`);
  }, [zones, patchBrand, notify]);

  /* ---------------- 대시보드 컬럼 편집 ---------------- */

  const handleColumnChange = useCallback((fromKey, toKey) => {
    setColumns((prev) => {
      if (prev.includes(toKey) && toKey !== fromKey) {
        // 이미 다른 컬럼에 있는 지표를 고르면 두 컬럼을 맞바꾼다
        return prev.map((k) => (k === fromKey ? toKey : k === toKey ? fromKey : k));
      }
      return prev.map((k) => (k === fromKey ? toKey : k));
    });
  }, []);

  const handleColumnRemove = useCallback((key) => {
    setColumns((prev) => (prev.length <= 1 ? prev : prev.filter((k) => k !== key)));
  }, []);

  const handleColumnAdd = useCallback(() => {
    setColumns((prev) => {
      const next = METRICS.find((m) => !prev.includes(m.key));
      return next ? [...prev, next.key] : prev;
    });
  }, []);

  /** 어떤 브랜드든 주어진 평수에 맞춰 매출을 다시 계산한다 */
  const rebaseBrand = useCallback((brand, area) => {
    // 매출이 없는 브랜드는 평효율로부터 만들어 둔다
    const curr0 = typeof brand.salesCurr === 'number' && brand.salesCurr > 0
      ? brand.salesCurr
      : Math.round(area * brand.pyeongEfficiency * 1e4);
    const prev0 = typeof brand.salesPrev === 'number' ? brand.salesPrev : 0;

    if (areaMode === 'absolute') {
      // 모드 B: 절대 매출 고정 — 매출·전년매출·이익율을 그대로 옮기고 평효율만 재산출
      return {
        ...brand,
        salesCurr: curr0,
        salesPrev: prev0,
        pyeongEfficiency: efficiencyOf(curr0, area) / 1e4,
      };
    }

    // 모드 A: 평효율 유지 — 매출을 새 평수로 다시 계산하고 전년 매출은 신장율을 보존해 역산
    const eff = typeof brand.pyeongEfficiency === 'number' && brand.pyeongEfficiency > 0
      ? brand.pyeongEfficiency
      : efficiencyOf(curr0, area) / 1e4;
    const curr = Math.round(area * eff * 1e4);
    const g = growthOf(curr0, prev0);
    const prev = g != null && g > -99.9 ? Math.round(curr / (1 + g / 100)) : prev0;
    return { ...brand, pyeongEfficiency: eff, salesCurr: curr, salesPrev: prev };
  }, [areaMode]);

  /** 구역 클릭 — 후보가 선택돼 있으면 그 자리에 입점, 아니면 하이라이트 */
  const handleActivate = useCallback((zoneId) => {
    const cand = CANDIDATES.find((c) => c.id === selectedCandidate);
    if (!cand) {
      setSelectedZoneId((cur) => (cur === zoneId ? null : zoneId));
      return;
    }
    setZones((prev) => prev.map((z) => {
      if (z.id !== zoneId) return z;
      return { ...z, currentBrand: brandForZone(cand, z.area), isReplaced: true };
    }));
    setSelectedCandidate(null);
    setSelectedZoneId(zoneId);
    notify(`${zoneId} · ${cand.name} 입점`);
  }, [selectedCandidate, notify]);

  /** 후보 브랜드 드롭 */
  const handleApplyBrand = useCallback((zoneId, brand) => {
    if (!brand) { notify('후보 브랜드 정보를 읽지 못했습니다'); return; }
    setZones((prev) => prev.map((z) => {
      if (z.id !== zoneId) return z;
      return { ...z, currentBrand: brandForZone(brand, z.area), isReplaced: true };
    }));
    setSelectedZoneId(zoneId);
    setEditedZones((prev) => ({ ...prev, [zoneId]: true }));
    pulse(zoneId);
    notify(`${zoneId} · ${brand.name} 입점`);
  }, [notify, pulse]);

  /** 구역 ↔ 구역 브랜드 자리 교환 (평수가 다르면 매출을 새 면적으로 재계산) */
  const handleSwap = useCallback((fromId, toId) => {
    setZones((prev) => {
      const a = prev.find((z) => z.id === fromId);
      const b = prev.find((z) => z.id === toId);
      if (!a || !b) return prev;
      // A 구역은 B 의 브랜드를 받고, B 구역은 A 의 브랜드를 받는다.
      // 매출은 받는 구역의 평수로 다시 계산해야 평효율이 유지된다.
      const brandForA = rebaseBrand(b.currentBrand, a.area);
      const brandForB = rebaseBrand(a.currentBrand, b.area);
      const baseA = a.originBrand || (ZONES_BASE.find((z) => z.id === fromId) || {}).currentBrand;
      const baseB = b.originBrand || (ZONES_BASE.find((z) => z.id === toId) || {}).currentBrand;
      return prev.map((z) => {
        if (z.id === fromId) return { ...z, currentBrand: brandForA, isReplaced: !baseA || brandForA.name !== baseA.name };
        if (z.id === toId) return { ...z, currentBrand: brandForB, isReplaced: !baseB || brandForB.name !== baseB.name };
        return z;
      });
    });
    setDragZoneId(null);
    setSelectedZoneId(toId);
    setEditedZones((prev) => ({ ...prev, [fromId]: true, [toId]: true }));
    pulse(toId);
    notify(`${fromId} ⇄ ${toId} 자리 교환`);
  }, [rebaseBrand, notify, pulse]);

  // 포인터 드래그 컨트롤러가 최신 handleSwap 을 참조하도록
  handleSwapRef.current = handleSwap;

  const handleRevert = useCallback((zoneId) => {
    setZones((prev) => prev.map((z) => {
      if (z.id !== zoneId) return z;
      const origin = z.originBrand || (ZONES_BASE.find((b) => b.id === zoneId) || {}).currentBrand;
      if (!origin) return z;
      return { ...z, currentBrand: { ...origin }, isReplaced: false };
    }));
    notify(`${zoneId} 원래 브랜드로 복원`);
  }, [notify]);

  /* ---------------- 도면 해석 파이프라인 ---------------- */

  const resetAnalysis = useCallback(() => {
    setAnalysis(null);
    setParseError(null);
  }, []);

  /** PDF → 첫 페이지를 캔버스로 렌더 */
  const renderPdfFirstPage = useCallback(async (buf) => {
    const pdfjs = window.pdfjsLib;
    if (!pdfjs) throw new Error('PDF 엔진을 불러오지 못했습니다 (네트워크 확인)');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const doc = await pdfjs.getDocument({ data: buf }).promise;
    const page = await doc.getPage(1);
    const baseView = page.getViewport({ scale: 1 });
    const scale = Math.min(3, Math.max(1, 1800 / Math.max(baseView.width, baseView.height)));
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    return { canvas, pages: doc.numPages };
  }, []);

  const analyzeFile = useCallback(async (file) => {
    const P = window.PlanParser;
    const name = file.name;
    const ext = (name.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
    const VB = { w: 1000, h: 680, pad: 18 };

    // --- DXF ---
    if (ext === 'dxf') {
      setParsing('DXF 엔티티 해석 중…');
      const text = await file.text();
      const res = P.parseDxf(text);
      if (!res.polys.length) throw new Error('DXF에서 그릴 수 있는 선을 찾지 못했습니다 (블록/레이어 확인)');
      const dxfRegions = P.regionsFromPolys(res.polys);
      res.stats.regions = dxfRegions.length;
      return { patches: res.polys, regions: dxfRegions, stats: res.stats, kind: 'DXF', vector: true };
    }

    // --- SVG ---
    if (ext === 'svg' || file.type === 'image/svg+xml') {
      setParsing('SVG 도형 추출 중…');
      const text = await file.text();
      const res = P.svgToPolys(text, VB.w, VB.h, VB.pad);
      if (!res.polys.length) throw new Error('SVG에서 그릴 수 있는 도형을 찾지 못했습니다');
      return { patches: res.polys, regions: res.regions || [], rect: res.rect, stats: res.stats, kind: 'SVG', vector: true, svgText: text };
    }

    // --- PDF ---
    if (ext === 'pdf' || file.type === 'application/pdf') {
      setParsing('PDF 첫 페이지 렌더링 중…');
      const buf = await file.arrayBuffer();
      const { canvas, pages } = await renderPdfFirstPage(buf);
      setParsing('PDF 선 추적 중… (세선화)');
      await new Promise((r) => setTimeout(r, 30));
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const res = P.traceRaster(imgData, { tw: VB.w, th: VB.h, pad: VB.pad });
      if (!res.polys.length && !res.regions.length) throw new Error('PDF에서 선을 추적하지 못했습니다');
      res.stats.pages = pages;
      res.stats.format = 'PDF';
      return { patches: res.polys, regions: res.regions, stats: res.stats, kind: 'PDF', raster: canvas };
    }

    // --- PNG / JPG ---
    if (/^image\//.test(file.type || '') || /^(png|jpe?g|webp|gif|bmp)$/i.test(ext)) {
      setParsing('이미지 디코딩 중…');
      const bitmap = await createImageBitmap(file);
      const maxSide = 1500;
      const sc = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(bitmap.width * sc));
      canvas.height = Math.max(1, Math.round(bitmap.height * sc));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      setParsing('선 추적 중… (세선화)');
      await new Promise((r) => setTimeout(r, 30));
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const res = P.traceRaster(imgData, { tw: VB.w, th: VB.h, pad: VB.pad });
      if (!res.polys.length && !res.regions.length) throw new Error('이미지에서 선을 추적하지 못했습니다');
      res.stats.format = ext.toUpperCase();
      return { patches: res.polys, regions: res.regions, stats: res.stats, kind: ext.toUpperCase(), raster: canvas };
    }

    throw new Error('지원하지 않는 형식입니다 — DXF / SVG / PDF / PNG / JPG');
  }, [renderPdfFirstPage]);

  const loadPlanFile = useCallback(async (file) => {
    if (!file) return;
    if (file.size > 40 * 1024 * 1024) { notify('파일이 40MB를 넘습니다 — 더 작은 도면을 쓰세요'); return; }

    setParseError(null);
    setParsing('도면 준비 중…');
    try {
      const out = await analyzeFile(file);

      // 배경 이미지 URL
      if (planUrlRef.current) URL.revokeObjectURL(planUrlRef.current);
      let url = null;
      if (out.svgText) {
        url = URL.createObjectURL(new Blob([out.svgText], { type: 'image/svg+xml' }));
      } else if (out.raster) {
        const blob = await new Promise((res) => out.raster.toBlob(res, 'image/png'));
        url = URL.createObjectURL(blob);
      }
      planUrlRef.current = url;

      const pathD = window.PlanParser.toPathData(out.patches, 2);
      const regionD = window.PlanParser.toPathData(out.regions, 2);

      setAnalysis({ ...out, pathD, regionD });
      setPlan({ url, name: file.name, kind: out.kind });
      setShowZones(true);
      setShowTrace(out.kind !== 'SVG');

      // 도면에서 읽은 구획으로 구역을 새로 세운다 (기존 목업을 걷어낸다)
      const derived = zonesFromRegions(out.regions, ZONES_BASE.map((z) => z.currentBrand), PLAN_TOTAL_PYEONG);
      if (derived && derived.length >= 2) {
        setZones(derived);
        setBaseline(metricsOf(derived));
        setSelectedZoneId(null);
        setEditedZones({});
        notify(`${file.name} · 구획 ${derived.length}개 인식`);
      } else {
        // 구획을 못 찾았는데 목업 구역을 남기면 엉뚱한 도면 위에 옛 구역이 겹친다.
        // 구역을 비우고 감지된 닫힌 영역을 보여줘서 무엇이 잡혔는지 확인하게 한다.
        setZones([]);
        setBaseline({ rev: 0, profit: 0, pyeong: 0, eff: 0, profitRate: 0 });
        setSelectedZoneId(null);
        setEditedZones({});
        setShowRegions(true);
        notify(`${file.name} · 닫힌 구획을 찾지 못했습니다 (영역 표시를 확인)`);
      }
    } catch (err) {
      setParseError(String(err && err.message ? err.message : err));
      notify('도면 해석 실패 — 형식을 확인하세요');
    } finally {
      setParsing(null);
    }
  }, [analyzeFile, notify]);

  const handlePickPlan = useCallback((ev) => {
    const file = ev.target.files && ev.target.files[0];
    loadPlanFile(file);
    ev.target.value = '';
  }, [loadPlanFile]);

  const handleClearPlan = useCallback(() => {
    if (planUrlRef.current) { URL.revokeObjectURL(planUrlRef.current); planUrlRef.current = null; }
    setPlan(null);
    setAnalysis(null);
    setParseError(null);
    setShowZones(true);
    setZones(cloneBase());
    setBaseline(metricsOf(ZONES_BASE));
    setSelectedZoneId(null);
    setEditedZones({});
    notify('기본 도면으로 되돌렸습니다');
  }, [notify]);

  const handleReset = useCallback(() => {
    setZones(cloneBase());
    setBaseline(metricsOf(ZONES_BASE));
    setSelectedCandidate(null);
    setHoveredZoneId(null);
    setEditedZones({});
    setPulseZone(null);
    notify('초기 도면으로 복원했습니다');
  }, [notify]);

  const rows = useMemo(
    () => storeRows(zones).map((r) => ({ ...r, edited: Boolean(editedZones[r.zoneId]) })),
    [zones, editedZones],
  );

  // 드래그 중일 때만 드롭 대상 구역을 표시한다 (단순 호버와 분리)
  const isDragging = Boolean(dragZoneId) || candidateDrag;
  const dropTargetId = isDragging ? hoveredZoneId : null;
  const deltaRev = currentMetrics.rev - baseline.rev;
  const deltaEff = currentMetrics.eff - baseline.eff;
  const deltaProfit = currentMetrics.profit - baseline.profit;

  const visibleRows = useMemo(() => {
    const q = query.trim().toLowerCase();
    const filtered = q
      ? rows.filter((r) => r.name.toLowerCase().includes(q) || r.category.toLowerCase().includes(q) || r.zoneId.toLowerCase().includes(q))
      : rows;
    return sortRows(filtered, sortKey, sortDir);
  }, [rows, query, sortKey, sortDir]);

  return (
    <div className="flex h-full flex-col bg-[#F8FAFC]">
      {/* ---------- HEADER ---------- */}
      <header className="z-20 flex h-[74px] shrink-0 items-center justify-between gap-4 border-b border-slate-200 bg-white/90 px-6 backdrop-blur-md">
        <div className="flex shrink-0 items-center gap-3">
          <span className="rounded-lg bg-lotte-red px-2.5 py-1 text-xs font-black tracking-wider text-white shadow-sm">LOTTE</span>
          <div>
            <h1 className="flex items-center gap-2 text-base font-black tracking-tight text-slate-900">
              MD Floor-Tetris
              <span className="rounded-md bg-slate-100 px-2 py-0.5 text-[11px] font-bold text-slate-600">잠실점 B1 평면 CAD</span>
            </h1>
            <p className="text-[11px] font-semibold text-slate-400">층별 도면 기반 입점 브랜드 실적 · 신장율 조회</p>
          </div>
        </div>

        <div className="flex items-center gap-2.5">
          <KpiCapsule
            label="층 예상 월 총매출"
            value={currentMetrics.rev.toFixed(1)}
            unit="억"
            delta={deltaRev}
            deltaUnit="억"
            digits={1}
            footnote={`기준 ${baseline.rev.toFixed(1)}억`}
          />
          <KpiCapsule
            label="평균 평효율"
            value={man(currentMetrics.eff)}
            unit="만/평"
            delta={deltaEff}
            deltaUnit="만"
            digits={0}
            footnote={`기준 ${man(baseline.eff)}만`}
          />
          <KpiCapsule
            label="총 이익액 (평균 이익율)"
            value={currentMetrics.profit.toFixed(2)}
            unit="억"
            delta={deltaProfit}
            deltaUnit="억"
            digits={2}
            footnote={`평균 이익율 ${currentMetrics.profitRate.toFixed(1)}%`}
          />
        </div>

        <button
          type="button"
          onClick={handleReset}
          className="flex shrink-0 items-center gap-1.5 rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-bold text-slate-600 shadow-sm transition hover:bg-slate-50 active:scale-95"
        >
          <Icon name="RotateCcw" size={13} />
          도면 리셋
        </button>
      </header>

      {/* ---------- BODY : 도면(좌상) + 대시보드(좌하) + 브랜드목록(우) ---------- */}
      <div className="flex min-h-0 flex-1 gap-3 overflow-hidden p-3">
        {/* 좌: 도면 + Dash Board */}
        <div className="flex min-h-0 min-w-0 flex-[1_1_73%] flex-col gap-3">
          <div className="cad-canvas-bg flex min-h-0 flex-[7] flex-col overflow-hidden rounded-2xl border border-slate-200/90 bg-white shadow-card">
            <div className="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200/80 bg-white/90 px-4 py-2 text-xs font-semibold text-slate-500 backdrop-blur-sm">
              <div className="flex min-w-0 items-center gap-2">
                <span className="flex min-w-0 items-center gap-1.5 font-bold text-slate-700">
                  <span className={`h-2 w-2 shrink-0 rounded-full ${plan ? 'bg-rose-500' : 'bg-emerald-500'}`} />
                  <span className="truncate">{plan ? plan.name : 'LOTTE-JS-B1-ASYMMETRIC.svg'}</span>
                </span>
                <span className="shrink-0 rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-bold text-slate-500">
                  {plan ? plan.kind : 'BUILT-IN'}
                </span>
              </div>

              <div className="flex shrink-0 items-center gap-1.5">
                <input
                  ref={fileRef}
                  type="file"
                  accept=".dxf,.svg,.pdf,.png,.jpg,.jpeg,image/svg+xml,application/pdf,image/png,image/jpeg"
                  onChange={handlePickPlan}
                  className="hidden"
                  aria-label="도면 파일 선택"
                />
                <button
                  type="button"
                  onClick={() => fileRef.current && fileRef.current.click()}
                  className="flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-[11px] font-bold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50 active:scale-95"
                >
                  <Icon name="Upload" size={12} />
                  도면 업로드
                </button>

                <button
                  type="button"
                  onClick={() => setShowZones((v) => !v)}
                  aria-pressed={showZones}
                  className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition active:scale-95 ${
                    showZones
                      ? 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50'
                      : 'border-slate-200 bg-slate-100 text-slate-400 hover:bg-slate-50'
                  }`}
                >
                  <Icon name="Layers" size={12} />
                  구역 표시
                </button>

                {analysis ? (
                  <button
                    type="button"
                    onClick={() => setShowTrace((v) => !v)}
                    aria-pressed={showTrace}
                    className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition active:scale-95 ${
                      showTrace
                        ? 'border-slate-900 bg-slate-900 text-white'
                        : 'border-slate-200 bg-white text-slate-400 hover:bg-slate-50'
                    }`}
                  >
                    <Icon name="Spline" size={12} />
                    선 추적
                  </button>
                ) : null}

                {analysis && analysis.stats && analysis.stats.regions > 0 ? (
                  <button
                    type="button"
                    onClick={() => setShowRegions((v) => !v)}
                    aria-pressed={showRegions}
                    className={`flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-[11px] font-bold transition active:scale-95 ${
                      showRegions
                        ? 'border-rose-500 bg-rose-50 text-rose-700'
                        : 'border-slate-200 bg-white text-slate-400 hover:bg-slate-50'
                    }`}
                  >
                    <Icon name="Frame" size={12} />
                    영역 {analysis.stats.regions}
                  </button>
                ) : null}

                <div className="flex items-center overflow-hidden rounded-lg border border-slate-300 bg-white text-[10.5px] font-bold">
                  <span className="px-1.5 py-1 text-slate-400">면적 연동</span>
                  <button
                    type="button"
                    onClick={() => setAreaMode('efficiency')}
                    aria-pressed={areaMode === 'efficiency'}
                    title="이동 후에도 평효율을 유지하고 매출을 새 평수로 다시 계산합니다"
                    className={`px-1.5 py-1 transition ${
                      areaMode === 'efficiency' ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'
                    }`}
                  >
                    평효율 유지
                  </button>
                  <button
                    type="button"
                    onClick={() => setAreaMode('absolute')}
                    aria-pressed={areaMode === 'absolute'}
                    title="매출은 그대로 두고 평효율만 새 평수로 다시 계산합니다"
                    className={`px-1.5 py-1 transition ${
                      areaMode === 'absolute' ? 'bg-slate-900 text-white' : 'text-slate-500 hover:bg-slate-50'
                    }`}
                  >
                    매출 고정
                  </button>
                </div>

                {plan ? (
                  <button
                    type="button"
                    onClick={handleClearPlan}
                    className="flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-[11px] font-bold text-slate-500 transition hover:bg-slate-50 active:scale-95"
                  >
                    <Icon name="Undo2" size={12} />
                    기본 도면
                  </button>
                ) : null}
              </div>
            </div>

            <div
              className={`relative flex min-h-0 flex-1 items-center justify-center p-2 transition ${
                drawHover ? 'bg-rose-50/50 ring-2 ring-inset ring-rose-300' : ''
              }`}
              onDragOver={(ev) => {
                if (ev.dataTransfer.types.includes('Files')) {
                  ev.preventDefault();
                  ev.dataTransfer.dropEffect = 'copy';
                  setDrawHover(true);
                }
              }}
              onDragLeave={(ev) => {
                if (!ev.currentTarget.contains(ev.relatedTarget)) setDrawHover(false);
              }}
              onDrop={(ev) => {
                const files = ev.dataTransfer.files;
                if (files && files.length) {
                  ev.preventDefault();
                  setDrawHover(false);
                  loadPlanFile(files[0]);
                }
              }}
            >
              <FloorPlan
                rows={rows}
                hovered={hoveredZoneId}
                selectedZoneId={selectedZoneId}
                dropZoneId={dropTargetId}
                dragZoneId={dragZoneId}
                candidateDrag={candidateDrag}
                pulseZone={pulseZone}
                pointerDragEnabled={!editingAny}
                onPointerDragStart={handlePointerDragStart}
                onHover={setHoveredZoneId}
                onLeave={() => setHoveredZoneId(null)}
                onActivate={handleActivate}
                onApplyBrand={handleApplyBrand}
                onSwap={handleSwap}
                onDragStartZone={setDragZoneId}
                onDragEndZone={() => setDragZoneId(null)}
                plan={plan}
                showZones={showZones}
                analysis={analysis}
                showTrace={showTrace}
                showRegions={showRegions}
              />

              {drawHover ? (
                <div className="pointer-events-none absolute inset-2 flex items-center justify-center rounded-xl border-2 border-rose-300 bg-white/70 ring-4 ring-rose-200/60">
                  <span className="text-sm font-black text-rose-600">여기에 놓으면 도면으로 적용됩니다</span>
                </div>
              ) : null}

              {parsing ? (
                <div className="absolute inset-0 z-10 flex flex-col items-center justify-center gap-3 bg-white/80 backdrop-blur-sm">
                  <span className="h-7 w-7 animate-spin rounded-full border-[3px] border-slate-200 border-t-rose-500" />
                  <span className="text-[12px] font-bold text-slate-600">{parsing}</span>
                </div>
              ) : null}

              {parseError ? (
                <div className="absolute inset-x-4 bottom-3 z-10 flex items-start gap-2 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2">
                  <Icon name="AlertCircle" size={14} className="mt-0.5 shrink-0 text-rose-500" />
                  <div className="min-w-0 flex-1">
                    <p className="text-[11.5px] font-bold text-rose-800">도면을 해석하지 못했습니다</p>
                    <p className="mt-0.5 text-[10.5px] leading-relaxed text-rose-600">{parseError}</p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setParseError(null)}
                    aria-label="오류 닫기"
                    className="shrink-0 rounded p-0.5 text-rose-400 transition hover:bg-rose-100 hover:text-rose-700"
                  >
                    <Icon name="X" size={12} stroke={2.6} />
                  </button>
                </div>
              ) : null}
            </div>

            <div className="flex shrink-0 items-center justify-between border-t border-slate-100 px-4 py-1.5 text-[10px] font-semibold text-slate-400">
              <div className="flex items-center gap-3">
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm border border-slate-300 bg-white" />현행</span>
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-amber-400" />개편 필요</span>
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-emerald-500" />신규 교체</span>
              </div>
              <div className="flex items-center gap-3 tabular">
                {analysis && analysis.stats ? (
                  <span className="rounded bg-slate-100 px-1.5 py-0.5 font-bold text-slate-600">
                    {analysis.stats.format} · 선 {analysis.stats.lines || analysis.stats.entities}
                    {analysis.stats.regions ? ` · 영역 ${analysis.stats.regions}` : ''}
                  </span>
                ) : null}
                <span>{rows.length}개 구역 · {currentMetrics.pyeong}평 · 교체 {rows.filter((r) => r.isReplaced).length}건</span>
              </div>
            </div>
          </div>

          <div className="min-h-0 flex-[3]">
            <RankingDashboard
              rows={rows}
              columns={columns}
              limit={rankLimit}
              dir={rankDir}
              selectedZoneId={selectedZoneId}
              onSelect={setSelectedZoneId}
              onCommitValue={handleCommitMetric}
              onHeaderChange={handleColumnChange}
              onHeaderRemove={handleColumnRemove}
              onAddColumn={handleColumnAdd}
              onLimit={setRankLimit}
              onToggleDir={() => setRankDir((d) => (d === 'desc' ? 'asc' : 'desc'))}
              pulseZone={pulseZone}
            />
          </div>
        </div>

        {/* 우: 브랜드 목록 (검색 + 정렬) / 교체 후보 */}
        <div className="flex min-h-0 w-[27%] min-w-[300px] max-w-[400px] shrink-0 flex-col">
          <BrandListPanel
            rows={rows}
            visibleRows={visibleRows}
            query={query}
            onQuery={setQuery}
            sortKey={sortKey}
            onSortKey={setSortKey}
            sortDir={sortDir}
            onToggleDir={() => setSortDir((d) => (d === 'desc' ? 'asc' : 'desc'))}
            selectedZoneId={selectedZoneId}
            onSelect={setSelectedZoneId}
            tab={tab}
            onTab={setTab}
            candidates={CANDIDATES}
            selectedCandidate={selectedCandidate}
            usedCounts={usedCounts}
            onSelectCandidate={setSelectedCandidate}
            onDragStart={setDragZoneId}
            onDragEndZone={() => setDragZoneId(null)}
            onCandidateDragStart={() => setCandidateDrag(true)}
            onCandidateDragEnd={() => setCandidateDrag(false)}
          />
        </div>
      </div>

      {toast ? (
        <div className="pointer-events-none fixed bottom-6 left-1/2 z-50 flex -translate-x-1/2 items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 shadow-lift">
          <span className="flex h-4 w-4 items-center justify-center rounded-full bg-emerald-500 text-white">
            <Icon name="Check" size={10} stroke={3} />
          </span>
          <span className="text-[12px] font-semibold tracking-tight text-slate-700">{toast}</span>
        </div>
      ) : null}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
