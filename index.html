<script>
/* ============================================================
 * PlanParser — 도면 파일(DXF / SVG / PDF / PNG / JPG)을 폴리라인으로 해석
 * 외부 CAD 엔진 없이 브라우저 안에서만 동작한다.
 * ============================================================ */
window.PlanParser = (function () {
  'use strict';

  var num = function (v) { var n = Number(String(v).trim()); return isFinite(n) ? n : 0; };
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

  /* ---------------- 공통 유틸 ---------------- */

  function bboxOf(polys) {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < polys.length; i++) {
      var pts = polys[i].pts;
      for (var j = 0; j < pts.length; j++) {
        var x = pts[j][0], y = pts[j][1];
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    if (!isFinite(minX)) return { x: 0, y: 0, w: 1, h: 1 };
    return { x: minX, y: minY, w: Math.max(maxX - minX, 1e-6), h: Math.max(maxY - minY, 1e-6) };
  }

  /* 전체 점의 0.5~99.5 퍼센타일로 핵심 영역만 잡는다.
   * CAD 도면에는 원점에서 멀리 떨어진 치수선·3D면·잔여 정점이 섞여 들어온다.
   * 전체 bbox 를 쓰면 그 소수가 도면을 29~156배 부풀려 실제 내용이 작은 덩어리로 압축된다.
   * 실측: out.dxf 전체 bbox 331,580×975,700 vs 핵심 11,346×6,243 (29~156배). */
  function robustBBox(polys) {
    var xs = [], ys = [];
    for (var i = 0; i < polys.length; i++) {
      var pts = polys[i].pts || [];
      for (var j = 0; j < pts.length; j++) {
        var x = pts[j][0], y = pts[j][1];
        if (isFinite(x) && isFinite(y)) { xs.push(x); ys.push(y); }
      }
    }
    var raw = bboxOf(polys);
    if (xs.length < 200) return raw;
    xs.sort(function (a, b) { return a - b; });
    ys.sort(function (a, b) { return a - b; });
    var pick = function (arr, q) {
      var k = (arr.length - 1) * q;
      var f = Math.floor(k), c = Math.ceil(k);
      return f === c ? arr[f] : arr[f] * (c - k) + arr[c] * (k - f);
    };
    var x0 = pick(xs, 0.005), x1 = pick(xs, 0.995);
    var y0 = pick(ys, 0.005), y1 = pick(ys, 0.995);
    var w = x1 - x0, h = y1 - y0;
    // 트리밍이 실제 내용을 잘라낼 만큼 공격적이면 원본을 쓴다
    if (!(w > 0) || !(h > 0)) return raw;
    if (w < raw.w * 0.02 || h < raw.h * 0.02) return raw;
    // 가장자리 여백 8% — 핵심 영역에 걸친 선이 잘려 보이지 않게
    var mx = w * 0.08, my = h * 0.08;
    return { x: x0 - mx, y: y0 - my, w: w + mx * 2, h: h + my * 2 };
  }

  /* 파싱 결과가 그릴 만한지 판정한다. 여기서 막지 않으면 화면이 빈 채로 남는다. */
  // DWG 원본은 요소가 수만 개까지 나온다. 5만 개까지 받는다.
  // 점 상한은 요소당 평균 12점을 기준으로 잡되, 호·스플라인으로 샘플링이 늘어난 경우까지 덮는다.
  var MAX_POLYS = 50000;
  var MAX_POINTS = 1200000;
  function validateGeometry(polys, rawBBox) {
    if (!polys || !polys.length) return { ok: false, reason: '도면에서 그릴 수 있는 선을 찾지 못했습니다' };
    if (polys.length > MAX_POLYS) {
      return { ok: false, reason: '도면 요소가 너무 많습니다 (' + polys.length.toLocaleString() + '개, 상한 ' + MAX_POLYS.toLocaleString() + '개)' };
    }
    var pts = 0;
    for (var i = 0; i < polys.length; i++) pts += (polys[i].pts || []).length;
    if (pts > MAX_POINTS) {
      return { ok: false, reason: '도면 점이 너무 많습니다 (' + pts.toLocaleString() + '개, 상한 ' + MAX_POINTS.toLocaleString() + '개)' };
    }
    // 좌표 자체를 먼저 검사한다 — bboxOf 는 NaN 을 만나면 (0,0,1,1) 을 돌려줘 통과해 버린다.
    var realMinX = Infinity, realMinY = Infinity, realMaxX = -Infinity, realMaxY = -Infinity;
    for (var vi = 0; vi < polys.length; vi++) {
      var vp = polys[vi].pts || [];
      for (var vj = 0; vj < vp.length; vj++) {
        var vx = vp[vj][0], vy = vp[vj][1];
        if (!isFinite(vx) || !isFinite(vy)) {
          return { ok: false, reason: '도면 좌표에 유효하지 않은 값이 있습니다' };
        }
        if (vx < realMinX) realMinX = vx; if (vx > realMaxX) realMaxX = vx;
        if (vy < realMinY) realMinY = vy; if (vy > realMaxY) realMaxY = vy;
      }
    }
    var realW = realMaxX - realMinX, realH = realMaxY - realMinY;
    // 전 점이 같은 자리에 있으면 그릴 도형이 아니다 (bboxOf 가 1e-6 으로 눌러 숨긴다)
    if (!(realW > 1e-3) || !(realH > 1e-3)) {
      return { ok: false, reason: '도면 크기가 0입니다 — 좌표가 한 점에 모여 있습니다' };
    }
    var b = { x: realMinX, y: realMinY, w: realW, h: realH };
    var aspect = b.w / b.h;
    if (aspect > 50) return { ok: false, reason: '도면 비율이 비정상입니다 (가로/세로 ' + aspect.toFixed(1) + ')' };
    if (aspect < 0.02) return { ok: false, reason: '도면 비율이 비정상입니다 (가로/세로 ' + aspect.toFixed(2) + ')' };
    return { ok: true, bbox: b, points: pts };
  }

  /** 신발끈 공식 — 다각형 면적 */
  function polyArea(pts) {
    var a = 0;
    for (var i = 0, n = pts.length; i < n; i++) {
      var p = pts[i], q = pts[(i + 1) % n];
      a += p[0] * q[1] - q[0] * p[1];
    }
    return Math.abs(a) / 2;
  }

  /** 두 사각형의 IoU — 같은 구획이 두 번 잡혔는지 판단 */
  function bboxIoU(a, b) {
    var x0 = Math.max(a.x, b.x), y0 = Math.max(a.y, b.y);
    var x1 = Math.min(a.x + a.w, b.x + b.w), y1 = Math.min(a.y + a.h, b.y + b.h);
    var iw = Math.max(0, x1 - x0), ih = Math.max(0, y1 - y0);
    var inter = iw * ih;
    var union = a.w * a.h + b.w * b.h - inter;
    return union > 0 ? inter / union : 0;
  }

  /** 닫힌 폴리라인 집합 → 구획 영역 후보 (면적·바운딩박스 부착) */
  function regionsFromPolys(polys) {
    var raw = [];
    for (var i = 0; i < polys.length; i++) {
      var p = polys[i];
      if (!p || !p.closed || !p.pts || p.pts.length < 3) continue;
      var a = polyArea(p.pts);
      if (!(a > 0)) continue;
      var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (var k = 0; k < p.pts.length; k++) {
        var x = p.pts[k][0], y = p.pts[k][1];
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
      raw.push({
        pts: p.pts,
        area: a,
        bbox: { x: minX, y: minY, w: maxX - minX, h: maxY - minY },
        closed: true,
      });
    }
    raw.sort(function (m, n) { return n.area - m.area; });

    // 같은 구획을 채움용/테두리용으로 두 번 그린 도면이 흔하다.
    // 바운딩박스가 사실상 같고 면적도 비슷하면 하나만 남긴다.
    //
    // 예전에는 남은 후보 전부와 비교했다(O(n^2)). 닫힌 도형이 8,000개면 12.7초,
    // 5만 개면 사실상 멈춘다. 중복은 바운딩박스가 겹쳐야만 성립하므로
    // 공간 격자로 이웃 칸만 본다. 결과 집합과 순서는 이전과 같다.
    var out = [];
    var gridCell = 1;
    if (raw.length > 1) {
      var gx0 = Infinity, gy0 = Infinity, gx1 = -Infinity, gy1 = -Infinity;
      for (var gi = 0; gi < raw.length; gi++) {
        var gb = raw[gi].bbox;
        if (gb.x < gx0) gx0 = gb.x;
        if (gb.y < gy0) gy0 = gb.y;
        if (gb.x + gb.w > gx1) gx1 = gb.x + gb.w;
        if (gb.y + gb.h > gy1) gy1 = gb.y + gb.h;
      }
      var gArea = Math.max(1e-6, (gx1 - gx0) * (gy1 - gy0));
      gridCell = Math.max(1e-6, Math.sqrt(gArea / raw.length));
    }
    var buckets = {};
    var MAX_CELLS = 256;
    for (var r = 0; r < raw.length; r++) {
      var cand = raw[r];
      var cb = cand.bbox;
      var cx0 = Math.floor(cb.x / gridCell), cy0 = Math.floor(cb.y / gridCell);
      var cx1 = Math.floor((cb.x + cb.w) / gridCell), cy1 = Math.floor((cb.y + cb.h) / gridCell);
      var dup = false;

      if ((cx1 - cx0 + 1) * (cy1 - cy0 + 1) > MAX_CELLS) {
        // 격자를 수백 칸 덮는 큰 도형 — 전체와 비교하되 면적 창으로 좁힌다
        for (var oi = 0; oi < out.length; oi++) {
          var kp = out[oi];
          var rt = cand.area / (kp.area || 1);
          if (!(rt > 0.8 && rt < 1.25)) continue;
          if (bboxIoU(cb, kp.bbox) < 0.82) continue;
          dup = true; break;
        }
      } else {
        var seen = {};
        for (var qx = cx0; qx <= cx1 && !dup; qx++) {
          for (var qy = cy0; qy <= cy1 && !dup; qy++) {
            var bk = buckets[qx + ':' + qy];
            if (!bk) continue;
            for (var bi = 0; bi < bk.length; bi++) {
              var ki = bk[bi];
              if (seen[ki]) continue;
              seen[ki] = 1;
              var kept = out[ki];
              if (bboxIoU(cb, kept.bbox) < 0.82) continue;
              var ratio = cand.area / (kept.area || 1);
              if (ratio > 0.8 && ratio < 1.25) { dup = true; break; }
            }
          }
        }
      }
      if (dup) continue;

      var newIdx = out.length;
      out.push(cand);
      if ((cx1 - cx0 + 1) * (cy1 - cy0 + 1) <= MAX_CELLS) {
        for (var ix = cx0; ix <= cx1; ix++) {
          for (var iy = cy0; iy <= cy1; iy++) {
            var key2 = ix + ':' + iy;
            if (!buckets[key2]) buckets[key2] = [];
            buckets[key2].push(newIdx);
          }
        }
      }
    }
    return out;
  }

  /** 폴리라인 집합을 target 박스에 맞춰 정규화. flipY 는 DXF(수학좌표) 대응. */
  /** 퍼센타일 트림만 적용한 콘텐츠 상자 (여백 없음) */
  function contentBBox(polys) {
    var xs = [], ys = [];
    for (var i = 0; i < polys.length; i++) {
      var pts = polys[i].pts || [];
      for (var j = 0; j < pts.length; j++) {
        var x = pts[j][0], y = pts[j][1];
        if (isFinite(x) && isFinite(y)) { xs.push(x); ys.push(y); }
      }
    }
    var raw = bboxOf(polys);
    if (xs.length < 200) return raw;
    xs.sort(function (a, b) { return a - b; });
    ys.sort(function (a, b) { return a - b; });
    var pick = function (arr, q) {
      var k = (arr.length - 1) * q;
      var f = Math.floor(k), c = Math.ceil(k);
      return f === c ? arr[f] : arr[f] * (c - k) + arr[c] * (k - f);
    };
    var w = pick(xs, 0.995) - pick(xs, 0.005);
    var h = pick(ys, 0.995) - pick(ys, 0.005);
    if (!(w > 0) || !(h > 0)) return raw;
    if (w < raw.w * 0.02 || h < raw.h * 0.02) return raw;
    return { x: pick(xs, 0.005), y: pick(ys, 0.005), w: w, h: h };
  }

  /**
   * 비율 패딩 핏 — 콘텐츠를 뷰어의 (1 - 2*padFrac) 만큼 채우고 중앙에 놓는다.
   * robustBBox 의 안전 여백(8%)은 바깥에 남겨 두고, 스케일은 콘텐츠 상자로 잡는다.
   * 그래야 패딩이 두 번 먹어 도면이 작아지는 일이 없다.
   * 마지막에 안전 상자가 뷰어를 넘지 않도록 스케일을 한 번 더 조인다.
   */
  function fitPadded(polys, tw, th, padFrac, flipY) {
    var safe = robustBBox(polys);
    var content = contentBBox(polys);
    if (!(content.w > 0) || !(content.h > 0)) content = safe;
    // 퍼센타일 트림은 이상치를 걷어내는 용도다. 그런데 실제 도면은 테두리·표제란이
    // 극단부에 있어서 트림이 도면의 10% 넘게 잘라낸다. 그 상태로 스케일을 잡으면
    // 패딩이 사라지고 도면이 뷰어 끝에 붙는다(백화점 도면 실측 99.7%).

  /* ============================================================

  /* ============================================================

  /** 세선 이미지를 폴리라인으로 추적 */

    return regions;
  }

  function traceRaster(imgData, opts) {
    var o = opts || {};
    var W = imgData.width, H = imgData.height;
    var data = imgData.data;

    var gray = new Uint8Array(W * H);
    for (var i = 0, j = 0; i < data.length; i += 4, j++) {
      var a = data[i + 3] / 255;
      var r = data[i] * a + 255 * (1 - a);
      var g = data[i + 1] * a + 255 * (1 - a);
      var b = data[i + 2] * a + 255 * (1 - a);
      gray[j] = (0.299 * r + 0.587 * g + 0.114 * b) | 0;
    }

    var thr = otsu(gray);
    var ink = new Uint8Array(W * H);
    var inkCount = 0;
    for (var k = 0; k < gray.length; k++) { var v = gray[k] < thr ? 1 : 0; ink[k] = v; inkCount += v; }
    var inverted = false;
    if (inkCount > W * H * 0.5) { inverted = true; for (var m = 0; m < ink.length; m++) ink[m] ^= 1; }

    var skeleton = thin(ink, W, H);
    var rawLines = traceSkeleton(skeleton, W, H);

    var polys = [];
    var totalPts = 0;
    for (var n = 0; n < rawLines.length; n++) {
      var line = rawLines[n];
      if (line.length < 6) continue;
      var simple = rdp(line, 1.15);
      if (simple.length < 2) continue;
      polys.push({ pts: simple, closed: false, layer: 'trace' });
      totalPts += simple.length;
      if (polys.length > 6000) break;
    }

    var minArea = Math.max(400, W * H * 0.0025);
    var regionsPx = polygonize(ink, W, H, minArea);

    // 픽셀 → viewBox 좌표 (이미지 letterbox 정렬)
    var tw = o.tw || 1000, th = o.th || 680, pad = o.pad == null ? 8 : o.pad;
    var s = Math.min((tw - pad * 2) / W, (th - pad * 2) / H);
    var rect = { x: (tw - W * s) / 2, y: (th - H * s) / 2, w: W * s, h: H * s };
    var mapPt = function (p) { return [rect.x + p[0] * s, rect.y + p[1] * s]; };

    var mappedPolys = polys.map(function (p) { return { pts: p.pts.map(mapPt), closed: p.closed, layer: p.layer }; });
    var mappedRegions = regionsPx.map(function (r) {
      return { pts: r.pts.map(mapPt), area: r.area, bbox: r.bbox, closed: true };
    });

    return {
      polys: mappedPolys,
      regions: mappedRegions,
      rect: rect,
      stats: {
        format: 'RASTER',
        entities: rawLines.length,
        lines: polys.length,
        points: totalPts,
        threshold: thr,
        inverted: inverted,
        regions: mappedRegions.length,
        extents: { w: W, h: H },
        byType: { skeletonSegments: polys.length },
      },
    };
  }

  /* ============================================================
   * 색 채움 기반 구획 검출 — 백엔드 OpenCV 로직의 브라우저 이식
   *
   * 배포본(정적 호스팅)에는 파이썬 백엔드가 없다. 그래서 색 마스크 → 형태학적
   * OPEN → 연결요소 분리 → 외곽선 추적 → 다각형 단순화 → 중복 제거를
   * 브라우저에서 그대로 수행한다. 백엔드와 같은 임계값을 쓴다.
   * ============================================================ */

  // 전체 면적 대비 구획 최소 면적. 0.02% 는 작은 매장 칸까지 잡고,
  // 아이콘·글자 조각은 색상 버킷 단계에서 이미 걸러진다.
  var AUTO_MIN_AREA_RATIO = 0.0008;
  var AUTO_MAX_AREA_RATIO = 0.85;
  var AUTO_MAX_ZONES = 80;
  // 지시서 Step 1-3: 0.02 → 0.005 로 정밀도 상향 (곡선·미세 꺾임 보존)
  var AUTO_APPROX_EPS = 0.005;
  var AUTO_APPROX_EPS_FLOOR = 0.8;
  var AUTO_MAX_POINTS = 48;
  // 색상 버킷: Hue 를 30도 단위로 나누고, 점유율 4% 이상 버킷만 쓴다
  var AUTO_HUE_BUCKETS = 12;
  var AUTO_HUE_MIN_SHARE = 0.04;
  var AUTO_CELL_MIN_SIDE = 10;

  // 8-이웃 오프셋 (동 → 시계방향)
  var NB_X = [1, 1, 0, -1, -1, -1, 0, 1];
  var NB_Y = [0, 1, 1, 1, 0, -1, -1, -1];

  /** 채도·명도 기준 색 채움 마스크. 배경 흰색과 진회색 글자를 뺀다. */
  /** RGB → Hue(0~360). 무채색이면 -1. */
  function hueOf(r, g, b) {
    var mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
    var mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
    var d = mx - mn;
    if (d === 0) return -1;
    var hh;
    if (mx === r) hh = 60 * (((g - b) / d) % 6);
    else if (mx === g) hh = 60 * ((b - r) / d + 2);
    else hh = 60 * ((r - g) / d + 4);
    if (hh < 0) hh += 360;
    return hh;
  }

  /**
   * 채색 픽셀을 Hue 버킷으로 나눈다.
   *
   * 채도만으로 하나의 마스크를 만들면 같은 색이 맞닿은 이웃 칸이 한 덩어리로
   * 합쳐진다. 색상 30도 단위로 쪼개면 주황 칸과 분홍 칸이 서로 붙지 않는다.
   * 점유율이 낮은 버킷은 아이콘·장식이라 버린다.
   */
  function colorBuckets(imgData) {
    var W = imgData.width, H = imgData.height, d = imgData.data;
    var n = W * H;
    var hue = new Int16Array(n);
    var hist = new Float64Array(AUTO_HUE_BUCKETS);
    var painted = 0;
    for (var i = 0, j = 0; j < n; i += 4, j++) {
      var a = d[i + 3] / 255;
      var r = d[i] * a + 255 * (1 - a);
      var g = d[i + 1] * a + 255 * (1 - a);
      var b = d[i + 2] * a + 255 * (1 - a);
      var mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
      var mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
      var sat = mx <= 0 ? 0 : ((mx - mn) / mx) * 255;
      if (sat > 20 && mx > 120) {
        var hh = hueOf(r, g, b);
        var bi = hh < 0 ? -1 : Math.floor(hh / (360 / AUTO_HUE_BUCKETS)) % AUTO_HUE_BUCKETS;
        hue[j] = bi;
        if (bi >= 0) { hist[bi] += 1; painted += 1; }
      } else {
        hue[j] = -1;
      }
    }
    var total = painted || 1;
    var active = [];
    for (var k = 0; k < AUTO_HUE_BUCKETS; k++) {
      if (hist[k] / total >= AUTO_HUE_MIN_SHARE) active.push(k);
    }
    return { hue: hue, active: active, painted: painted };
  }



  /** 3x3 사각 커널 침식/팽창. OpenCV 경계 처리를 따라 바깥은 침식하지 않는다. */
  function morph3(mask, W, H, dilate) {
    var out = new Uint8Array(W * H);
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var hit = dilate ? 0 : 1;
        for (var dy = -1; dy <= 1; dy++) {
          var yy = y + dy;
          if (yy < 0 || yy >= H) { if (!dilate) { continue; } continue; }
          for (var dx = -1; dx <= 1; dx++) {
            var xx = x + dx;
            if (xx < 0 || xx >= W) continue;
            var v = mask[yy * W + xx];
            if (dilate) { if (v) { hit = 1; } } else if (!v) { hit = 0; }
          }
        }
        out[y * W + x] = hit;
      }
    }
    return out;
  }

  /** 8-연결 요소 분리. 레이블 배열과 각 요소의 면적·바운딩박스를 돌려준다. */
  function componentLabels(mask, W, H) {
    var labels = new Int32Array(W * H);
    var stack = new Int32Array(W * H);
    var comps = [];
    var next = 0;
    for (var i = 0; i < W * H; i++) {
      if (!mask[i] || labels[i]) continue;
      next += 1;
      var sp = 0;
      stack[sp++] = i;
      labels[i] = next;
      var count = 0, x0 = W, y0 = H, x1 = -1, y1 = -1;
      while (sp) {
        var p = stack[--sp];
        var px = p % W, py = (p - px) / W;
        count += 1;
        if (px < x0) x0 = px;
        if (px > x1) x1 = px;
        if (py < y0) y0 = py;
        if (py > y1) y1 = py;
        for (var k = 0; k < 8; k++) {
          var qx = px + NB_X[k], qy = py + NB_Y[k];
          if (qx < 0 || qx >= W || qy < 0 || qy >= H) continue;
          var q = qy * W + qx;
          if (mask[q] && !labels[q]) { labels[q] = next; stack[sp++] = q; }
        }
      }
      comps.push({ label: next, area: count, bbox: { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 } });
    }
    return { labels: labels, comps: comps };
  }

  /** 무어 이웃 추적 — 요소 하나의 바깥 외곽선을 시계방향으로 따라간다. */
  function traceOuter(bin, bw, bh, sx, sy) {
    var pts = [];
    var cx = sx, cy = sy;
    var bx = sx - 1, by = sy;
    var startCx = sx, startCy = sy, startBx = bx, startBy = by;
    var guard = bw * bh * 8 + 16;
    while (guard-- > 0) {
      pts.push([cx, cy]);
      var dxb = bx - cx, dyb = by - cy, di = -1;
      for (var k = 0; k < 8; k++) if (NB_X[k] === dxb && NB_Y[k] === dyb) { di = k; break; }
      if (di < 0) di = 4;
      var moved = false;
      for (var s = 1; s <= 8; s++) {
        var d = (di + s) % 8;
        var nx = cx + NB_X[d], ny = cy + NB_Y[d];
        if (nx < 0 || nx >= bw || ny < 0 || ny >= bh) continue;
        if (!bin[ny * bw + nx]) continue;
        var pd = (d + 7) % 8;
        bx = cx + NB_X[pd];
        by = cy + NB_Y[pd];
        cx = nx; cy = ny;
        moved = true;
        break;
      }
      if (!moved) break;
      if (cx === startCx && cy === startCy && bx === startBx && by === startBy) break;
    }
    return pts;
  }

  function perimeterOf(pts) {
    var p = 0;
    for (var i = 0, n = pts.length; i < n; i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      p += Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    return p;
  }

  /** 두 바운딩박스의 IoU */
  function boxIoU(a, b) {
    var x0 = Math.max(a.x, b.x), y0 = Math.max(a.y, b.y);
    var x1 = Math.min(a.x + a.w, b.x + b.w), y1 = Math.min(a.y + a.h, b.y + b.h);
    var iw = Math.max(0, x1 - x0), ih = Math.max(0, y1 - y0);
    var inter = iw * ih;
    var union = a.w * a.h + b.w * b.h - inter;
    return union > 0 ? inter / union : 0;
  }

  /** 두 바운딩박스 사이 간격(px). 겹치면 0. */
  function bboxGap(a, b) {
    var dx = Math.max(0, Math.max(a.x, b.x) - Math.min(a.x + a.w, b.x + b.w));
    var dy = Math.max(0, Math.max(a.y, b.y) - Math.min(a.y + a.h, b.y + b.h));
    return Math.max(dx, dy);
  }

  /**
   * 컴포넌트 내부의 구멍만 메운다.
   *
   * 지시서는 15x15 CLOSE x2 를 전역으로 걸라고 하지만, 실측해보면 인접 매장이
   * 전부 한 덩어리로 붙어 구획이 24개에서 1개로 무너진다. 대신 컴포넌트 경계는
   * 건드리지 않고 내부에 갇힌 빈 칸(브랜드명·기호로 뚫린 구멍)만 채운다.
   */
  function fillComponentHoles(mask, W, H, found) {
    var out = mask;
    var labels = found.labels;
    for (var c = 0; c < found.comps.length; c++) {
      var comp = found.comps[c];
      var box = comp.bbox;
      var pad = 2;
      var x0 = Math.max(0, box.x - pad), y0 = Math.max(0, box.y - pad);
      var x1 = Math.min(W, box.x + box.w + pad), y1 = Math.min(H, box.y + box.h + pad);
      var bw = x1 - x0, bh = y1 - y0;
      if (bw < 3 || bh < 3) continue;

      // 1px 0 테두리 → 외곽이 새지 않고 항상 배경에서 시작한다
      var pw = bw + 2, ph = bh + 2;
      var sub = new Uint8Array(pw * ph);
      for (var y = 0; y < bh; y++) {
        var srow = (y0 + y) * W;
        var drow = (y + 1) * pw;
        for (var x = 0; x < bw; x++) {
          if (labels[srow + (x0 + x)] === comp.label) sub[drow + (x + 1)] = 1;
        }
      }

      var seen = new Uint8Array(pw * ph);
      var stack = new Int32Array(pw * ph);
      var sp = 0;
      stack[sp++] = 0;
      seen[0] = 1;
      while (sp) {
        var p = stack[--sp];
        var px = p % pw, py = (p - px) / pw;
        for (var k = 0; k < 8; k++) {
          var qx = px + NB_X[k], qy = py + NB_Y[k];
          if (qx < 0 || qx >= pw || qy < 0 || qy >= ph) continue;
          var q = qy * pw + qx;
          if (seen[q] || sub[q]) continue;
          seen[q] = 1;
          stack[sp++] = q;
        }
      }

      // 배경에서 닿지 못한 빈 칸 = 구멍
      for (var yy = 0; yy < bh; yy++) {
        for (var xx = 0; xx < bw; xx++) {
          var si = (yy + 1) * pw + (xx + 1);
          if (!sub[si] && !seen[si]) out[(y0 + yy) * W + (x0 + xx)] = 1;
        }
      }
    }
    return out;
  }

  /** 텍스트·기호로 끊긴 작은 파편을 가장 가까운 큰 구획에 흡수시킨다. */


  /**
   * ImageData → 구획 JSON.
   * 백엔드 /api/upload-floorplan 응답과 같은 모양으로 돌려준다.
   */
  /** 마스크 하나 → 구획 목록 (외곽선 추적 + 다각형 단순화) */
  function zonesFromMask(mask, W, H, imgArea) {
    var found = componentLabels(mask, W, H);
    var labels = found.labels;
    var minArea = imgArea * AUTO_MIN_AREA_RATIO;
    var maxArea = imgArea * AUTO_MAX_AREA_RATIO;
    var minSide = AUTO_CELL_MIN_SIDE;
    var zones = [];

    for (var i = 0; i < found.comps.length; i++) {
      var comp = found.comps[i];
      var box = comp.bbox;
      if (comp.area < minArea || comp.area > maxArea) continue;
      if (box.w < minSide || box.h < minSide) continue;

      // 요소만 잘라낸 작은 이진 이미지에서 외곽선을 따라간다
      var bw = box.w + 2, bh = box.h + 2;
      var bin = new Uint8Array(bw * bh);
      for (var y = 0; y < box.h; y++) {
        var srow = (box.y + y) * W + box.x;
        var drow = (y + 1) * bw + 1;
        for (var x = 0; x < box.w; x++) {
          if (labels[srow + x] === comp.label) bin[drow + x] = 1;
        }
      }

      var sx = -1, sy = -1;
      for (var yy = 0; yy < bh && sy < 0; yy++) {
        for (var xx = 0; xx < bw; xx++) {
          if (bin[yy * bw + xx]) { sx = xx; sy = yy; break; }
        }
      }
      if (sx < 0) continue;

      var outline = traceOuter(bin, bw, bh, sx, sy);
      if (outline.length < 3) continue;

      var per = perimeterOf(outline);
      var eps = Math.max(AUTO_APPROX_EPS_FLOOR, AUTO_APPROX_EPS * per);
      var simple = rdp(outline, eps);
      var relax = 1;
      while (simple.length > AUTO_MAX_POINTS && relax < 8) {
        relax += 1;
        simple = rdp(outline, eps * relax);
      }
      if (simple.length < 3) continue;

      // 서브이미지 좌표 → 원본 픽셀 좌표
      var ox = box.x - 1, oy = box.y - 1;
      var pts = simple.map(function (p) { return [p[0] + ox, p[1] + oy]; });
      if (!(polyArea(pts) > 0)) continue;
      zones.push({ pts: pts, area: comp.area, bbox: box });
    }
    return zones;
  }

  /**
   * ImageData → 구획 JSON.
   * 백엔드 /api/upload-floorplan 응답과 같은 모양으로 돌려준다.
   */
  function detectRasterZones(imgData) {
    var W = imgData.width, H = imgData.height;
    var imgArea = W * H;
    var n = W * H;
    var cb = colorBuckets(imgData);

    var zones = [];
    for (var b = 0; b < cb.active.length; b++) {
      var bucket = cb.active[b];
      var m = new Uint8Array(n);
      var count = 0;
      for (var p = 0; p < n; p++) {
        if (cb.hue[p] === bucket) { m[p] = 1; count += 1; }
      }
      if (!count) continue;

      m = morph3(m, W, H, false); // erode
      m = morph3(m, W, H, true);  // dilate
      m = fillComponentHoles(m, W, H, componentLabels(m, W, H));

      var part = zonesFromMask(m, W, H, imgArea);
      for (var q = 0; q < part.length; q++) zones.push(part[q]);
    }

    // 같은 구획이 두 번 잡히면 하나만 남긴다
    zones.sort(function (a, b2) { return b2.area - a.area; });
    var kept = [];
    for (var z = 0; z < zones.length; z++) {
      var dup = false;
      for (var o = 0; o < kept.length; o++) {
        if (boxIoU(zones[z].bbox, kept[o].bbox) >= 0.85) { dup = true; break; }
      }
      if (!dup) kept.push(zones[z]);
    }

    // 위→아래, 좌→우 순으로 번호를 매긴다
    kept.sort(function (a, b2) {
      var ra = Math.floor(a.bbox.y / 24), rb = Math.floor(b2.bbox.y / 24);
      return ra !== rb ? ra - rb : a.bbox.x - b2.bbox.x;
    });
    kept = kept.slice(0, AUTO_MAX_ZONES);

    return {
      imageWidth: W,
      imageHeight: H,
      engine: 'fill',
      zoneCount: kept.length,
      zones: kept.map(function (zone, index) {
        return {
          zoneId: 'AUTO_Z' + (index + 1 < 10 ? '0' : '') + (index + 1),
          polygonPoints: zone.pts.map(function (p) { return [Math.round(p[0]), Math.round(p[1])]; }),
          estimatedArea: Math.round(zone.area),
          bbox: [zone.bbox.x, zone.bbox.y, zone.bbox.w, zone.bbox.h],
        };
      }),
    };
  }


  return {
    parseDxf: parseDxf,
    validateGeometry: validateGeometry,
    robustBBox: robustBBox,
    svgToPolys: svgToPolys,
    regionsFromPolys: regionsFromPolys,
    polyArea: polyArea,
    traceRaster: traceRaster,
    detectRasterZones: detectRasterZones,
    toPathData: toPathData,
    bboxOf: bboxOf,
    fit: fit,
    fitPadded: fitPadded,
    dropRemoteClusters: dropRemoteClusters,
    contentBBox: contentBBox,
    rdp: rdp,
  };
})();

</script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback, useEffect, useRef } = React;

/* ================================================================
 * 1. DATA — 잠실점 B1 비정형 매장 6구역 (면적 합계 200평)
 *    기준 지표: 총매출 30.0억 · 평균 평효율 15,020천원/평 · 수수료 5.15억 (17.1%)
 * ================================================================ */

const VIEWBOX = { w: 1000, h: 680 };

/* DWG 는 DXF 처럼 텍스트가 아니라 압축된 바이너리 폐쇄 포맷이라 브라우저가 바로 못 읽는다.
   libredwg(WASM)로 DWG→DXF 변환한 뒤 기존 DXF 파서에 넘기는 방식으로 지원한다.
   wasm 이 7.8MB 라 초기 로딩을 막지 않도록, 첫 DWG 업로드 시점에만 CDN에서 받는다. */
const LIBREDWG_CDN = 'https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@0.9.0/dist/libredwg-web.js';
let dwgLibPromise = null;
function loadDwgLib() {
  if (!dwgLibPromise) {
    dwgLibPromise = import(LIBREDWG_CDN)
      .then((mod) => mod.LibreDwg.create())
      .catch(() => {
        dwgLibPromise = null;
        throw new Error('DWG 해석 모듈을 불러오지 못했습니다 — 네트워크를 확인하고 다시 시도해 주세요');
      });
  }
  return dwgLibPromise;
}

/* ================================================================
 * 백데이터(엑셀·CSV) 업로드
 * 이 앱은 서버도 DB도 없이 단일 HTML 로 돈다. 매출·평수 같은 값은
 * ZONES_BASE 상수에 들어 있고, 업로드한 표는 화면 상태로만 반영된다.
 * 즉 '업로드 = 상수 대신 표를 그 세션의 데이터로 쓰는 것'이다.
 * ================================================================ */
const XLSX_CDN = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
let xlsxLibPromise = null;
function loadXlsxLib() {
  if (typeof window !== 'undefined' && window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxLibPromise) {
    xlsxLibPromise = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = XLSX_CDN;
      el.async = true;
      el.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('엑셀 모듈을 초기화하지 못했습니다')));
      el.onerror = () => reject(new Error('엑셀 모듈을 불러오지 못했습니다 — 네트워크를 확인해 주세요'));
      document.head.appendChild(el);
    }).catch((err) => { xlsxLibPromise = null; throw err; });
  }
  return xlsxLibPromise;
}

/** 표 헤더 별칭 — 긴 별칭을 먼저 맞춰 '전년매출'이 '매출'로 잡히지 않게 한다 */
const DATA_COLUMNS = [
  { key: 'zoneId', aliases: ['구역id', '구역코드', 'zoneid', 'zone', '구역'] },
  { key: 'brand', aliases: ['브랜드명', '입점브랜드', 'brand', '브랜드'] },
  { key: 'category', aliases: ['카테고리', '업종', 'category'] },
  { key: 'area', aliases: ['평수', '면적', 'area', '평'] },
  { key: 'salesPrev', aliases: ['전년매출', '작년매출', 'salesprev'] },
  { key: 'salesCurr', aliases: ['금년매출', '월매출', 'salescurr', '매출', 'sales'] },
  { key: 'efficiency', aliases: ['평당효율', '평효율', 'efficiency'] },
  { key: 'commissionRate', aliases: ['수수료율', '수수료', 'commissionrate', 'commission'] },
  { key: 'profitRate', aliases: ['이익률', '이익율', 'profitrate'] },
];

/** 헤더 괄호 안 단위를 배율로 — '매출(억)' → 1e8 */
function dataHeaderUnit(h) {
  const t = String(h == null ? '' : h);
  if (/억/.test(t)) return 1e8;
  if (/만\s*원|만\)/.test(t)) return 1e4;
  if (/천\s*원/.test(t)) return 1e3;
  return null;
}

function dataNum(v) {
  if (v == null || v === '') return NaN;
  if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
  const t = String(v).replace(/[,\s₩원%]/g, '');
  if (t === '' || t === '-') return NaN;
  const n = Number(t);
  return Number.isFinite(n) ? n : NaN;
}

/** 헤더 행 → { 열키: 인덱스 }, { 열키: 단위배율 } */
function mapDataColumns(headerRow) {
  const pairs = [];
  DATA_COLUMNS.forEach((col) => col.aliases.forEach((a) => pairs.push([col.key, a])));
  pairs.sort((x, y) => y[1].length - x[1].length);
  const map = {};
  const units = {};
  headerRow.forEach((h, i) => {
    const raw = String(h == null ? '' : h);
    const bare = raw.replace(/\s+/g, '').replace(/[()[\]{}]/g, '').toLowerCase();
    if (!bare) return;
    for (let k = 0; k < pairs.length; k += 1) {
      const key = pairs[k][0], alias = pairs[k][1];
      if (map[key] != null) continue;
      if (bare === alias || (alias.length > 1 && bare.indexOf(alias) === 0)) {
        map[key] = i;
        units[key] = dataHeaderUnit(raw);
        break;
      }
    }
  });
  return { map, units };
}

async function parseDataWorkbook(file) {
  const XLSX = await loadXlsxLib();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sheetName = wb.SheetNames && wb.SheetNames[0];
  if (!sheetName) throw new Error('시트를 찾지 못했습니다');
  const table = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: null });
  let headerIdx = -1;
  for (let i = 0; i < table.length; i += 1) {
    const row = table[i];
    if (Array.isArray(row) && row.some((c) => c != null && String(c).trim() !== '')) { headerIdx = i; break; }
  }
  if (headerIdx < 0) throw new Error('표에 데이터가 없습니다');
  const mapped = mapDataColumns(table[headerIdx]);
  if (mapped.map.brand == null && mapped.map.salesCurr == null) {
    throw new Error('브랜드 또는 매출 열을 찾지 못했습니다 — 양식 행을 확인해 주세요');
  }
  const cellOf = (row, key) => (mapped.map[key] == null ? null : row[mapped.map[key]]);
  const records = [];
  const skipped = [];
  for (let i = headerIdx + 1; i < table.length; i += 1) {
    const row = table[i];
    if (!Array.isArray(row)) continue;
    if (row.every((c) => c == null || String(c).trim() === '')) continue;
    const brand = cellOf(row, 'brand') == null ? '' : String(cellOf(row, 'brand')).trim();
    const salesCurr = dataNum(cellOf(row, 'salesCurr'));
    if (!brand && !(salesCurr > 0)) { skipped.push(i + 1); continue; }
    records.push({
      excelRow: i + 1,
      zoneId: cellOf(row, 'zoneId') == null ? '' : String(cellOf(row, 'zoneId')).trim(),
      brand,
      category: cellOf(row, 'category') == null ? '' : String(cellOf(row, 'category')).trim(),
      area: dataNum(cellOf(row, 'area')),
      salesCurr,
      salesPrev: dataNum(cellOf(row, 'salesPrev')),
      eff: dataNum(cellOf(row, 'efficiency')),
      commissionRate: dataNum(cellOf(row, 'commissionRate')),
      profitRate: dataNum(cellOf(row, 'profitRate')),
      units: mapped.units,
    });
  }
  if (!records.length) throw new Error('읽을 수 있는 행이 없습니다');
  return { sheetName, records, skipped, units: mapped.units };
}

/**
 * 표 레코드를 내장 도면 구역에 얹는다.
 * 도면 형상은 6칸 고정이므로 구역ID 가 있으면 그 칸에, 없으면 남은 칸에 순서대로 배정한다.
 * 매출 단위는 헤더 괄호(억·만원·천원)를 따르고, 표기가 없으면 1만 이하는 억으로 본다.
 */
function zonesFromDataRecords(records, baseZones) {
  const base = (baseZones && baseZones.length ? baseZones : ZONES_BASE);
  const byId = {};
  base.forEach((z) => { byId[z.id] = z; });
  const used = {};
  const matched = [];
  const pending = [];
  records.forEach((r) => {
    const m = /Z-\s*(\d+)/i.exec(r.zoneId || '');
    const id = m ? ('Z-' + String(Number(m[1])).padStart(2, '0')) : null;
    if (id && byId[id] && !used[id]) { used[id] = true; r.zoneIdResolved = id; matched.push(r); }
    else pending.push(r);
  });
  pending.forEach((r) => {
    let free = null;
    for (let i = 0; i < base.length; i += 1) { if (!used[base[i].id]) { free = base[i]; break; } }
    if (!free) return;
    used[free.id] = true;
    r.zoneIdResolved = free.id;
    matched.push(r);
  });
  const extra = records.filter((r) => matched.indexOf(r) < 0);
  // 표에 없는 구역은 그대로 둔다 — 일부 행만 올렸다고 도면 칸이 사라지면 안 된다.
  const built = matched.map((r) => {
    const geo = byId[r.zoneIdResolved];
    const src = geo.currentBrand || {};
    const area = r.area > 0 ? Math.round(r.area) : geo.area;
    let salesCurr = Number.isFinite(r.salesCurr) ? r.salesCurr : NaN;
    if (Number.isFinite(salesCurr)) {
      const u = (r.units && r.units.salesCurr) || (salesCurr <= 10000 ? 1e8 : 1);
      salesCurr = Math.round(salesCurr * u);
    }
    const effUnit = (r.units && r.units.efficiency) || 1e3;
    let eff = Number.isFinite(r.eff) ? Math.round((r.eff * effUnit) / 1e4) : NaN;
    if (!Number.isFinite(salesCurr) && Number.isFinite(eff)) salesCurr = Math.round(area * eff * 1e4);
    if (!Number.isFinite(eff) && Number.isFinite(salesCurr) && area > 0) eff = Math.round(salesCurr / area / 1e4);
    let salesPrev = NaN;
    if (Number.isFinite(r.salesPrev)) {
      const pu = (r.units && r.units.salesPrev) || (r.salesPrev <= 10000 ? 1e8 : 1);
      salesPrev = Math.round(r.salesPrev * pu);
    }
    return {
      ...geo,
      area,
      currentBrand: {
        name: r.brand || src.name,
        category: r.category || src.category,
        pyeongEfficiency: Number.isFinite(eff) ? eff : (src.pyeongEfficiency || 0),
        commissionRate: Number.isFinite(r.commissionRate) ? r.commissionRate : (src.commissionRate || 16),
        salesCurr: Number.isFinite(salesCurr) ? salesCurr : 0,
        salesPrev: Number.isFinite(salesPrev) ? salesPrev : (src.salesPrev || 0),
        profitRate: Number.isFinite(r.profitRate) ? r.profitRate : (src.profitRate || 16),
      },
      isReplaced: false,
    };
  });
  const byZoneId = {};
  built.forEach((z) => { byZoneId[z.id] = z; });
  const zones = base.map((z) => byZoneId[z.id] || z);
  return { zones, extra, matched: matched.length };
}

/* ---------------- 백데이터 표 (편집 가능) ----------------
 * 화면 단위는 사용자가 읽는 단위 그대로 쓴다: 매출 억, 평효율 천원/평, 비율 %.
 * 저장 단위(원, 만원/평)와 섞이지 않도록 변환은 이 두 함수 안에서만 한다.
 */
const sheetNum = (v, fallback) => {
  const n = typeof v === 'number' ? v : Number(String(v == null ? '' : v).replace(/,/g, '').trim());
  return Number.isFinite(n) ? n : fallback;
};
const sheetRate = (v) => Math.min(100, Math.max(0, sheetNum(v, 0)));
const sheetEff = (salesWon, area) => (area > 0 ? Math.round(salesWon / area / 1e3) : 0);

/** 구역 목록 → 표 행 */
function sheetRowsFromZones(list) {
  return (list || []).map((z) => {
    const b = z.currentBrand || {};
    const area = z.area > 0 ? z.area : 1;
    const salesCurr = Number.isFinite(b.salesCurr) ? b.salesCurr : Math.round(area * (b.pyeongEfficiency || 0) * 1e4);
    const salesPrev = Number.isFinite(b.salesPrev) ? b.salesPrev : 0;
    return {
      id: z.id,
      name: b.name || '',
      category: b.category || '',
      area: String(area),
      salesPrev: salesPrev ? String(+((salesPrev / 1e8).toFixed(4))) : '',
      salesCurr: String(+((salesCurr / 1e8).toFixed(4))),
      eff: String(sheetEff(salesCurr, area)),
      commission: b.commissionRate == null ? '' : String(b.commissionRate),
      profit: b.profitRate == null ? '' : String(b.profitRate),
    };
  });
}

/** 표 행 → 구역. 도면 형상·라벨 배치는 그대로 두고 값만 갈아끼운다. */
function zonesFromSheetRows(rows, base) {
  return (base || []).map((geo) => {
    const row = (rows || []).find((r) => r.id === geo.id);
    if (!row) return geo;
    const src = geo.currentBrand || {};
    const area = Math.max(1, Math.round(sheetNum(row.area, geo.area || 1)));
    const salesWon = Math.max(0, Math.round(sheetNum(row.salesCurr, 0) * 1e8));
    const prevWon = Math.max(0, Math.round(sheetNum(row.salesPrev, 0) * 1e8));
    // 매출이 있으면 평효율은 매출에서 다시 센다 — 둘이 어긋난 표가 들어와도 화면은 한 값만 갖는다.
    const effWon = salesWon > 0 ? sheetEff(salesWon, area) : Math.round(sheetNum(row.eff, 0));
    return {
      ...geo,
      area,
      currentBrand: {
        name: row.name || src.name || '',
        category: row.category || src.category || '',
        pyeongEfficiency: Math.round(effWon / 10),
        commissionRate: sheetRate(row.commission),
        salesCurr: salesWon,
        salesPrev: prevWon,
        profitRate: sheetRate(row.profit),
      },
      isReplaced: false,
    };
  });
}
